      const wrap = document.createElement('div'); wrap.className = 'orow'; wrap.append(info);
      const th = thumbOf(o); if (th) wrap.append(th);
      el.append(wrap);
      el.dataset.id = o.id;
      el.onclick = () => selectOrder(o.id);
      row.append(el);
      box.append(row);
    }
    showListMsg();
    if (S.views.length) updateListHead(); // 済の数が変わったら見出しにも反映
  }
  // 件数の案内。リスト自体が0件と、絞り込みで0件を分けて言う。一覧の読み込み失敗の案内もこれで消える
  function showListMsg() {
    const n = S.orders.length, shown = S.shown ?? n, fl = FILTERS.find(x => x[0] === S.filter)?.[1] || '';
    if (!S.listAt && !n) return;
    S.listMsgErr = false;
    if (!n) say($('listMsg'), 'このリストに作業はありません');
    else if (S.filter !== 'all' && !shown) say($('listMsg'), `「${fl}」に当たる受注はありません（全${n}件）`);
    else if (S.filter !== 'all') say($('listMsg'), `「${fl}」で絞り込み中: 表示${shown}件／全${n}件`);
    else say($('listMsg'), `${n}件`);
  }

  // 見ている作業リストの工程（自分の工程）が済んでいるか。済なら { label, who } を返す
  // ・その工程の記録（氏名 日時）がある ・進行社内がその工程の値（旧い名前も含む）
  // ・進行社内グループが「最終」（仕上がった受注は、それより前の自分の工程も済んでいる）
  function mineDone(o, v) {
    if (!v || !(v.mine || []).length) return null;
    for (const k of v.mine) {
      const s = S.steps.find(x => x.key === k); if (!s) continue;
      if (o.done[k]) return { label: s.label, who: shortStamp(o.done[k]) };
      if (s.variants.some(x => x.value === o.progIn)) return { label: s.label, who: '' };
    }
    if ((v.mineValues || []).includes(o.progIn)) return { label: o.progIn, who: '' };
    if (o.group === '最終') return { label: v.label, who: '仕上がり済' };
    return null;
  }
  // 作業リストが受け持つ部屋（工程(自動) のタグ）。完了ボタンのある工程はそのタグ、ボタンの無い部屋はリストのキーから
  const VIEW_TAG = { nao: 'Nao', f2: '2F_小', dansai: '断裁ステッチ', pre: 'プレ' };
  function viewTags(v) {
    const tags = (v.mine || []).flatMap(k => (S.steps.find(s => s.key === k)?.variants || []).map(x => x.tag)).filter(Boolean);
    if (VIEW_TAG[v.key]) tags.push(VIEW_TAG[v.key]);
    return tags;
  }
  // その部屋の工程が済んでいるか。部屋の作業リストの「済」（青枠）と同じ基準で見る（Nao は シール貼完了 など）
  function tagDone(o, tag) {
    const vs = S.views.filter(x => viewTags(x).includes(tag));
    if (vs.length) return vs.some(x => mineDone(o, x));
    const s = S.steps.find(x => x.variants.some(v => v.tag === tag));
    return !!(s && doneSteps(o).some(x => x.s.key === s.key));
  }
  // 自分の工程はまだだが、もうすぐ自分の番の受注（2026-10-22）。緑枠にする。
  // ・ほかの工程がどれか済んでいる。工程表発行済（印刷日時）や 抜き作業中 のような記録の無い進行、材料・在庫の状況は数えない
  // ・品名の #タグの並びで自分より前の部屋が全部済んでいる（#o#nao#ki の機械貼は、オートンと Nao の両方が済むまで緑枠にしない）
  // ・材料の入荷（進行社外が readyOut。機械貼は 機械貼材料入荷済、オートン・たおしは シート材料入荷済・在庫シート利用）も、工程が済んだのと同じに数える。
  //   前の部屋が全部済んでいることは材料のときも求める
  // 返すのは一番新しく済んだ工程（材料の入荷ならその値）
  function mineReady(o, v) {
    if (!v || !(v.mine || []).length || o.closed || mineDone(o, v)) return null;
    const list = doneSteps(o).filter(x => x.s.group !== 'status');
    const mat = (v.readyOut || []).includes(o.progOut) ? o.progOut : '';
    if (!list.length && !mat) return null;
    const tags = itemTags(o), mine = viewTags(v);
    const at = tags.findIndex(t => mine.includes(t));
    if (at > 0 && !tags.slice(0, at).every(t => tagDone(o, t))) return null;
    return { label: mat || list[list.length - 1].s.label + ' 済' };
  }

  /* ---------- 工程を選ぶ ---------- */
  const current = () => S.orders.find(o => o.id === S.sel);
  const hasTag = (o, tag) => !!tag && String(o.kotei || '').includes('|' + tag + '|');

  function selectOrder(id) {
    S.sel = id; S.pendingStep = null; renderOrders(); renderSteps(); showCloseLabel();
    $('stepCard').hidden = false; say($('stepMsg'), '');
    $('stepCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 記録せずに一覧へ戻る（2026-10-23）。選んだ行の表示は残し、その行まで戻る。閉じたので自動の読み直しも再開する
  $('closeDetail').onclick = () => {
    const id = S.sel;
    $('stepCard').hidden = true; $('variants').hidden = true; S.pendingStep = null;
    renderOrders();
    const row = id && document.querySelector(`.order[data-id="${id}"]`);
    if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.focus({ preventScroll: true }); }
  };
  function showCloseLabel() { $('closeDetail').textContent = S.mode === 'list' ? '← 一覧へ戻る' : '← 閉じる'; }

  /* ---------- 書き込みの結果が分からないとき（2026-10-23） ---------- */
  // 通信が切れた・応答が読めない書き込みは、保存されたかもしれないし、されていないかもしれない。
  // 送り直しはせず、この受注の記録・変更ボタンを止めて「記録の状態を確認」（読み取りだけ）を案内する
  function markUnsure(o, what) {
    S.unsure = { id: o.id, what };
    renderSteps();
    say($('stepMsg'), '');
    $('unsureBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function applyUnsure(o) {
    const on = !!(S.unsure && o && S.unsure.id === o.id);
    $('unsureBox').hidden = !on;
    if (!on) return;
    $('unsureText').textContent = `通信が途切れ、${S.unsure.what}が保存されたか確認できません（保存されなかったとは限りません）。` +
      'もう一度押す前に「記録の状態を確認」で最新の状態を読み込んでください。確認できるまで、この受注のボタンは押せません。';
    $('stepCard').querySelectorAll('.step, .undo, .room, .amtbtn, .variants button').forEach(b => { b.disabled = true; });
  }
  // 最新の状態を読み込む（読み取りだけ）。読めたときだけ「確認できた」とし、開いている受注のカードも作り直す
  $('unsureBtn').onclick = async () => {
    const o = current(); if (!o) return;
    $('unsureBtn').disabled = true;
    say($('stepMsg'), '最新の状態を読み込んでいます…');
    const ok = S.mode === 'list' ? await loadView(S.view, true) : await reloadFind(o);
    $('unsureBtn').disabled = false;
    if (!ok) return say($('stepMsg'), '読み込めなかったので、まだ確認できていません。電波を確かめてもう一度押してください', 'err');
    syncDetail('最新の状態を読み込みました。記録・変更が反映されているか確かめてください');
  };
  // 品番で探す画面の受注を読み直す（読み取りだけ）
  async function reloadFind(o) {
    const j = await api({ action: 'orders', book: o.book, wc: String(o.wc) });
    if (!j.ok || !Array.isArray(j.orders)) return false;
    S.orders = j.orders; S.steps = j.steps || S.steps; S.rooms = j.rooms || S.rooms;
    renderOrders();
    return true;
  }
  // 手で最新を読んだ後に、開いている受注のカードを合わせる。受注が一覧から外れていたら閉じて知らせる。
  // 自動の読み直しでは呼ばない（入力中の数量・納期を消さないため）
  function syncDetail(text) {
    if ($('stepCard').hidden || !S.sel) return;
    const id = S.sel;
    if (S.unsure && S.unsure.id === id) S.unsure = null;
    if (!current()) {
      $('stepCard').hidden = true; $('variants').hidden = true; S.sel = null;
      renderOrders();
      say(S.mode === 'list' ? $('listMsg') : $('findMsg'), `${text}（開いていた受注はこの一覧から外れました）`, 'warn');
      return;
    }
    renderSteps();
    say($('stepMsg'), text, 'ok');
  }

  function renderSteps() {
    const o = current(); if (!o) return;
    const t = $('target'); t.textContent = '';
    const it = document.createElement('div'); it.className = 'item'; it.textContent = o.item || '(品名なし)';
    const mt = document.createElement('div'); mt.className = 'meta';
    mt.textContent = `${o.book} / ${o.wc} ・ 今の進行: ${o.progIn || 'なし'}`;
    t.append(it, facts(o), mt, goBar(o), amountEditor(o), ndateEditor(o));
    renderStepImages(o);

    const box = $('steps'); box.textContent = '';
    const lastKey = latestKey(o);
    let lastGroup = '';
    for (const s of S.steps) {
      if (s.group !== lastGroup) {
        const h = document.createElement('div'); h.className = 'stephead' + (s.group === 'status' ? ' status' : '');
        h.textContent = s.group === 'status' ? '状況（材料・在庫）' : '工程の完了';
        box.append(h); lastGroup = s.group;
      }
      const done = o.done[s.key];
      // Airtable で直接入れた（記録者なし）の完了も済として扱う
      const byProg = !done && s.variants.some(v => v.value === o.progIn);
      if (done || byProg) {
        // 2026-10-23 済の工程は押せない表示（工程名・済・記録者・日時）にし、取り消しは下の「記録を取り消す」に分ける。
        // 以前は済のボタンをもう一度押すと取り消しの確認になり、確かめるつもりで押して取り消しに進みやすかった
        const cell = document.createElement('div'); cell.className = 'stepcell';
        const st = document.createElement('div');
        st.className = 'step done ' + (s.key === lastKey ? 'now' : 'past') + (s.group === 'status' ? ' status' : '');
        st.append(document.createTextNode('✓ ' + s.label));
        const sm = document.createElement('small');
        sm.textContent = done ? '済 ' + fullStamp(done) : '済（記録者なし）';
        st.append(sm);
        const un = document.createElement('button'); un.type = 'button'; un.className = 'undo'; un.textContent = '記録を取り消す';
        un.setAttribute('aria-label', `「${s.label}」の記録を取り消す`);
        un.onclick = () => cancelStep(s, done);
        cell.append(st, un);
        box.append(cell);
        continue;
      }
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'step' + (s.group === 'status' ? ' status' : '');
      if (s.variants.some(v => hasTag(o, v.tag))) btn.classList.add('rec');
      btn.append(document.createTextNode(s.label));
      btn.onclick = () => chooseStep(s);
      box.append(btn);
    }
    box.append(stockCell(o, SHEET_ARRIVED_OUT), stockCell(o, STOCK_OUT));
    $('variants').hidden = true;
    renderRooms(o);
  }

  /* ---------- 状況: 進行社外「シート材料入荷済」「在庫シート利用」（2026-10-23 / 10-29） ---------- */
  // 他の状況ボタンは 進行社内 に書くが、これらは 進行社外 に書く。伝票発行の判定に使う欄なので、
  // 空白か材料待ち（シート手配待ち／シート手配済み）のときだけ押せる（サーバーも同じ決まりで弾く）
  // シート材料入荷済 は入荷を確かめた報告としてインセンティブに数える（取り消せば数えない）
  const STOCK_OUT = '在庫シート利用';
  const SHEET_ARRIVED_OUT = 'シート材料入荷済';
  const STOCK_REPLACEABLE = ['', 'シート手配待ち', 'シート手配済み'];
  function stockCell(o, out) {
    if (o.progOut === out) {
      const cell = document.createElement('div'); cell.className = 'stepcell';
      const st = document.createElement('div'); st.className = 'step done past status';
      st.append(document.createTextNode('✓ ' + out));
      const sm = document.createElement('small'); sm.textContent = '進行社外に入っています'; st.append(sm);
      const un = document.createElement('button'); un.type = 'button'; un.className = 'undo'; un.textContent = '取り消す';
      un.setAttribute('aria-label', `進行社外の「${out}」を取り消す`);
      un.onclick = () => setStockOut(o, false, out);
      cell.append(st, un);
      return cell;
    }
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'step status';
    btn.append(document.createTextNode(out));
    const sm = document.createElement('small');
    const can = STOCK_REPLACEABLE.includes(o.progOut || '');
    sm.textContent = can ? '進行社外に入れる' : `進行社外が「${o.progOut}」なので変えられません`;
    btn.append(sm);
    btn.disabled = !can;
    btn.onclick = () => setStockOut(o, true, out);
    return btn;
  }
  async function setStockOut(o, on, out) {
    if (!on && !confirm(`進行社外の「${out}」を取り消しますか？\n入れる前の値（シート手配済み など）に戻します。`)) return;
    say($('stepMsg'), on ? '進行社外に記録しています…' : '取り消しています…');
    document.querySelectorAll('.step, .undo').forEach(b => b.disabled = true);
    const j = await write({ action: 'stock', id: o.id, on, out });
    document.querySelectorAll('.step, .undo').forEach(b => b.disabled = false);
    if (outcomeUnknown(j, x => typeof x.progOut === 'string')) return markUnsure(o, on ? `「${out}」の記録` : `「${out}」の取り消し`);
    if (!j.ok) {
      say($('stepMsg'), j.error || '進行社外を変えられませんでした', 'err');
      if (j.stale) await refreshCurrent();
      else renderSteps();
      return;
    }
    o.progOut = j.progOut;
    navigator.vibrate?.(40);
    // 着手可・材料の表示が変わるので、作業リストは取り直してから戻る
    if (S.mode === 'list') await loadView(S.view, true);
    backToRow(o.id, on ? `進行社外を「${out}」にしました` : `進行社外の「${out}」を取り消しました（進行社外: ${j.progOut || '空白'}）`, on ? 'ok' : 'warn');
  }

  /* ---------- Room（応援を頼む部屋） ---------- */
  // Airtable の選択肢の色名（blueLight2 など）を、暗い画面で見える色にする
  const ROOM_COLORS = { blue: '#2563eb', cyan: '#0891b2', teal: '#0d9488', green: '#16a34a', yellow: '#ca8a04',
    orange: '#ea580c', red: '#dc2626', pink: '#db2777', purple: '#9333ea', gray: '#64748b' };
  function roomColor(name) {
    const c = S.rooms.find(r => r.name === name)?.color || '';
    return ROOM_COLORS[/^[a-z]+/.exec(c)?.[0]] || '#4f8cff';
  }
  // 部屋名 → 工程(自動) のタグ名（手貼(花 神) → 花。それ以外は同じ名前）。サーバーが返す
  const roomTag = (name) => S.rooms.find(r => r.name === name)?.tag || name;
  function renderRooms(o) {
    const box = $('rooms'); box.textContent = '';
    $('roomHead').hidden = !S.rooms.length;
    for (const r of S.rooms) {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'room';
      const on = (o.room || []).includes(r.name);
      if (hasTag(o, r.tag || r.name)) btn.classList.add('def');
      if (on) { btn.classList.add('on'); btn.style.setProperty('--rc', roomColor(r.name)); }
      btn.textContent = (on ? '✓ ' : '') + r.name;
      btn.onclick = () => toggleRoom(o, r.name, !on);
      box.append(btn);
    }
    applyUnsure(o); // 工程カードの最後に描くので、結果不明のときのボタン止めもここでまとめて掛ける
  }
  async function toggleRoom(o, room, on) {
    if (!on && !confirm(`Room から「${room}」を外しますか？`)) return;
    say($('stepMsg'), on ? `Room に ${room} を入れています…` : `Room から ${room} を外しています…`);
    document.querySelectorAll('.room').forEach(b => b.disabled = true);
    const j = await write({ action: 'room', id: o.id, room, on });
    document.querySelectorAll('.room').forEach(b => b.disabled = false);
    if (outcomeUnknown(j, x => Array.isArray(x.room))) return markUnsure(o, `Room（${room}）の変更`);
    if (!j.ok) return say($('stepMsg'), j.error || 'Room を変えられませんでした', 'err');
    o.room = j.room;
    navigator.vibrate?.(40);
    say($('stepMsg'), on ? `Room に「${room}」を入れました` : `Room から「${room}」を外しました`, on ? 'ok' : 'warn');
    renderRooms(o); renderOrders();
  }

  function chooseStep(s) {
    const o = current();
    if (!o) return;
    if (s.variants.length > 1 && $('stepCard').hidden) { selectOrder(o.id); }
    if (s.variants.length === 1) return doComplete(s, s.variants[0]);
    // 抜き・手貼りは種類を選ぶ。工程(自動)から分かるものを目立たせる
    S.pendingStep = s;
    const box = $('variants'); box.textContent = ''; box.hidden = false;
    for (const v of s.variants) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = v.label;
      if (hasTag(o, v.tag)) b.classList.add('rec');
      b.onclick = () => doComplete(s, v);
      box.append(b);
    }
    say($('stepMsg'), `${s.label}の種類を選んでください`);
  }

  async function doComplete(s, v, force) {
    const o = current(); if (!o) return;
    if (!force && o.group === '最終' && s.key !== 'finish' &&
        !confirm(`この受注はもう「${o.progIn}」です。\n${v.value} にしてよいですか？`)) return;
    say($('stepMsg'), '記録しています…');
    document.querySelectorAll('.step, .undo, .variants button').forEach(b => b.disabled = true);
    const j = await write({ action: 'complete', id: o.id, step: s.key, variant: v.key, force: !!force });
    document.querySelectorAll('.step, .undo, .variants button').forEach(b => b.disabled = false);
    if (j.conflict) {
      // 他の人が先に記録していた。上書きはせず、最新の状態を見せる
      say($('stepMsg'), `${j.error}。取り消すときは「記録を取り消す」を押してください`, 'warn');
      return refreshCurrent();
    }
    // 応答が無い・読めない・必要な値が欠けている: 記録できたかどうか分からない。完了扱いにせず、送り直しもしない
    if (outcomeUnknown(j, x => !!x.stamp && !!x.value)) return markUnsure(o, `「${v.value}」の記録`);
    if (!j.ok) return say($('stepMsg'), j.error || '記録できませんでした', 'err');
    o.done[s.key] = j.stamp; o.progIn = j.value; o.group = (s.key === 'finish') ? '最終' : o.group;
    navigator.vibrate?.([40, 40, 40]);
    // ビューの条件で行が消えることがあるので、作業リストは取り直してから戻る
    if (S.mode === 'list') await loadView(S.view, true);
    backToRow(o.id, `${j.value} を記録しました`, 'ok');
  }

  async function cancelStep(s, done) {
    const o = current(); if (!o) return;
    if (!confirm(`「${s.label}」${done ? `の記録（${done}）` : ''}を取り消しますか？\n進行社内は、この工程を記録する前の状態に戻します。`)) return;
    say($('stepMsg'), '取り消しています…');
    document.querySelectorAll('.step, .undo').forEach(b => b.disabled = true);
    const j = await write({ action: 'cancel', id: o.id, step: s.key });
    document.querySelectorAll('.step, .undo').forEach(b => b.disabled = false);
    if (outcomeUnknown(j, x => typeof x.progIn === 'string')) return markUnsure(o, `「${s.label}」の取り消し`);
    if (!j.ok) {
      say($('stepMsg'), j.error || '取り消せませんでした', 'err');
      if (j.stale) await refreshCurrent();
      return;
    }
    delete o.done[s.key]; o.progIn = j.progIn;
    if (o.group === '最終' && o.progIn !== '仕上がりました') o.group = '';
    if (S.mode === 'list') await loadView(S.view, true);
    backToRow(o.id, `「${s.label}」を取り消しました（進行社内: ${o.progIn || '空白'}）`, 'warn');
  }

  // 工程カードを閉じて、押した受注の行まで戻り、その行を一瞬光らせる
  function backToRow(id, text, cls) {
    $('stepCard').hidden = true; $('variants').hidden = true; S.sel = id;
    renderOrders();
    const msgEl = S.mode === 'list' ? $('listMsg') : $('findMsg');
    const row = document.querySelector(`.order[data-id="${id}"]`);
    if (!row) {
      // 一覧にはあるが絞り込みで隠れた（着手可 → 自工程済 になった等）のか、ビューの条件で一覧から消えたのかを分けて言う
      const fl = FILTERS.find(x => x[0] === S.filter)?.[1];
      const why = S.mode === 'list' && S.filter !== 'all' && S.orders.some(x => x.id === id)
        ? `この受注は「${fl}」の絞り込みから外れました。「すべて」で表示できます` : 'この受注は一覧から外れました';
      S.sel = null; renderOrders();
      say(msgEl, `${text}（${why}）`, cls); return;
    }
    say(msgEl, text, cls);
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  }

  // 一覧を取り直し、選んでいた受注がまだあれば選び直す
  async function refreshCurrent() {
    const id = S.sel;
    if (S.mode === 'list') await loadView(S.view, true); else await search();
    if (id && S.orders.some(x => x.id === id)) selectOrder(id); else { $('stepCard').hidden = true; S.sel = null; }
  }

  // URLで品番を渡されたら（?book=Ta&wc=230）すぐ探す
  const q = new URLSearchParams(location.search);
  // ?view=omamori のように作業リストを直接開ける（ホーム画面のショートカット用）
  if (q.get('view')) { store.set('process.view', q.get('view')); store.set('process.mode', 'list'); }
  if (q.get('book') && q.get('wc')) { setBook(q.get('book')); $('wc').value = q.get('wc'); setMode('find'); search(); }
  else setMode(store.get('process.mode') === 'find' ? 'find' : 'list');
})();
</script>
</body>
</html>
