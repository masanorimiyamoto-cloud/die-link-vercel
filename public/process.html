<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>工程の完了を記録</title>
<script>
  // 背景の白／黒は端末ごとに覚える。描く前に決めて、黒→白のちらつきを出さない
  // SHELF は白の上に重ねる配色（白で直した読みやすさをそのまま使い、色と形だけ替える）
  try {
    const t = localStorage.getItem('dl.theme');
    if (t === 'light' || t === 'vivant') document.documentElement.dataset.theme = t;
    if (t === 'shelf') { document.documentElement.dataset.theme = 'light'; document.documentElement.dataset.skin = 'shelf'; }
  } catch {}
</script>
<style>
  /* 見た目は Airtable を手本に整えた（2026-10-08）: 細い線・丸い札・平らな色・「小さなラベル＋大きな値」。
     太さは 本文 500／見出し・値 600 を基本にし、800 は使わない。暗い画面と大きめの文字はそのまま */
  :root{ --bg:#0f1115; --surf:#171a20; --surf2:#1e222a; --hover:#262b35;
    --txt:#e8eaee; --mut:#9aa1ad; --dim:#8b93a1; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --card:var(--surf); --a:#3b82f6; --a-soft:rgba(59,130,246,.18); --p:#8b5cf6;
    --ok:#22c55e; --err:#f87171; --warn:#f59e0b; --r:10px;
    /* 状態の色（2026-10-23）。一覧の札・枠、社内／社外の流れ、工程ボタンで同じ意味に同じ色を使う。
       着手できる＝緑 / 自分の工程が済＝青 / 材料・前工程待ち＝黄土 / 納期超過・要確認＝赤 / 補助＝灰。
       Room の色・探す／生地のボタンなど、状態でない色はここに入れない */
    --st-ready:#22c55e; --st-ready-bg:rgba(34,197,94,.10); --st-ready-badge:#15803d; --st-ready-ink:#fff;
    --st-done:#60a5fa; --st-done-bg:rgba(59,130,246,.14); --st-done-badge:#2563eb; --st-done-ink:#fff; --st-done-txt:#bfdbfe;
    --st-wait:#f59e0b; --st-wait-bg:rgba(245,158,11,.14); --st-wait-txt:#fde68a;
    --st-late:#f87171; --st-late-bg:rgba(248,113,113,.16); --st-late-txt:#fecaca;
    --st-note:#9aa1ad; --sel:#e8eaee; --focus:#93c5fd; }
  *{ box-sizing:border-box } [hidden]{ display:none !important }
  html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;
    font-weight:500; -webkit-font-smoothing:antialiased; line-height:1.45 }
  .wrap{ max-width:640px; margin:0 auto; padding:12px 14px 40px; display:flex; flex-direction:column; gap:12px }
  body.has-head .wrap{ padding-top:calc(var(--headh, 48px) + 10px) }
  /* 2026-10-20 実機で fixed の見出しまで一緒に流れたため、作業リストのときはページ全体を動かさず
     本文（.wrap）だけをスクロールさせる。見出しはスクロールする箱の外なので、端末に関係なく動かない */
  body.has-head{ overflow:hidden; height:100vh; height:100dvh }
  body.has-head .wrap{ height:100vh; height:100dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; box-sizing:border-box }
  body.has-head .card, body.has-head .order{ scroll-margin-top:calc(var(--headh, 48px) + 10px) } /* 自動スクロールで見出しの下に隠れないように */
  .bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px; color:var(--mut) }
  .bar b{ color:var(--txt); font-weight:600 } .bar a{ color:#93c5fd; text-decoration:none }
  h1{ margin:2px 0 0; font-size:21px; font-weight:600; letter-spacing:.04em }
  .card{ background:var(--surf); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px }
  /* 作業リストの見出し。下へスクロールしても上に残り、押すと一番上の行へ戻る（2026-10-17） */
  /* 2026-10-17 sticky は実機で一緒に流れてしまったので fixed で画面の上に固定し、その高さぶん本文を下げる */
  .listhead{ position:fixed; top:0; left:0; right:0; max-width:640px; margin:0 auto; z-index:30; padding:12px 16px; border:0; border-radius:0;
    background:var(--surf); border-bottom:1px solid var(--line); color:var(--txt); text-align:left;
    display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:2px 8px; font-size:18px; font-weight:600; cursor:pointer }
  .listhead > span:first-child{ flex:1 1 auto }
  .listhead .cnt{ font-size:14px; font-weight:500; color:var(--mut); white-space:nowrap }
  /* 見出しは1行に収める（長いリスト名は末尾を…で省く）。2行になると本文の下げ幅が変わり、ボタンに重なりやすい */
  .listhead > span:first-child{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .listhead .up{ font-size:13px; font-weight:500; color:var(--mut); white-space:nowrap; opacity:0; transition:opacity .2s }
  .listhead.stuck{ box-shadow:0 6px 14px rgba(0,0,0,.35) }
  .listhead.stuck .up{ opacity:1 }
  .row{ display:flex; gap:8px; align-items:center }
  input, select{ font:inherit; font-size:19px; padding:10px 12px; border-radius:var(--r); border:1px solid var(--line2);
    background:var(--surf2); color:var(--txt); outline:none }
  input:focus, select:focus{ border-color:var(--a); box-shadow:0 0 0 3px var(--a-soft) }
  input{ min-width:0 } select{ padding:10px 8px }
  #book{ width:5.2em } #wc{ flex:1 }
  /* タブは Airtable の切替のような、枠の中で一段明るく浮く形 */
  .tabs{ display:flex; gap:4px; background:var(--surf); border:1px solid var(--line); padding:4px; border-radius:12px }
  .tabs button{ flex:1; padding:11px 6px; font-size:16px; font-weight:500; background:transparent; color:var(--mut); border-radius:9px }
  .tabs button.on{ background:var(--hover); color:var(--txt); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.4), inset 0 0 0 1px var(--line2) }
  /* ビューの切替は丸い札。選んだものだけ色を付ける */
  .chips{ display:flex; gap:6px; flex-wrap:wrap; align-items:center }
  .chips button{ padding:7px 13px; font-size:14px; font-weight:500; border-radius:999px; background:var(--surf2); color:var(--mut); border:1px solid var(--line) }
  .chips button.on{ background:rgba(139,92,246,.18); color:#ddd6fe; border-color:rgba(139,92,246,.55); font-weight:600 }
  .chips .sp{ flex:1 }
  .lrow{ display:flex; gap:8px; align-items:stretch }
  .lrow .order{ flex:1; min-width:0 }
  .order .item{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere }
  .wrap > *, .card > *{ min-width:0 }
  .late{ color:#fca5a5 }
  /* 一覧の進行は 上段 社外／下段 社内 の流れ（A → B → C）。今の段階だけ光る四角で囲み、前の段階は控えめに（2026-10-14） */
  .prog{ display:flex; flex-direction:column; gap:6px; margin-top:2px }
  .prog .tags{ display:flex; flex-wrap:wrap; gap:5px }
  .flow{ display:flex; flex-wrap:wrap; align-items:center; gap:5px 4px }
  .flow .fl{ flex:0 0 2.4em; font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--dim) }
  .fs{ display:inline-flex; flex-direction:column; align-items:center; font-size:12.5px; line-height:1.3; padding:3px 8px;
    border-radius:6px; border:1px solid var(--line2); color:var(--mut) }
  .fs small{ font-size:10.5px; font-weight:500; opacity:.8; font-variant-numeric:tabular-nums }
  .farr, .fnone{ color:var(--dim); font-size:12px }
  /* この先の工程は点線の枠と控えめな色で。半透明にすると小さい文字が読みにくくなるので透明度は下げない（2026-10-23） */
  .fs.todo{ border-style:dashed; color:var(--dim) }
  .farr.todo{ opacity:.6 }
  /* 流れの「今」の色は下の「状態の色」の欄（社内＝済の青、社外＝待ちの黄土、入荷確認済み＝緑、知らせ＝赤） */
  .pc{ font-size:12.5px; font-weight:500; padding:2px 9px; border-radius:999px; line-height:1.55;
    background:rgba(255,255,255,.06); color:var(--mut); border:1px solid transparent }
  .memo{ font-size:13px; color:#fde68a; font-weight:500; padding:4px 8px; border-radius:6px;
    background:rgba(245,158,11,.08); border-left:2px solid rgba(245,158,11,.6) }
  /* 仕上がり数量の変更 */
  .facts .from{ font-size:12px; font-weight:500; color:#93c5fd; margin-left:6px; letter-spacing:0 }
  .amt{ display:flex; flex-wrap:wrap; gap:8px; align-items:center }
  .amt input{ width:7.5em; font-size:22px; font-weight:600; text-align:right; font-variant-numeric:tabular-nums }
  .amt input[type=date]{ width:auto; font-size:19px; text-align:left; color-scheme:dark }
  .amt .note{ font-size:12.5px; color:var(--mut) }
  .amtbtn{ padding:7px 12px; font-size:14px; font-weight:500; background:var(--surf2); color:var(--txt); border:1px solid var(--line2) }
  /* 数量は青、納期はオレンジで見分ける（やめる ボタンは灰色のまま） */
  .amtbtn.qty{ background:rgba(59,130,246,.12); color:#bfdbfe; border-color:rgba(96,165,250,.4) }
  .amtbtn.date{ background:rgba(249,115,22,.11); color:#fed7aa; border-color:rgba(251,146,60,.4) }
  /* 選んだ受注から「探す」（型の場所）へ。トップの探すボタンと同じ緑（グラデーションをやめ平らな色に） */
  .findbtn{ display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:var(--r);
    font-size:17px; font-weight:600; color:#fff; text-decoration:none; letter-spacing:.03em; background:#16a34a }
  .findbtn:active{ filter:brightness(.92) }
  .findbtn small{ font-size:12.5px; font-weight:500; opacity:.85 }
  /* 「生地を照合」は トップの知るボタンと同じ青。探すと横に並べる */
  .findbtn.fabric{ background:#2563eb }
  .gobar{ display:grid; grid-template-columns:1fr 1fr; gap:8px }
  .gobar .findbtn{ flex-direction:column; gap:1px; padding:10px 6px; text-align:center }
  /* 画像: 行の右に小さく、選んだ受注では大きく、押すと全画面 */
  .orow{ display:flex; gap:12px; align-items:flex-start; width:100% }
  .orow .info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px }
  .thumb{ flex:0 0 36px; width:36px; height:36px; border-radius:8px; overflow:hidden; background:#fff;
    border:1px solid var(--line2); display:flex; align-items:center; justify-content:center; position:relative }
  .thumb img{ width:100%; height:100%; object-fit:contain; background:#fff }
  .thumb .n{ position:absolute; right:1px; bottom:1px; font-size:9.5px; font-weight:600; padding:0 4px; border-radius:999px; background:rgba(0,0,0,.7); color:#fff }
  .imgs{ display:flex; gap:8px; overflow-x:auto }
  .imgs img{ max-height:40vh; max-width:100%; border-radius:8px; background:#fff; cursor:zoom-in; flex:0 0 auto; border:1px solid var(--line2) }
  .imgnote{ font-size:12.5px; color:var(--mut) }
  .viewer{ position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.94); display:flex; flex-direction:column }
  .viewer .vbar{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; color:#fff; font-size:14px }
  .viewer .vbar a{ color:#93c5fd }
  .viewer .vimg{ flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; touch-action:pinch-zoom }
  .viewer .vimg img{ max-width:100%; max-height:100%; background:#fff }
  .viewer .vimg.zoom{ align-items:flex-start; justify-content:flex-start }
  .viewer .vimg.zoom img{ max-width:none; max-height:none }
  button{ font:inherit; font-weight:600; border:0; border-radius:var(--r); color:#fff; cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:background-color .12s, border-color .12s }
  button:active{ transform:scale(.985) } button:disabled{ opacity:.5 }
  .btn{ padding:11px 14px; background:var(--a); white-space:nowrap }
  .ghost{ background:var(--surf2); color:var(--txt); border:1px solid var(--line2) }
  .camwrap{ position:relative; border-radius:var(--r); overflow:hidden; background:#000; aspect-ratio:4/3 }
  video{ width:100%; height:100%; object-fit:cover; display:block }
  .camhint{ position:absolute; left:0; right:0; bottom:0; padding:8px; font-size:13px; text-align:center; background:rgba(0,0,0,.55) }
  /* 受注の行は Airtable のレコードカードのように: 一段明るい面＋細い線。選ぶと青い枠と左の帯 */
  .order{ text-align:left; padding:12px 12px 12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surf2);
    color:var(--txt); display:flex; flex-direction:column; gap:4px; font-weight:500 }
  /* 一覧の札（着手可・済・待ち・状態未確認・選択中）。枠と色は下の「状態の色」の欄 */
  .badges{ display:flex; flex-wrap:wrap; gap:6px; align-items:center }
  .minebadge{ display:inline-flex; align-items:center; gap:6px; font-size:15px; font-weight:700; border-radius:8px; padding:3px 10px; line-height:1.4 }
  .minebadge small{ font-size:12px; font-weight:500; opacity:.95 }
  .selmark{ font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--sel); color:var(--bg) }
  .order.closed{ opacity:.5 }
  .order .item{ font-size:21px; font-weight:600; line-height:1.4; letter-spacing:.01em }
  .order .meta, .target .meta{ font-size:13px; color:var(--mut); font-weight:500; font-variant-numeric:tabular-nums }
  .target{ font-size:15px; line-height:1.5; display:flex; flex-direction:column; gap:6px }
  .target .item{ font-size:20px; font-weight:600; line-height:1.4 }
  /* 数量と納期は一番大きく（Airtable で小さくて読みにくかった点の改善）。ラベルは小さく控えめ、値は大きく */
  .facts{ display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 22px; font-size:12px; font-weight:500; color:var(--dim); letter-spacing:.06em }
  .facts b{ font-weight:600; font-size:24px; line-height:1.2; color:var(--txt); letter-spacing:.01em; margin-left:6px; font-variant-numeric:tabular-nums }
  .facts .late b{ color:#f87171 } .facts .soon b{ color:#fbbf24 }
  .facts .when{ font-size:12px; font-weight:600; margin-left:6px; padding:1px 8px; border-radius:999px; letter-spacing:0; vertical-align:3px }
  .facts .late .when{ background:rgba(248,113,113,.16); color:#fca5a5 }
  .facts .soon .when{ background:rgba(251,191,36,.16); color:#fde68a }
  /* 抜型状況（Airtable の選択肢の色に寄せる）。未仕舞は注意として目立たせる */
  .pc.die.d-check{ background:rgba(168,85,247,.16); color:#e9d5ff }
  .pc.die.d-stored{ background:rgba(34,211,238,.13); color:#a5f3fc }
  .pc.die.d-notyet{ background:#be185d; color:#fff; font-weight:600 }
  .pc.die.d-new{ background:rgba(59,130,246,.16); color:#bfdbfe }
  .pc.die.d-fix{ background:rgba(234,179,8,.15); color:#fde68a }
  /* 見出しは Airtable の欄名のように小さく控えめに、下に細い線 */
  .steps{ display:grid; grid-template-columns:1fr 1fr; gap:8px }
  .stephead, .roomhead{ grid-column:1/-1; font-size:12.5px; font-weight:600; letter-spacing:.08em; color:#93c5fd;
    margin-top:8px; padding-bottom:6px; border-bottom:1px solid var(--line) }
  .stephead.status{ color:#fcd34d }
  /* 工程ボタン: 未記録は暗く（OFF）、記録済みは明るく（ON）。明るい紫だと押されているように見えたため（2026-10-03） */
  .step{ min-height:68px; padding:8px; font-size:17px; font-weight:600; letter-spacing:.02em; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
    background:#161e2b; color:rgba(232,234,238,.88); border:1px solid rgba(96,165,250,.25) }
  /* グループごとに薄く色を分ける: 工程＝青み、状況＝黄土色み、Room＝紫み（2026-10-06） */
  .step.status{ background:#211c12; color:rgba(254,243,199,.88); border:1px solid rgba(245,158,11,.3) }
  .step.rec{ border:1.5px solid #fde68a; color:#fff }
  .step small{ font-size:11.5px; font-weight:500; letter-spacing:0; opacity:.9 }
  /* 済の工程は押しても何も起きない表示（2026-10-23）。取り消しは下の「記録を取り消す」から。ボタンの中にボタンは入れない */
  .stepcell{ display:flex; flex-direction:column; gap:4px; min-width:0 }
  .stepcell .step{ flex:1; border-radius:var(--r); text-align:center }
  .undo{ padding:6px 8px; font-size:13px; font-weight:500; background:transparent; color:var(--mut); border:1px solid var(--line2) }
  /* 結果を確かめられなかった書き込みの案内（要確認＝赤の系統） */
  .unsure{ display:flex; flex-direction:column; gap:8px; padding:10px 12px; border-radius:var(--r);
    border:2px solid var(--st-late); background:var(--st-late-bg); color:var(--st-late-txt); font-size:14px; line-height:1.5 }
  .unsure .btn{ align-self:flex-start }
  /* Room: 普段の部屋（品名タグから）は明るい枠。Room に入っている部屋は Airtable の色で塗る */
  .rooms{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px }
  .roomhead{ color:#c4b5fd }
  .roomhead small{ font-weight:500; letter-spacing:0; color:var(--dim) }
  .room{ min-height:50px; padding:6px; font-size:14.5px; font-weight:500; letter-spacing:0; overflow-wrap:anywhere;
    background:#1b1626; color:rgba(233,213,255,.78); border:1px solid rgba(168,85,247,.28) }
  .room.def{ border:1.5px solid #fde68a; color:#fff }
  .room.on{ background:var(--rc); color:#fff; border-color:rgba(255,255,255,.7); font-weight:600 }
  .room.on.def{ border-color:#fde68a }
  .pc.room{ background:rgba(255,255,255,.06); color:#fff; border:1px solid var(--rc) }
  .variants{ display:flex; flex-wrap:wrap; gap:8px }
  .variants button{ flex:1 1 30%; padding:15px 8px; font-size:17px; background:var(--p) }
  .variants button.rec{ outline:2px solid #fde68a; outline-offset:-2px }
  .msg{ font-size:14px; line-height:1.5; min-height:1.2em; color:var(--mut) } .msg.err{ color:var(--err) } .msg.ok{ color:var(--ok) } .msg.warn{ color:var(--warn) }
  /* 記録後に戻った行を一瞬光らせ、どこに戻ったか分かるようにする */
  .order.flash{ animation:flash 1.8s ease-out }
  @keyframes flash{ 0%,30%{ box-shadow:0 0 0 3px #fde68a, 0 0 16px rgba(253,230,138,.5) } 100%{ box-shadow:0 0 0 0 transparent } }
  /* 白／黒の切替ボタン（右上、名前の左） */
  .barr{ display:flex; align-items:center; gap:10px }
  .themebtn{ padding:5px 11px; font-size:13px; font-weight:500; border-radius:999px; background:var(--surf2); color:var(--mut); border:1px solid var(--line2) }

  /* ---------- 白モード（Airtable と同じ白い背景）。黒モードで決め打ちの色を、白の上で読める濃さに置き換える ---------- */
  :root[data-theme=light]{ color-scheme:light; --bg:#f4f5f7; --surf:#fff; --surf2:#fff; --hover:#fff;
    --txt:#1f2328; --mut:#5f6672; --dim:#80868f; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
    --a:#2563eb; --a-soft:rgba(37,99,235,.15); --ok:#16a34a; --err:#dc2626; --warn:#d97706 }
  :root[data-theme=light] .bar a{ color:#2563eb }
  :root[data-theme=light] .card{ box-shadow:0 1px 3px rgba(0,0,0,.05) }
  :root[data-theme=light] .tabs{ background:#eceef1; border-color:transparent }
  :root[data-theme=light] .tabs button.on{ background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12) }
  :root[data-theme=light] .chips button{ background:#f1f2f4; border-color:transparent }
  :root[data-theme=light] .chips button.on{ background:#ede9fe; color:#5b21b6; border-color:#c4b5fd }
  :root[data-theme=light] .order{ background:#fff; border-color:#e1e4e8; box-shadow:0 1px 2px rgba(0,0,0,.04) }
  :root[data-theme=light] .late{ color:#B91C1C }
  :root[data-theme=light] .facts .late b{ color:#B91C1C } :root[data-theme=light] .facts .soon b{ color:#c2410c }
  :root[data-theme=light] .facts .late .when{ background:#fee2e2; color:#B91C1C }
  :root[data-theme=light] .facts .soon .when{ background:#ffedd5; color:#9a3412 }
  :root[data-theme=light] .facts .from{ color:#2563eb }
  :root[data-theme=light] .pc{ background:#f1f2f4; color:var(--mut) }
  :root[data-theme=light] .pc.die.d-check{ background:#f3e8ff; color:#6b21a8 }
  :root[data-theme=light] .pc.die.d-stored{ background:#cffafe; color:#155e75 }
  :root[data-theme=light] .pc.die.d-notyet{ background:#db2777; color:#fff }
  :root[data-theme=light] .pc.die.d-new{ background:#dbeafe; color:#1e40af }
  :root[data-theme=light] .pc.die.d-fix{ background:#fef9c3; color:#854d0e }
  :root[data-theme=light] .pc.room{ background:#fff; color:var(--txt) }
  :root[data-theme=light] .memo{ color:#92400e; background:#fffbeb; border-left-color:#f59e0b }
  :root[data-theme=light] .amt input[type=date]{ color-scheme:light }
  :root[data-theme=light] .amtbtn.qty{ background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe }
  :root[data-theme=light] .amtbtn.date{ background:#fff7ed; color:#c2410c; border-color:#fed7aa }
  :root[data-theme=light] .stephead{ color:#2563eb } :root[data-theme=light] .stephead.status{ color:#b45309 }
  :root[data-theme=light] .roomhead{ color:#7c3aed }
  :root[data-theme=light] .step{ background:#f5f8ff; color:#1e293b; border-color:#c7d7f5 }
  :root[data-theme=light] .step.status{ background:#fffbeb; color:#78350f; border-color:#fcd9a0 }
  /* 普段の工程・部屋の印は、白の上では薄い黄色が見えないので濃いオレンジの枠に */
  :root[data-theme=light] .step.rec{ border:1.5px solid #f59e0b; color:#1f2328 }
  :root[data-theme=light] .room{ background:#faf5ff; color:#6b21a8; border-color:#e9d5ff }
  :root[data-theme=light] .room.def{ border:1.5px solid #f59e0b; color:#1f2328 }
  :root[data-theme=light] .room.on{ background:var(--rc); color:#fff; border-color:transparent }
  :root[data-theme=light] .room.on.def{ border-color:#f59e0b }
  :root[data-theme=light] .variants button.rec{ outline-color:#f59e0b }
  :root[data-theme=light] .thumb, :root[data-theme=light] .imgs img{ border-color:#e1e4e8 }
  /* 2026-10-21 白はまぶしすぎたので青を基調に（指定色: 主 #0B57D0 / 明るい青 #2F7DF6 / 白 #FFFFFF / 青みの白 #F4F8FD /
     枠線 #D9E7FB / 文字 #163A70）。地は青みの白より一段濃くし、白は受注の行だけに使ってまぶしさを抑える。
     済＝緑・期限切れ＝赤・注意＝黄 の意味の色はそのまま */
  /* 2026-10-23 落ち着いた青系に整理: 地 #EEF2F6・カード #F8FAFC（受注の行は白）・本文 #1E293B・補助 #475569。
     補助文字 #7A92B5 は白の上で約3.2:1と薄かったので、小さいラベルにも4.5:1以上の色にした。状態の色は --st-* */
  :root[data-theme=light]{ --bg:#EEF2F6; --surf:#F8FAFC; --surf2:#FFFFFF; --hover:#FFFFFF;
    --txt:#1E293B; --mut:#475569; --dim:#5B6B80; --line:#D9E2EC; --line2:#C3CFDD; --a:#0B57D0; --a-soft:rgba(11,87,208,.12);
    --st-ready:#15803D; --st-ready-bg:#EDFBF2; --st-ready-badge:#15803D; --st-ready-ink:#fff;
    --st-done:#0B57D0; --st-done-bg:#EAF2FE; --st-done-badge:#0B57D0; --st-done-ink:#fff; --st-done-txt:#0B3D91;
    --st-wait:#B45309; --st-wait-bg:#FFF7E6; --st-wait-txt:#7C2D12;
    --st-late:#B91C1C; --st-late-bg:#FEE2E2; --st-late-txt:#7F1D1D;
    --st-note:#475569; --sel:#1E293B; --focus:#0B57D0 }
  :root[data-theme=light] .bar a{ color:#0B57D0 }
  :root[data-theme=light] .card{ background:#F8FAFC; border-color:#D9E2EC; box-shadow:0 1px 3px rgba(15,23,42,.06) }
  :root[data-theme=light] .listhead{ background:#0B57D0; color:#fff; border-bottom:1px solid #0A4AB2; box-shadow:0 2px 8px rgba(11,87,208,.25) }
  :root[data-theme=light] .listhead .cnt, :root[data-theme=light] .listhead .up{ color:#D9E7FB }
  :root[data-theme=light] .tabs{ background:#DCE8F8; border-color:transparent }
  :root[data-theme=light] .tabs button{ color:#475569 }
  :root[data-theme=light] .tabs button.on{ background:#FFFFFF; color:#0B57D0; box-shadow:0 1px 3px rgba(11,87,208,.18) }
  :root[data-theme=light] .chips button{ background:#FFFFFF; color:#1E293B; border-color:#C3CFDD }
  :root[data-theme=light] .chips button.on{ background:#0B57D0; color:#fff; border-color:#0B57D0 }
  :root[data-theme=light] .order{ background:#FFFFFF; border-color:#D9E2EC; box-shadow:0 1px 2px rgba(15,23,42,.06) }
  :root[data-theme=light] .facts .from{ color:#0B57D0 }
  :root[data-theme=light] .pc{ background:#EEF2F6; color:#475569 }
  :root[data-theme=light] .step{ background:#F8FAFC; color:#1E293B; border-color:#C3CFDD }
  :root[data-theme=light] .undo{ color:#475569; border-color:#C3CFDD; background:#fff }
  :root[data-theme=light] .stephead{ color:#0B57D0 }
  :root[data-theme=light] .amtbtn.qty{ background:#EEF4FE; color:#0B57D0; border-color:#BFD5F5 }
  :root[data-theme=light] .themebtn{ color:#0B57D0; border-color:#BFD5F5; background:#FFFFFF }
  :root[data-theme=light] .thumb, :root[data-theme=light] .imgs img{ border-color:#D9E7FB }

  /* ===== VIVANT（2026-10-20）: ドラマでブルーウォーカーが見ている画面の雰囲気。
     黒に近い紺の地に薄い方眼、シアンの細く光る線、大きな数字は等幅＋淡い発光。
     意味の色（済=青緑、期限切れ=赤、注意=黄）は他の配色と同じ役割のまま ===== */
  :root[data-theme=vivant]{ color-scheme:dark; --bg:#02060d; --surf:#06111d; --surf2:#0a1828; --hover:#0f2236;
    --txt:#d6f6ff; --mut:#7fb3c7; --dim:#6b98ab; --line:rgba(34,211,238,.18); --line2:rgba(34,211,238,.32);
    --a:#22d3ee; --a-soft:rgba(34,211,238,.16); --p:#38bdf8; --ok:#2dd4bf; --err:#ff4d6d; --warn:#fbbf24;
    /* 状態の色は他の配色と同じ意味。済はシアンだと着手可の緑と近いので青に寄せる（2026-10-23） */
    --st-ready:#4ade80; --st-ready-bg:rgba(74,222,128,.09); --st-ready-badge:#4ade80; --st-ready-ink:#00170a;
    --st-done:#60a5fa; --st-done-bg:rgba(96,165,250,.12); --st-done-badge:#60a5fa; --st-done-ink:#00131c; --st-done-txt:#bfdbfe;
    --st-wait:#fbbf24; --st-wait-bg:rgba(251,191,36,.12); --st-wait-txt:#fde68a;
    --st-late:#ff6b84; --st-late-bg:rgba(255,77,109,.16); --st-late-txt:#ffd1da;
    --st-note:#8fb3c4; --sel:#ecfeff; --focus:#67e8f9 }
  :root[data-theme=vivant] body{
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(34,211,238,.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(34,211,238,.035) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(34,211,238,.035) 0 1px, transparent 1px 28px),
      var(--bg) }
  :root[data-theme=vivant] .card{ background:rgba(6,17,29,.88); border-color:rgba(34,211,238,.22);
    box-shadow:0 0 0 1px rgba(34,211,238,.06), inset 0 0 28px rgba(34,211,238,.04) }
  :root[data-theme=vivant] .listhead{ background:#02060d; border-bottom:1px solid rgba(34,211,238,.45);
    box-shadow:0 1px 14px rgba(34,211,238,.18); letter-spacing:.03em }
  :root[data-theme=vivant] .listhead #listHeadName{ color:#67e8f9; text-shadow:0 0 8px rgba(34,211,238,.55) }
  :root[data-theme=vivant] .listhead #listHeadName::before{ content:'▍'; color:#22d3ee; margin-right:2px }
  :root[data-theme=vivant] .listhead .cnt, :root[data-theme=vivant] .listhead .up{ color:#7dd3fc; font-family:Consolas,"SF Mono","Roboto Mono",monospace; letter-spacing:0 }
  :root[data-theme=vivant] .bar a{ color:#67e8f9 }
  :root[data-theme=vivant] .tabs{ background:rgba(6,17,29,.9); border-color:rgba(34,211,238,.22) }
  :root[data-theme=vivant] .tabs button.on{ background:rgba(34,211,238,.14); color:#cffafe; box-shadow:inset 0 0 0 1px rgba(34,211,238,.6), 0 0 10px rgba(34,211,238,.25) }
  :root[data-theme=vivant] .chips button{ background:rgba(10,24,40,.9); border-color:rgba(34,211,238,.22); color:#a5f3fc }
  :root[data-theme=vivant] .chips button.on{ background:rgba(34,211,238,.18); color:#ecfeff; border-color:#22d3ee; box-shadow:0 0 10px rgba(34,211,238,.4) }
  :root[data-theme=vivant] .order{ background:rgba(8,20,34,.92); border-color:rgba(34,211,238,.20) }
  :root[data-theme=vivant] .order .item{ color:#ecfeff }
  /* 2026-10-23 数字・文字の発光は読みにくさの原因になるので弱める（雰囲気は地の方眼と細い線で残す） */
  :root[data-theme=vivant] .facts b{ font-family:Consolas,"SF Mono","Roboto Mono",monospace; color:#ecfeff; text-shadow:none; letter-spacing:.02em }
  :root[data-theme=vivant] .facts .late b{ color:#ff6b84; text-shadow:none }
  :root[data-theme=vivant] .facts .soon b{ color:#fcd34d; text-shadow:none }
  :root[data-theme=vivant] .order .meta, :root[data-theme=vivant] .target .meta{ font-family:Consolas,"SF Mono","Roboto Mono",monospace; color:#7fb8cc }
  :root[data-theme=vivant] .btn{ background:linear-gradient(135deg,#0891b2,#22d3ee); color:#00131c }
  :root[data-theme=vivant] .step{ background:rgba(8,20,34,.95); border-color:rgba(34,211,238,.25); color:#bdf4ff }
  :root[data-theme=vivant] .themebtn{ border-color:rgba(34,211,238,.5); color:#67e8f9; box-shadow:0 0 8px rgba(34,211,238,.25) }
  :root[data-theme=vivant] .listhead #listHeadName{ text-shadow:0 0 4px rgba(34,211,238,.3) }
  :root[data-theme=vivant] .chips button.on{ box-shadow:0 0 6px rgba(34,211,238,.25) }

  /* ===== SHELF（2026-10-23）: 300円ショップの箱を棚に並べたような見た目。白がまぶしいとき用。
     マットなグレーの箱に、角の丸い生成りのラベル。線画のような細い線、枠で囲んだ小見出し、字間を空けた細身の英字。
     白（data-theme=light）の上に data-skin=shelf で重ね、白で直した読みやすさはそのまま使う。
     状態の色は意味を変えず、生成りに合う落ち着いた濃さ（どれも生成りの上で 4.5:1 以上）===== */
  :root[data-skin=shelf]{ --bg:#A5A7AA; --surf:#EFEEEA; --surf2:#F7F6F3; --hover:#F7F6F3;
    --txt:#2B2C2E; --mut:#4A4B4E; --dim:#5C5E62; --line:#C9C9C6; --line2:#9C9EA1; --a:#4A4B4E; --a-soft:rgba(74,75,78,.14);
    --ok:#2F6B3F; --err:#A3302A; --warn:#8A5A14; --r:6px;
    --st-ready:#2F6B3F; --st-ready-bg:#E6EFE6; --st-ready-badge:#2F6B3F; --st-ready-ink:#fff;
    --st-done:#2D4F86; --st-done-bg:#E4EAF3; --st-done-badge:#2D4F86; --st-done-ink:#fff; --st-done-txt:#22406F;
    --st-wait:#8A5A14; --st-wait-bg:#F3EBDD; --st-wait-txt:#5E3D0C;
    --st-late:#A3302A; --st-late-bg:#F5E1DE; --st-late-txt:#6E1F1A;
    --st-note:#4A4B4E; --sel:#2B2C2E; --focus:#2D4F86;
    --shelf-font:"Century Gothic","Futura","Avenir Next","Avenir",system-ui,sans-serif }
  :root[data-skin=shelf] body{ background:var(--bg) }
  :root[data-skin=shelf] .bar a{ color:#2B2C2E; text-decoration:underline; text-underline-offset:3px }
  :root[data-skin=shelf] .bar{ color:#2B2C2E }
  /* 見出しは箱の濃いグレーの帯に生成りの字。字間を空けて箱の英字の雰囲気に */
  :root[data-skin=shelf] .listhead{ background:#5F6165; color:#F7F6F3; border-bottom:1px solid #F7F6F3; box-shadow:none; letter-spacing:.03em; font-weight:500 }
  :root[data-skin=shelf] .listhead.stuck{ box-shadow:0 4px 10px rgba(0,0,0,.18) }
  :root[data-skin=shelf] .listhead .cnt, :root[data-skin=shelf] .listhead .up{ color:#EFEEEA; font-family:var(--shelf-font); letter-spacing:.04em }
  :root[data-theme][data-skin=shelf] .listhead .fresh{ color:#EFEEEA; font-family:var(--shelf-font); letter-spacing:.04em }
  :root[data-theme][data-skin=shelf] .listhead .fresh.err{ color:#FFE7A3 }
  /* 角の丸い生成りのラベル（箱の説明面） */
  :root[data-skin=shelf] .card{ background:#EFEEEA; border:0; border-radius:20px; box-shadow:0 1px 0 rgba(0,0,0,.06) }
  :root[data-skin=shelf] .tabs{ background:#EFEEEA; border:1px solid #9C9EA1; border-radius:8px }
  :root[data-skin=shelf] .tabs button{ color:#4A4B4E; border-radius:5px; letter-spacing:.06em }
  :root[data-skin=shelf] .tabs button.on{ background:#4A4B4E; color:#F7F6F3; box-shadow:none }
  /* 切替の札は説明欄の「枠で囲んだ見出し」の形（細い線の四角）。選んだものは塗る */
  :root[data-skin=shelf] .chips button{ background:transparent; color:#2B2C2E; border:1px solid #4A4B4E; border-radius:3px; letter-spacing:.04em }
  :root[data-skin=shelf] .chips button.on{ background:#4A4B4E; color:#F7F6F3; border-color:#4A4B4E }
  :root[data-skin=shelf] .themebtn{ background:#EFEEEA; color:#2B2C2E; border:1px solid #4A4B4E; border-radius:3px; font-family:var(--shelf-font); letter-spacing:.06em }
  /* 受注の行は棚に並んだ箱: 平らで細い線、影なし */
  :root[data-skin=shelf] .order{ background:#F7F6F3; border:1px solid #9C9EA1; border-radius:12px; box-shadow:none }
  :root[data-skin=shelf] .order .item{ color:#2B2C2E }
  :root[data-skin=shelf] .facts{ color:#4A4B4E }
  :root[data-skin=shelf] .facts b{ color:#2B2C2E; font-family:var(--shelf-font); font-weight:600 }
  :root[data-skin=shelf] .facts .from{ color:#2D4F86 }
  :root[data-skin=shelf] .order .meta, :root[data-skin=shelf] .target .meta{ font-family:var(--shelf-font); color:#4A4B4E; letter-spacing:.03em }
  :root[data-skin=shelf] .pc{ background:#E9E8E4; color:#4A4B4E }
  :root[data-skin=shelf] .flow .fl{ border:1px solid #4A4B4E; border-radius:2px; padding:0 4px; flex:0 0 auto; color:#2B2C2E; letter-spacing:.1em }
  :root[data-skin=shelf] .fs{ border-color:#9C9EA1; color:#4A4B4E; border-radius:3px }
  :root[data-skin=shelf] .memo{ color:#5E3D0C; background:#F3EBDD; border-left-color:#8A5A14 }
  /* 工程カードの見出しも枠で囲んだ形に */
  :root[data-skin=shelf] .stephead, :root[data-skin=shelf] .roomhead{ justify-self:start; align-self:flex-start; border:1px solid #4A4B4E; border-radius:2px; padding:3px 12px; color:#2B2C2E; letter-spacing:.1em }
  :root[data-skin=shelf] .stephead.status{ color:#5E3D0C; border-color:#8A5A14 }
  :root[data-skin=shelf] .roomhead small{ color:#4A4B4E }
  :root[data-skin=shelf] .step{ background:#F7F6F3; color:#2B2C2E; border:1px solid #9C9EA1 }
  :root[data-skin=shelf] .step.status{ background:#F6F1E7; color:#5E3D0C; border-color:#C9B48F }
  :root[data-skin=shelf] .step.rec{ border:1.5px solid #8A5A14 }
  :root[data-skin=shelf] .room{ background:#F5F2F7; color:#4F3570; border-color:#CDC2DA }
  :root[data-skin=shelf] .undo{ background:#F7F6F3; color:#4A4B4E; border-color:#9C9EA1 }
  :root[data-skin=shelf] .btn{ background:#4A4B4E; color:#F7F6F3 }
  :root[data-skin=shelf] .ghost{ background:#F7F6F3; color:#2B2C2E; border:1px solid #4A4B4E }
  :root[data-skin=shelf] .amtbtn.qty{ background:#E4EAF3; color:#22406F; border-color:#A9B8D0 }
  :root[data-skin=shelf] .amtbtn.date{ background:#F3EBDD; color:#5E3D0C; border-color:#CDB58A }
  :root[data-skin=shelf] input, :root[data-skin=shelf] select{ background:#F7F6F3; color:#2B2C2E; border-color:#9C9EA1 }
  :root[data-skin=shelf] .facts .late .when{ background:var(--st-late-bg); color:var(--st-late-txt) }
  :root[data-skin=shelf] .facts .late b, :root[data-skin=shelf] .late{ color:var(--st-late) }
  :root[data-skin=shelf] .facts .soon b{ color:#8A4B0F } :root[data-skin=shelf] .facts .soon .when{ background:#F3EBDD; color:#5E3D0C }

  /* ===== 状態の色（全配色共通。色は各配色の --st-* で決まる。2026-10-23）=====
     配色ごとの .order / .step の指定より後ろに置き、:root を付けて必ずこちらが効くようにする */
  /* 着手できる: 一番目立たせる（太い緑枠＋薄い緑の地＋塗りの札） */
  :root .order.ready{ border:3px solid var(--st-ready); background:var(--st-ready-bg); padding:10px 10px 10px 12px }
  :root .minebadge.ready{ background:var(--st-ready-badge); color:var(--st-ready-ink) }
  /* 自分の工程が済: 青い札は残し、枠は左の帯だけにして控えめに */
  :root .order.mine{ border-left:5px solid var(--st-done); padding-left:10px }
  :root .minebadge.done{ background:var(--st-done-badge); color:var(--st-done-ink) }
  /* 材料・前工程待ち: 黄土色の線の札と左の帯 */
  :root .order.wait{ border-left:5px solid var(--st-wait); padding-left:10px }
  :root .minebadge.wait{ background:var(--st-wait-bg); color:var(--st-wait-txt); border:1.5px solid var(--st-wait); font-size:14px }
  /* 判定できない: 灰色の点線の札（目立たせない） */
  :root .minebadge.note{ background:transparent; color:var(--st-note); border:1px dashed var(--line2); font-size:13px; font-weight:500 }
  /* 選択中: 状態の枠・地は変えず、外側の枠と「選択中」の札で分ける */
  :root .order.sel{ outline:3px solid var(--sel); outline-offset:2px }
  /* 進行の流れの今: 社内＝済の青、社外＝待ちの黄土、材料の入荷確認済み・在庫シート＝緑、流れの外の知らせ＝赤 */
  :root .flow.in .fs.now{ border:2px solid var(--st-done); color:var(--st-done-txt); background:var(--st-done-bg); font-weight:600 }
  :root .flow.out .fs.now{ border:2px solid var(--st-wait); color:var(--st-wait-txt); background:var(--st-wait-bg); font-weight:600 }
  :root .flow .fs.now.arrived{ border-color:var(--st-ready); color:var(--txt); background:var(--st-ready-bg) }
  :root .flow .fs.now.alert{ border-color:var(--st-late); color:var(--st-late-txt); background:var(--st-late-bg) }
  /* 工程ボタンの済: 一覧の「済」と同じ青。最後に記録した工程は塗り、それより前は薄く */
  :root .steps .step.done{ background:var(--st-done-badge); color:var(--st-done-ink); border:1px solid var(--st-done) }
  :root .steps .step.done.past{ background:var(--st-done-bg); color:var(--st-done-txt); border-color:var(--st-done) }
  /* 一覧の鮮度（見出しの2行目） */
  .listhead .fresh{ flex-basis:100%; font-size:12.5px; font-weight:500; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .listhead .fresh.err{ color:var(--st-late); font-weight:600 }
  :root[data-theme=light] .listhead .fresh{ color:#D9E7FB }
  :root[data-theme=light] .listhead .fresh.err{ color:#FFE08A }
  /* 状態の絞り込み */
  .chips.filt button[aria-pressed=true]{ background:var(--sel); color:var(--bg); border-color:var(--sel); font-weight:600 }
  .chips.filt .lbl{ font-size:12.5px; color:var(--mut); margin-right:2px }
  /* キーボードで動かしたときの位置が分かるように */
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{ outline:3px solid var(--focus); outline-offset:2px }
</style>
</head>
<body>
<main class="wrap">
  <!-- 作業リストの見出し。ページの一番上に常に出し、押すと一番上の行へ戻る（2026-10-17） -->
  <button type="button" class="listhead" id="listHead" aria-label="一覧の一番上へ戻る" hidden>
    <span><span id="listHeadName">作業リスト</span> <span class="cnt" id="listHeadCnt"></span></span>
    <span class="up">↑ 先頭へ</span>
    <span class="fresh" id="listFresh" role="status" title="Airtable から一覧を読んだ時刻です（サーバーで最大20秒使い回します）。Airtable 側で最後に変わった時刻ではありません"></span>
  </button>
  <div class="bar"><a href="/">← トップ</a><span class="barr"><button type="button" class="themebtn" id="themeBtn"></button><span id="who"></span></span></div>
  <nav class="tabs" role="tablist">
    <button type="button" id="tabList" role="tab">作業リスト</button>
    <button type="button" id="tabFind" role="tab">品番で探す</button>
  </nav>

  <!-- 作業リスト（Airtable のビューをそのまま表示） -->
  <section class="card" id="listCard" hidden>
    <div class="chips" id="viewChips"></div>
    <!-- 状態の絞り込み（取得済みの一覧を画面の中で絞る。Airtable のビュー・並び順は変えない）2026-10-23 -->
    <div class="chips filt" id="filtChips" role="group" aria-label="状態で絞り込む" hidden></div>
    <div class="row"><div class="msg" id="listMsg" role="status" style="flex:1"></div>
      <button type="button" class="btn ghost" id="listRetry" hidden>もう一度読む</button></div>
    <div id="list" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>

  <!-- 1. 受注を探す -->
  <section class="card" id="findCard">
    <div class="row">
      <button class="btn" id="camBtn" type="button">工程表のQRを読む</button>
      <span class="msg" id="camMsg"></span>
    </div>
    <div class="camwrap" id="camWrap" hidden>
      <video id="video" playsinline muted></video>
      <div class="camhint">工程表のQRを枠いっぱいに映してください</div>
    </div>
    <div class="row">
      <select id="book" aria-label="Book"><option>Ko</option><option>Ta</option><option>Yo</option></select>
      <input id="wc" placeholder="WorkCord" inputmode="numeric" autocomplete="off" aria-label="WorkCord" />
      <button class="btn ghost" id="searchBtn" type="button">検索</button>
    </div>
    <div class="msg" id="findMsg" role="status"></div>
    <div id="orders" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>

  <!-- 2. 工程を選んで完了 -->
  <section class="card" id="stepCard" hidden>
    <div class="row"><button type="button" class="btn ghost" id="closeDetail">← 一覧へ戻る</button></div>
    <!-- 書き込みの結果を確かめられなかったとき。確認が済むまでこの受注の記録・変更ボタンは押せない（2026-10-23） -->
    <div class="unsure" id="unsureBox" role="alert" hidden>
      <span id="unsureText"></span>
      <button type="button" class="btn" id="unsureBtn">記録の状態を確認</button>
    </div>
    <div class="target" id="target"></div>
    <div class="imgs" id="stepImgs"></div>
    <div class="steps" id="steps"></div>
    <div class="roomhead" id="roomHead">Room <small>（明るい枠＝普段の部屋。押すと Room に入る／もう一度押すと外す）</small></div>
    <div class="rooms" id="rooms"></div>
    <div class="variants" id="variants" hidden></div>
    <div class="msg" id="stepMsg" role="status"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" crossorigin="anonymous"></script>
<div class="viewer" id="viewer" hidden role="dialog" aria-label="画像">
  <div class="vbar"><span id="vname"></span><span><a id="vopen" target="_blank" rel="noopener">原寸で開く</a>　<button class="btn ghost" id="vclose" type="button">閉じる</button></span></div>
  <div class="vimg" id="vimg"><img id="vpic" alt="" /></div>
</div>
<script src="/js/auth-client.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const say = (el, t, cls) => { el.textContent = t || ''; el.className = 'msg ' + (cls || ''); };

  // 配色の切替: 黒 → 白 → VIVANT → SHELF → 黒。ボタンには「押すとなる方」を出す（端末ごとに覚える）
  const THEMES = ['dark', 'light', 'vivant', 'shelf'];
  const THEME_LABEL = { dark: '☾ 黒に', light: '☀ 白に', vivant: '◈ VIVANT', shelf: '▭ SHELF' };
  const root = document.documentElement;
  const curTheme = () => root.dataset.skin || root.dataset.theme || 'dark';
  function showTheme() { $('themeBtn').textContent = THEME_LABEL[THEMES[(THEMES.indexOf(curTheme()) + 1) % THEMES.length]]; }
  $('themeBtn').onclick = () => {
    const next = THEMES[(THEMES.indexOf(curTheme()) + 1) % THEMES.length];
    delete root.dataset.theme; delete root.dataset.skin;
    if (next === 'shelf') { root.dataset.theme = 'light'; root.dataset.skin = 'shelf'; }
    else if (next !== 'dark') root.dataset.theme = next;
    try { localStorage.setItem('dl.theme', next); } catch {}
    showTheme();
  };
  showTheme();

  const me = await DLAuth.requireLogin();
  if (!me) return;
  $('who').innerHTML = ''; const b = document.createElement('b'); b.textContent = me.name; $('who').append(b, ' さん');

  // filter: 状態の絞り込み（all / ready / wait / done）。listAt: 一覧を反映した時刻（サーバーが Airtable を読んだ時刻）。listFail: 最後の読み込みが失敗
  const S = { orders: [], steps: [], views: [], rooms: [], view: '', mode: 'list', sel: null, pendingStep: null,
    filter: 'all', listAt: 0, listFail: false };

  // Book は Ko / Ta / Yo から選ぶ。QR に別の値が来たときだけ選択肢を足す
  function setBook(v) {
    const sel = $('book'); v = String(v || '').trim();
    if (!v) return;
    if (![...sel.options].some(o => o.value === v)) { const o = document.createElement('option'); o.textContent = v; sel.append(o); }
    sel.value = v;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // 電波が切れて応答が無いときも例外で止めず { ok:false, unknown:true } を返す（2026-10-23）。
  // unknown は「サーバーで処理されたか分からない」。送れなかった（network）だけでなく、応答の本文が途中で切れた・
  // JSON として読めないときも含める。サーバーが JSON で返した拒否（入力の誤りなど）は unknown にしない。
  // 送ったかどうか分からない更新は、ここでは送り直さない（二重記録を避ける）
  async function api(body) {
    let r;
    try {
      r = await fetch('/api/airtable-update-progress', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'content-type': 'application/json', 'x-csrf': await DLAuth.csrf() },
        body: JSON.stringify(body),
      });
    } catch {
      return { ok: false, network: true, unknown: true, error: '通信できませんでした（電波を確認してください）' };
    }
    let j;
    try {
      j = JSON.parse(await r.text());
      if (!j || typeof j !== 'object') throw new Error('not an object');
    } catch {
      return { ok: false, unknown: true, status: r.status, error: '応答を読み取れませんでした' };
    }
    j.status = r.status;
    if (j.needLogin) location.replace(DLAuth.loginUrl());
    return j;
  }
  // 書き込みの結果を確かめられないか。応答が読めない、または成功と言いながら必要な値が欠けている（need が false）
  const outcomeUnknown = (j, need) => !!j.unknown || (j.ok && !need(j));
  // 書き込み中（記録・取消・数量・納期・Room）。この間は一覧を自動で読み直さない
  let writing = 0;
  async function write(body) {
    writing++;
    try { return await api(body); } finally { writing--; }
  }

  /* ---------- QR ---------- */
  // 対応する形式: order-Book-WC / die-Book-WC / Ta:230 / URL の ?book=&wc=
  function parseQr(raw) {
    const t = String(raw || '').trim().replace(/[‐-―−ー－]/g, '-');
    let m = /^(?:order|die)-([^-\s]+)-([^-\s]+)/i.exec(t);
    if (m) return { book: m[1], wc: m[2] };
    m = /^([A-Za-z]{1,3}):(\d+)$/.exec(t);
    if (m) return { book: m[1], wc: m[2] };
    try {
      const u = new URL(t);
      const book = u.searchParams.get('book') || u.searchParams.get('Book') || '';
      const wc = u.searchParams.get('wc') || u.searchParams.get('WorkCord') || '';
      if (book && wc) return { book, wc };
    } catch {}
    m = /order(?:[_-]?plain)?[:\s-]+([^\s/:-]+)[\s/:-]+([^\s/:-]+)/i.exec(t);
    return m ? { book: m[1], wc: m[2] } : null;
  }

  let stream = null, scanTimer = null, detector = null;
  async function startCam() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    } catch (e) { say($('camMsg'), 'カメラを使えません。下に品番を入れてください。', 'err'); return; }
    const v = $('video'); v.srcObject = stream; await v.play().catch(() => {});
    $('camWrap').hidden = false; $('camBtn').textContent = 'カメラを止める'; say($('camMsg'), '');
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch { detector = null; } }
    const c = document.createElement('canvas'); const ctx = c.getContext('2d', { willReadFrequently: true });
    scanTimer = setInterval(async () => {
      if (!v.videoWidth) return;
      let raw = '';
      try {
        if (detector) { const r = await detector.detect(v); raw = r[0]?.rawValue || ''; }
        else if (window.jsQR) {
          const sc = Math.min(1, 960 / v.videoWidth); c.width = v.videoWidth * sc; c.height = v.videoHeight * sc;
          ctx.drawImage(v, 0, 0, c.width, c.height);
          raw = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' })?.data || '';
        }
      } catch {}
      if (!raw) return;
      const p = parseQr(raw);
      if (!p) { say($('camMsg'), '工程表のQRではないようです', 'warn'); return; }
      stopCam(); navigator.vibrate?.(60);
      setBook(p.book); $('wc').value = p.wc; setMode('find'); search();
    }, 160);
  }
  function stopCam() {
    clearInterval(scanTimer); scanTimer = null;
    stream?.getTracks().forEach(t => t.stop()); stream = null;
    $('camWrap').hidden = true; $('camBtn').textContent = '工程表のQRを読む';
  }
  $('camBtn').onclick = () => (stream ? stopCam() : startCam());

  /* ---------- 受注を探す ---------- */
  async function search() {
    const book = $('book').value.trim(), wc = $('wc').value.trim();
    if (!book || !wc) return say($('findMsg'), 'Book と WorkCord を入れてください', 'err');
    say($('findMsg'), '探しています…'); $('orders').textContent = ''; $('stepCard').hidden = true; S.sel = null;
    const j = await api({ action: 'orders', book, wc });
    if (!j.ok) return say($('findMsg'), j.error || '探せませんでした', 'err');
    S.orders = j.orders; S.steps = j.steps; S.rooms = j.rooms || [];
    if (!j.orders.length) return say($('findMsg'), `${book} / ${wc} の受注は見つかりません`, 'err');
    const open = j.orders.filter(o => !o.closed);
    say($('findMsg'), open.length > 1 ? `受注が${open.length}件あります。どれか選んでください` : '');
    renderOrders();
    if (open.length === 1) selectOrder(open[0].id);
  }
  $('searchBtn').onclick = search;
  $('wc').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

  function fmtDate(d) { return d ? d.slice(5).replace('-', '/') : '-'; }
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const todayJST = () => new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
  function daysFromToday(d) {
    const [y, m, dd] = d.split('-').map(Number); const [ty, tm, td] = todayJST().split('-').map(Number);
    return Math.round((Date.UTC(y, m - 1, dd) - Date.UTC(ty, tm - 1, td)) / 86400000);
  }
  // 数量と納期の大きな表示。納期は曜日つき、過ぎていれば赤、今日・明日は黄色
  function facts(o) {
    const f = document.createElement('div'); f.className = 'facts';
    const q = document.createElement('span'); const qb = document.createElement('b');
    qb.textContent = o.amount == null ? '-' : Number(o.amount).toLocaleString('ja-JP');
    q.append('数量', qb);
    if (o.amountFrom && o.amountFrom !== String(o.amount)) {
      const fr = document.createElement('span'); fr.className = 'from';
      fr.textContent = '元 ' + (o.amountFrom === '空白' ? '空白' : Number(o.amountFrom).toLocaleString('ja-JP'));
      fr.title = o.amountLog || ''; q.append(fr);
    }
    const n = document.createElement('span'); const nb = document.createElement('b');
    n.append('納期', nb);
    if (o.ndate) {
      const [y, m, d] = o.ndate.split('-').map(Number);
      nb.textContent = `${m}/${d}(${WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`;
      const diff = daysFromToday(o.ndate);
      const w = document.createElement('span'); w.className = 'when';
      if (diff < 0) { n.className = 'late'; w.textContent = `！${-diff}日過ぎ`; n.append(w); }
      else if (diff === 0) { n.className = 'soon'; w.textContent = '今日'; n.append(w); }
      else if (diff === 1) { n.className = 'soon'; w.textContent = '明日'; n.append(w); }
    } else nb.textContent = '-';
    if (o.ndateFrom && o.ndateFrom !== o.ndate) {
      const fr = document.createElement('span'); fr.className = 'from';
      fr.textContent = '元 ' + (o.ndateFrom === '空白' ? '空白' : fmtDate(o.ndateFrom));
      fr.title = o.ndateLog || ''; n.append(fr);
    }
    f.append(q, n);
    return f;
  }

  // 「佐藤 2026-10-03 14:20」→「佐藤 10/03」
  const shortStamp = (t) => { const m = /^(.*?)\s+\d{4}-(\d\d)-(\d\d)/.exec(t || ''); return m ? `${m[1]} ${m[2]}/${m[3]}` : (t || ''); };
  // 「佐藤 2026-10-03 14:20」→「佐藤 10/03 14:20」（工程の済の表示で、記録者と日時を見せる）
  const fullStamp = (t) => { const m = /^(.*?)\s+\d{4}-(\d\d)-(\d\d)(?:[ T](\d\d:\d\d))?/.exec(t || ''); return m ? `${m[1]} ${m[2]}/${m[3]}${m[4] ? ' ' + m[4] : ''}` : (t || ''); };

  // 記録の日時（「佐藤 2026-10-03 14:20」の日時部分）。並べ替えに使う
  // オートメーションの書く日時は「2026-10-03T14:20」形式のこともあるので T も受ける
  const stampTime = (t) => { const m = /(\d{4}-\d\d-\d\d)[ T](\d\d:\d\d)/.exec(t || ''); return m ? `${m[1]} ${m[2]}` : ''; };
  // 済んだ工程を記録順に返す。記録者なし（Airtable で直接入れた進行社内）は最後
  function doneSteps(o) {
    const list = [];
    for (const s of S.steps) {
      const d = o.done[s.key];
      const byProg = !d && s.variants.some(v => v.value === o.progIn);
      if (d || byProg) list.push({ s, d, t: d ? stampTime(d) : '9999' });
    }
    return list.sort((a, b) => a.t.localeCompare(b.t));
  }
  // 最後に選ばれた工程: 今の進行社内と一致するもの。無ければ一番新しい記録
  function latestKey(o) {
    const hit = S.steps.find(s => s.variants.some(v => v.value === o.progIn));
    if (hit) return hit.key;
    const list = doneSteps(o);
    return list.length ? list[list.length - 1].s.key : '';
  }

  /* ---------- 進行の流れ（上段 社外／下段 社内。今の段階だけ光る四角で囲む）2026-10-14 ---------- */
  // 進行社外は変わった日時の記録が無いので、決まった流れの中で今どこかを出す。前の段階は「通ったはず」として薄く出す。
  // 材料の段階を過ぎたら、どの材料の道（シート手配／在庫シート／機械貼材料）を通ったか分からないので材料は出さない
  const OUT_MAT = ['シート手配待ち', 'シート手配済み', 'シート材料入荷済'];
  const OUT_MAT1 = ['在庫シート利用', '機械貼材料入荷済'];
  const OUT_SLIP = ['受領伝票発行可能', '伝票出力済'];
  const OUT_END = ['完納済', '完納（数量訂正）', '分納残'];
  const OUT_ARRIVED = ['シート材料入荷済', '機械貼材料入荷済']; // 入荷を人が確かめた状態
  // 紙入荷日（シート・機械貼材料の入荷日）の言い方。先の日は「予定」、今日・過ぎた日は入荷の確認待ち（予定日だけで入荷とはしない）
  function paperNote(o) {
    if (!o.paper || !/^\d{4}-\d\d-\d\d$/.test(o.paper)) return null;
    const [py, pm, pd] = o.paper.split('-').map(Number);
    const day = `${pm}/${pd}(${WD[new Date(Date.UTC(py, pm - 1, pd)).getUTCDay()]})`;
    const diff = daysFromToday(o.paper);
    if (diff > 0) return { day, diff, text: `${day} 入荷予定` };
    if (diff === 0) return { day, diff, text: '本日入荷予定・確認待ち' };
    return { day, diff, text: `${day} 入荷予定日経過・要確認` };
  }
  function outFlow(v) {
    if (!v) return [];
    let i = OUT_MAT.indexOf(v); if (i >= 0) return OUT_MAT.slice(0, i + 1).map(label => ({ label }));
    if (OUT_MAT1.includes(v)) return [{ label: v }];
    i = OUT_SLIP.indexOf(v); if (i >= 0) return OUT_SLIP.slice(0, i + 1).map(label => ({ label }));
    if (OUT_END.includes(v)) return [...OUT_SLIP, v].map(label => ({ label }));
    return [{ label: v, alert: true }]; // 納期変更・キャンセル・伝票取消など、流れの外の知らせ
  }
  // 「2026-10-03 14:20」「佐藤 2026-10-03 14:20」→「10/3」
  const md = (t) => { const m = /\d{4}-(\d\d)-(\d\d)/.exec(t || ''); return m ? `${+m[1]}/${+m[2]}` : ''; };
  // 進行社内は 工程表印刷日時 と各工程の「〜記録」の日時で並べる。記録の無い今の進行（抜き作業中など）は最後に足す
  function inFlow(o) {
    const items = doneSteps(o).map(({ s, d, t }) => ({ label: s.label, sub: d ? md(d) : '', t }));
    if (o.printedAt) items.push({ label: '工程表発行済', sub: md(o.printedAt), t: stampTime(o.printedAt) || '0000' });
    items.sort((a, b) => a.t.localeCompare(b.t));
    if (o.progIn && !items.some(x => x.label === o.progIn)) items.push({ label: o.progIn, sub: '' });
    const i = items.findIndex(x => x.label === o.progIn);
    return { items, cur: i >= 0 ? i : items.length - 1 };
  }
  // この先の工程（2026-10-22）。工程(自動) のタグ（|オートン|Nao|機械貼|）のうち、まだ済んでいない部屋を作業順に返す。
  // 済んだかどうかは tagDone（その部屋の作業リストの「済」と同じ基準。Nao なら シール貼完了 か 仕上がりました）
  // 並びは 工程(自動) ではなく ItemName の #タグの順（HSK3240-W3 #o#nao#ki → オートン → Nao → 機械貼）。
  // 工程(自動) は数式の中の決まった順（オートン → 機械貼 → Nao）になり、実際の作業順と違うため（ユーザー指定）。
  // どの部屋を出すかは 工程(自動) を正とし、品名から読めなかったタグは後ろに足す
  const ITEM_TAG = { o: 'オートン', 0: 'オートン', ki: '機械貼', h: '花', ha: '花', ko: '2F_小', tk: 'たおしK判', tm: 'たおしM判',
    cad: 'CAD', nao: 'Nao', na: 'Nao', pre: 'プレ', st: '断裁ステッチ', '断': '断裁ステッチ',
    '福祉': '福祉' }; // 工程(自動) の対応表と同じ（2026-10-23 #福祉 を追加）
  function itemTags(o) {
    const kotei = String(o.kotei || '').split('|').filter(Boolean);
    const fromItem = String(o.item || '').normalize('NFKC').split('#').slice(1)
      .map(t => ITEM_TAG[t.trim().split(/\s/)[0].toLowerCase()]).filter(t => t && kotei.includes(t));
    return [...new Set([...fromItem, ...kotei])];
  }
  function todoRooms(o) {
    if (o.closed || o.group === '最終' || o.done.finish) return [];
    return itemTags(o).filter(tag => !tagDone(o, tag)).map(tag => S.rooms.find(r => r.tag === tag)?.name || tag);
  }
  function flowRow(name, cls, items, cur, todo = []) {
    const row = document.createElement('div'); row.className = 'flow ' + cls;
    const h = document.createElement('span'); h.className = 'fl'; h.textContent = name; row.append(h);
    if (!items.length && !todo.length) { const n = document.createElement('span'); n.className = 'fnone'; n.textContent = '—'; row.append(n); return row; }
    items.forEach((it, i) => {
      if (i) { const a = document.createElement('span'); a.className = 'farr'; a.textContent = '→'; row.append(a); }
      const b = document.createElement('span'); b.className = 'fs ' + (i === cur ? 'now' : 'past') + (it.alert ? ' alert' : '') + (it.arrived ? ' arrived' : '');
      b.append((it.arrived ? '✓ ' : '') + it.label);
      if (it.sub) { const s = document.createElement('small'); s.textContent = it.sub; b.append(s); }
      row.append(b);
    });
    // まだの工程は点線の枠で暗く出す。タグの並びが実際の作業順なので → でつなぐ（→ Nao → 機械貼）
    todo.forEach((name, i) => {
      if (items.length || i) { const a = document.createElement('span'); a.className = 'farr todo'; a.textContent = '→'; row.append(a); }
      const b = document.createElement('span'); b.className = 'fs todo'; b.title = 'この先の工程（未完了）';
      b.textContent = name;
      row.append(b);
    });
    return row;
  }

  function progressStrip(o, view = '') {
    const box = document.createElement('div'); box.className = 'prog';
    const out = outFlow(o.progOut);
    // シート・機械貼材料の手配・入荷のときだけ、紙入荷日をさりげなく添える（先の日付は「予定」）
    // 機械貼材料の入荷日も 紙入荷日 に入れる（以前は連絡事項のメモに書いていた。2026-10-22）。
    // 進行社外に機械貼材料の「手配済み」は無いので、機械貼の作業リストでは進行社外が空でも「機械貼材料 ○/○予定」と出す
    // 2026-10-22 支給シートは シート手配済み を選ばないので、進行社外が空でも「シート入荷 ○/○予定」を出す。
    // 材料の段階（手配必要・手配済み・入荷済・機械貼材料）ならその札に添え、流れの外の知らせ（納期変更など）なら前に置く。
    // 伝票・納品の段階を過ぎたら材料は出さない（上の決まりと同じ）
    // 2026-10-23 予定日だけで「入荷した」とは見せない。入荷確認済み（緑）は進行社外が入荷済のときだけ。
    // 予定日が今日・過ぎたのに入荷済になっていないものは、黄土色のまま「確認待ち」「要確認」と出す。
    // 在庫シート利用は新しく入荷したものではないので、紙入荷日は添えない（緑の「在庫シート利用」だけ）
    const pn = paperNote(o);
    if (pn && o.progOut !== '在庫シート利用') {
      if (OUT_ARRIVED.includes(o.progOut)) out[out.length - 1].sub = pn.day;
      else if (OUT_MAT.includes(o.progOut)) out[out.length - 1].sub = pn.text;
      else if (!o.progOut) out.push({ label: view === 'kikai' ? '機械貼材料' : 'シート入荷', sub: pn.text });
      else if (!OUT_SLIP.includes(o.progOut) && !OUT_END.includes(o.progOut)) out.unshift({ label: 'シート入荷', sub: pn.text });
    }
    // 入荷確認済み・在庫シート利用は、社外の今の札を緑にする
    if (out.length && [...OUT_ARRIVED, '在庫シート利用'].includes(out[out.length - 1].label)) out[out.length - 1].arrived = true;
    const ins = inFlow(o);
    box.append(flowRow('社外', 'out', out, out.length - 1), flowRow('社内', 'in', ins.items, ins.cur, todoRooms(o)));
    const tags = document.createElement('div'); tags.className = 'tags';
    // 抜型状況。仕舞い完了があるのに「型まだ仕舞済でない」が残っていたら、古い方は出さない
    const DIE_CLASS = { '抜型照合済': 'd-check', '抜型を棚に仕舞い完了': 'd-stored', '型まだ仕舞済でない': 'd-notyet', '今回新型': 'd-new', '型修正あり': 'd-fix' };
    const die = (o.die || []).filter(v => !(v === '型まだ仕舞済でない' && o.die.includes('抜型を棚に仕舞い完了')));
    for (const v of die) {
      const c = document.createElement('span'); c.className = 'pc die ' + (DIE_CLASS[v] || ''); c.textContent = v; tags.append(c);
    }
    // Room に入っている部屋のうち、普段の部屋（品名タグ）以外＝応援先を出す
    for (const r of (o.room || []).filter(r => !hasTag(o, roomTag(r)))) {
      const c = document.createElement('span'); c.className = 'pc room';
      c.style.setProperty('--rc', roomColor(r)); c.textContent = '応援 ' + r; tags.append(c);
    }
    if (tags.childNodes.length) box.append(tags);
    return box;
  }
  /* ---------- 探す（型の場所）へ ---------- */
  // 探す画面は ?book=&wc= で開くと、その品番をターゲットにして図面・棚の情報を読み込む
  function findLink(o) {
    const a = document.createElement('a'); a.className = 'findbtn';
    a.href = '/scan-lookup.html?' + new URLSearchParams({ book: o.book, wc: String(o.wc) }).toString();
    a.append('この型を探す');
    const sm = document.createElement('small'); sm.textContent = `${o.book} / ${o.wc}`; a.append(sm);
    return a;
  }

  /* ---------- 生地照合（知る）へ ---------- */
  // 知る画面は ?book=&wc=&target=fabric で開くと、品番QRを読まずにそのまま生地照合に入る
  function fabricLink(o) {
    const a = document.createElement('a'); a.className = 'findbtn fabric';
    a.href = '/scan-spec-google.html?' + new URLSearchParams({ book: o.book, wc: String(o.wc), target: 'fabric' }).toString();
    a.append('生地を照合する');
    const sm = document.createElement('small'); sm.textContent = `${o.book} / ${o.wc}`; a.append(sm);
    return a;
  }
  function goBar(o) {
    const g = document.createElement('div'); g.className = 'gobar';
    g.append(findLink(o), fabricLink(o));
    return g;
  }

  /* ---------- 仕上がり数量の変更 ---------- */
  function amountEditor(o) {
    const box = document.createElement('div'); box.className = 'amt';
    if (o.amountLocked) {
      const n = document.createElement('span'); n.className = 'note';
      n.textContent = '受領伝票の発行後なので、数量・納期はここでは変えられません（伝票の照合で訂正）';
      box.append(n); return box;
    }
    const open = document.createElement('button'); open.type = 'button'; open.className = 'amtbtn qty'; open.textContent = '仕上がり数量を変える';
    box.append(open);
    if (o.amountLog) { const n = document.createElement('span'); n.className = 'note'; n.textContent = '最後の変更: ' + o.amountLog; box.append(n); }
    open.onclick = () => {
      box.textContent = '';
      const inp = document.createElement('input'); inp.inputMode = 'numeric'; inp.pattern = '\\d*'; inp.value = o.amount ?? '';
      inp.setAttribute('aria-label', '仕上がり数量');
      const save = document.createElement('button'); save.type = 'button'; save.className = 'btn'; save.textContent = '保存';
      const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'amtbtn'; cancel.textContent = 'やめる';
      box.append(inp, save, cancel);
      inp.focus(); inp.select();
      cancel.onclick = () => renderSteps();
      inp.onkeydown = (e) => { if (e.key === 'Enter') save.click(); };
      save.onclick = async () => {
        const v = inp.value.trim().replace(/[,，\s]/g, '');
        if (!/^\d+$/.test(v) || Number(v) <= 0) return say($('stepMsg'), '数量は1以上の整数で入れてください', 'err');
        const cur = Number(o.amount), next = Number(v);
        if (cur === next) return renderSteps();
        // 大きく変わるときは念のため確認（10倍・10分の1はサーバーが弾く）
        if (cur > 0 && (next > cur * 1.5 || next < cur / 1.5) &&
            !confirm(`数量を ${cur.toLocaleString('ja-JP')} → ${next.toLocaleString('ja-JP')} に変えます。よろしいですか？`)) return;
        save.disabled = true;
        const j = await write({ action: 'amount', id: o.id, amount: next });
        save.disabled = false;
        if (outcomeUnknown(j, x => Number.isFinite(x.amount))) return markUnsure(o, '数量の変更');
        if (!j.ok) return say($('stepMsg'), j.error || '変えられませんでした', 'err');
        if (!o.amountFrom) o.amountFrom = String(cur);
        o.amount = j.amount; o.amountLog = j.line || o.amountLog;
        say($('stepMsg'), `仕上がり数量を ${cur.toLocaleString('ja-JP')} → ${next.toLocaleString('ja-JP')} にしました`, 'ok');
        renderSteps(); renderOrders();
      };
    };
    return box;
  }

  /* ---------- 納期の変更 ---------- */
  // 数量と同じく、伝票発行後は変えられない（発行後は数量の欄に案内が出るのでここは何も出さない）
  function ndateEditor(o) {
    const box = document.createElement('div'); box.className = 'amt';
    if (o.amountLocked) return box;
    const open = document.createElement('button'); open.type = 'button'; open.className = 'amtbtn date'; open.textContent = '納期を変える';
    box.append(open);
    if (o.ndateLog) { const n = document.createElement('span'); n.className = 'note'; n.textContent = '最後の変更: ' + o.ndateLog; box.append(n); }
    open.onclick = () => {
      box.textContent = '';
      const inp = document.createElement('input'); inp.type = 'date'; inp.value = o.ndate || '';
      inp.setAttribute('aria-label', '納期');
      const save = document.createElement('button'); save.type = 'button'; save.className = 'btn'; save.textContent = '保存';
      const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'amtbtn'; cancel.textContent = 'やめる';
      box.append(inp, save, cancel);
      inp.focus();
      cancel.onclick = () => renderSteps();
      save.onclick = async () => {
        const next = inp.value;
        if (!/^\d{4}-\d\d-\d\d$/.test(next)) return say($('stepMsg'), '納期の日付を選んでください', 'err');
        if (next === o.ndate) return renderSteps();
        const [y, m, d] = next.split('-').map(Number);
        const label = `${m}/${d}(${WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`;
        // 過ぎた日にするのは打ち間違いのことが多いので確認する
        if (daysFromToday(next) < 0 && !confirm(`納期を過ぎた日（${label}）にします。よろしいですか？`)) return;
        save.disabled = true;
        const j = await write({ action: 'ndate', id: o.id, ndate: next });
        save.disabled = false;
        if (outcomeUnknown(j, x => /^\d{4}-\d\d-\d\d$/.test(String(x.ndate || '')))) return markUnsure(o, '納期の変更');
        if (!j.ok) return say($('stepMsg'), j.error || '変えられませんでした', 'err');
        if (!o.ndateFrom) o.ndateFrom = o.ndate || '空白';
        const before = o.ndate ? fmtDate(o.ndate) : '空白';
        o.ndate = j.ndate; o.ndateLog = j.line || o.ndateLog;
        say($('stepMsg'), `納期を ${before} → ${label} にしました`, 'ok');
        renderSteps(); renderOrders();
      };
    };
    return box;
  }

  /* ---------- 画像 ---------- */
  // Airtable の画像URLは数時間で切れる。切れていたら一覧を取り直すよう案内する
  function imgFail(img) {
    img.onerror = null; img.removeAttribute('src'); img.alt = '期限切れ'; img.title = '更新ボタンで再表示できます';
    img.style.background = '#334155';
  }
  function thumbOf(o) {
    const list = (o.images || []).filter(a => a.thumb);
    if (!list.length) return null;
    const box = document.createElement('span'); box.className = 'thumb';
    const img = document.createElement('img'); img.loading = 'lazy'; img.alt = '画像'; img.src = list[0].thumb;
    img.onerror = () => imgFail(img);
    box.append(img);
    if (list.length > 1) { const n = document.createElement('span'); n.className = 'n'; n.textContent = '+' + (list.length - 1); box.append(n); }
    // 行のボタンの中だが、画像を押したときは行の選択ではなく全画面表示にする
    // 自動の読み直しで行を作り直さなかったときも、最新の一覧の URL で開く（古い URL は数時間で切れる）
    box.addEventListener('click', (e) => {
      e.stopPropagation();
      const cur = S.orders.find(x => x.id === o.id) || o;
      openViewer((cur.images || []).filter(a => a.thumb), 0);
    });
    return box;
  }
  function renderStepImages(o) {
    const box = $('stepImgs'); box.textContent = '';
    box.parentNode.querySelectorAll('.imgnote').forEach(e => e.remove());
    const list = (o.images || []).filter(a => a.thumb);
    list.forEach((a, i) => {
      const img = document.createElement('img'); img.src = a.thumb; img.alt = a.name || '画像';
      img.onerror = () => imgFail(img);
      img.onclick = () => openViewer(list, i);
      box.append(img);
    });
    if (list.length > 1) {
      const n = document.createElement('div'); n.className = 'imgnote';
      n.textContent = `画像が${list.length}枚あります（横にずらすと次の画像）`;
      box.before(n); box.dataset.note = 1;
    }
  }
  let viewerList = [], viewerIdx = 0;
  function openViewer(list, i) {
    viewerList = list; viewerIdx = i; showViewer();
    $('viewer').hidden = false; document.body.style.overflow = 'hidden';
  }
  function showViewer() {
    const a = viewerList[viewerIdx]; if (!a) return;
    $('vimg').classList.remove('zoom');
    const pic = $('vpic'); pic.src = a.full; pic.onerror = () => imgFail(pic);
    $('vname').textContent = (a.name || '') + (viewerList.length > 1 ? `（${viewerIdx + 1}/${viewerList.length}）` : '');
    $('vopen').href = a.full;
  }
  function closeViewer() { $('viewer').hidden = true; document.body.style.overflow = ''; $('vpic').removeAttribute('src'); }
  $('vclose').onclick = closeViewer;
  // 画像を押すと原寸⇔画面に合わせる を切り替え。複数あるときは左右の端を押すと前後へ
  $('vimg').onclick = (e) => {
    const r = $('vimg').getBoundingClientRect(); const x = (e.clientX - r.left) / r.width;
    if (viewerList.length > 1 && (x < 0.15 || x > 0.85)) {
      viewerIdx = (viewerIdx + (x < 0.15 ? -1 : 1) + viewerList.length) % viewerList.length; showViewer(); return;
    }
    $('vimg').classList.toggle('zoom');
  };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('viewer').hidden) closeViewer(); });

  // 一覧の品名は # 以降（工程・配送のタグ）を外す。工程は下の流れで分かる。1件を開いた画面では元の品名のまま
  const itemShort = (o) => String(o.item || '').replace(/\s*[#＃].*$/s, '').trim() || o.item || '(品名なし)';

  function memoLine(o) {
    if (!o.memo) return null;
    const m = document.createElement('div'); m.className = 'memo'; m.textContent = '連絡: ' + o.memo; return m;
  }

  function renderOrders() {
    if (S.mode === 'list') return renderList();
    const box = $('orders'); box.textContent = '';
    for (const o of S.orders) {
      const el = document.createElement('button'); el.type = 'button';
      el.className = 'order' + (o.closed ? ' closed' : '') + (S.sel === o.id ? ' sel' : '');
      const it = document.createElement('div'); it.className = 'item'; it.textContent = itemShort(o);
      const mt = document.createElement('div'); mt.className = 'meta';
      mt.textContent = `${o.book} / ${o.wc}`; // 進行は下の流れに出す
      const info = document.createElement('div'); info.className = 'info';
      if (S.sel === o.id) { const s = document.createElement('span'); s.className = 'selmark'; s.textContent = '選択中'; s.style.alignSelf = 'flex-start'; info.append(s); }
      info.append(it, facts(o), mt, progressStrip(o));
      const mm = memoLine(o); if (mm) info.append(mm);
      const wrap = document.createElement('div'); wrap.className = 'orow'; wrap.append(info);
      const th = thumbOf(o); if (th) wrap.append(th);
      el.append(wrap);
      el.dataset.id = o.id;
      el.onclick = () => selectOrder(o.id);
      box.append(el);
    }
  }

  /* ---------- タブ ---------- */
  function setMode(m) {
    S.mode = m; store.set('process.mode', m);
    // 読み込み途中の一覧の応答は、切り替えた後の画面には使わない
    listGen++; listBusy = 0;
    $('tabList').classList.toggle('on', m === 'list'); $('tabFind').classList.toggle('on', m === 'find');
    $('tabList').setAttribute('aria-selected', String(m === 'list')); $('tabFind').setAttribute('aria-selected', String(m === 'find'));
    $('listCard').hidden = m !== 'list'; $('findCard').hidden = m !== 'find';
    $('listHead').hidden = m !== 'list';
    document.body.classList.toggle('has-head', m === 'list');
    fitHead();
    $('stepCard').hidden = true; S.sel = null; $('variants').hidden = true;
    if (m === 'list') { stopCam(); loadView(S.view || store.get('process.view') || ''); }
    else { S.orders = []; renderOrders(); say($('findMsg'), ''); }
  }
  $('tabList').onclick = () => setMode('list');
  $('tabFind').onclick = () => setMode('find');

  // 作業リストの自動の読み直し。受注を開いて操作している間・書き込み中・画像を全画面で見ている間は、押す位置や入力がずれないよう読み直さない。
  // 2026-10-23 以前は「行を選んでいる（S.sel）」で止めていたため、記録して一覧に戻った後（行の選択表示は残る）も止まったままだった。
  // 止める条件は「受注のカードを開いている」に変えた（選んだ行の表示とは別）
  const detailOpen = () => !$('stepCard').hidden;
  const canAutoLoad = () => S.mode === 'list' && !detailOpen() && !writing && $('viewer').hidden && !document.hidden;
  // スリープや別のアプリから戻ったら読み直す（2026-10-14）。サーバーの20秒の使い回しに乗せて、スマホで待たないようにする（2026-10-20）
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (!hiddenAt || Date.now() - hiddenAt < 5000) return; // 一瞬の切り替えでは読まない
    hiddenAt = 0;
    if (canAutoLoad()) loadView(S.view, false, true);
  });
  // 開いたままでも3分ごとに読み直す（2026-10-15）。サーバーの20秒の使い回しに乗せるので、何台で開いても Airtable の回数制限にかからない
  setInterval(() => { if (canAutoLoad()) loadView(S.view, false, true); }, 3 * 60 * 1000);

  /* ---------- 作業リスト ---------- */
  // 一覧の中身の比較用。画像の URL は取るたびに署名が変わるので、ファイル名だけで比べる
  const rowsSig = rows => JSON.stringify(rows.map(o => ({ ...o, images: (o.images || []).map(a => a.name) })));
  let shownSig = '';
  // quiet: 自動の読み直し。「読み込み中…」を出さず、待っている間に受注を開いたりしたら結果を捨てる。
  // 2026-10-23 応答の順番が入れ替わっても古い応答で画面を戻さないよう、読み込みごとに番号を振り、最後に始めたものだけを使う
  // （機械貼→たおし抜き と続けて押してたおし抜きが先に返った、自動の読み直しが手動の更新より後に返った、など）。
  // 手動の読み込み中は自動の読み直しを重ねない。読み取りだけなので、古い要求は結果を捨てるだけで中断はしない。
  // 返り値: 一覧に反映できたら true
  let listGen = 0, listBusy = 0;
  async function loadView(key, refresh, quiet) {
    if (quiet && listBusy) return false;
    const gen = ++listGen;
    if (!quiet) { listBusy = gen; say($('listMsg'), '読み込み中…'); }
    // まず画像なしで一覧を出す（早い）。縮小画像は loadImages で後から足す（2026-10-20）
    const j = await api({ action: 'view', view: key || 'cad', refresh: !!refresh, lite: true });
    if (listBusy === gen) listBusy = 0;
    if (gen !== listGen || S.mode !== 'list') return false; // 後から始めた読み込みがある／品番で探すに切り替えた
    if (quiet && !canAutoLoad()) return false;
    if (!j.ok || !Array.isArray(j.rows) || !Array.isArray(j.views) || !j.views.length) {
      // 読めなかった。前の一覧が出ていれば、それが古いことを見出しに出す（最新のようには見せない）
      S.listFail = true; showFresh();
      const err = j.ok ? '一覧の応答が正しくありません' : (j.error || '読み込めませんでした');
      if (!S.listAt) { say($('listMsg'), `一覧を取得できませんでした（${err}）`, 'err'); S.listMsgErr = true; }
      else if (!quiet) { say($('listMsg'), `${err}。以前の一覧を表示しています`, 'err'); S.listMsgErr = true; }
      $('listRetry').hidden = false;
      return false;
    }
    // ビューを切り替えたら、前のリストの絞り込みは持ち越さない
    if ((j.view || j.views[0].key) !== S.view) S.filter = 'all';
    S.views = j.views; S.steps = j.steps; S.rooms = j.rooms || []; S.view = j.view || j.views[0].key;
    store.set('process.view', S.view);
    S.orders = j.rows;
    S.listAt = j.cachedAt || Date.now(); S.listFail = false; $('listRetry').hidden = true;
    // 前に取った画像があればすぐ付ける（自動の読み直しで画像が消えないように）
    for (const o of S.orders) o.images = imgById.get(o.id) || [];
    renderChips();
    // 自動の読み直しで中身が変わっていなければ、行も画像も作り直さない（スマホで画像を全部取り直して重くなるため。2026-10-20）
    const sig = rowsSig(j.rows);
    // ただし前の読み込みの失敗の案内が本文に残っていれば、件数の案内に戻す（見出しと本文を食い違わせない）
    if (quiet && sig === shownSig) { showFresh(); if (S.listMsgErr) showListMsg(); loadImages(S.view, true); return true; }
    shownSig = sig;
    renderList();
    updateListHead();
    loadImages(S.view, quiet);
    return true;
  }

  /* ---------- 縮小画像は後から ---------- */
  // 画像の URL は数時間で切れるので、自動の読み直しのときは30分たっていれば取り直す
  const imgById = new Map(); const imgAt = {};
  async function loadImages(key, quiet) {
    if (quiet && imgAt[key] && Date.now() - imgAt[key] < 30 * 60 * 1000) return;
    await new Promise(r => setTimeout(r, 300)); // 一覧の描画を先に終わらせる
    const j = await api({ action: 'viewImages', view: key });
    if (!j.ok || S.view !== key || S.mode !== 'list') return;
    imgAt[key] = Date.now();
    for (const [id, imgs] of Object.entries(j.images || {})) imgById.set(id, imgs);
    for (const o of S.orders) {
      const imgs = j.images?.[o.id]; if (!imgs) continue;
      o.images = imgs;
      // まだ画像の無い行にだけ縮小画像を差し込む（行を作り直さないのでスクロール位置は動かない）
      const el = document.querySelector(`#list .order[data-id="${o.id}"]`);
      const wrap = el && el.querySelector('.orow');
      if (wrap && !wrap.querySelector('.thumb')) { const th = thumbOf(o); if (th) wrap.append(th); }
    }
    // 画像が来る前に受注を開いていたら、工程カードの画像も出す
    const cur = current();
    if (cur && !$('stepCard').hidden && j.images?.[cur.id]) renderStepImages(cur);
  }

  // 見出し「作業リスト（オートン抜き）」と件数。着手可・済の数も添える。絞り込み中は「表示5件／全24件」
  function updateListHead() {
    const v = S.views.find(x => x.key === S.view);
    $('listHeadName').textContent = `作業リスト（${v ? v.label : ''}）`;
    const n = S.orders.length, c = S.counts || {};
    $('listHeadCnt').textContent = !n ? '0件'
      : S.filter !== 'all' ? `表示${S.shown ?? n}件／全${n}件`
      : [`${n}件`, c.ready && `着手可${c.ready}`, c.done && `済${c.done}`].filter(Boolean).join('・');
    showFresh();
    fitHead();
  }
  // 一覧の鮮度（2026-10-23）。一覧を画面に反映した時刻だけを出す（画像を取った時刻ではない）。
  // 時刻はサーバーが Airtable を読んだ時刻（最大20秒の使い回しを含む）で、Airtable 側で最後に変わった時刻ではない
  const hhmm = (t) => new Date(t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo' });
  function showFresh() {
    const el = $('listFresh');
    if (S.listFail && S.listAt) { el.textContent = `⚠ 更新失敗・以前の情報を表示中（${hhmm(S.listAt)} の一覧）`; el.className = 'fresh err'; }
    else if (S.listFail) { el.textContent = '⚠ 一覧を取得できませんでした'; el.className = 'fresh err'; }
    else if (S.listAt) { el.textContent = `一覧更新 ${hhmm(S.listAt)}`; el.className = 'fresh'; }
    else { el.textContent = ''; el.className = 'fresh'; }
    fitHead();
  }
  // 見出しを押すと一番上の行へ戻る（見出しの高さぶん下げて、行が隠れないようにする）
  $('listHead').onclick = () => {
    const head = $('listHead');
    const first = $('list').firstElementChild;
    const target = first || $('listCard');
    const sc = scroller();
    if (!first) { sc.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const base = sc === window ? 0 : sc.getBoundingClientRect().top;
    const y = target.getBoundingClientRect().top - base + scrollTopOf(sc) - head.offsetHeight - 8;
    sc.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  };
  // 固定した見出しの高さぶん、本文を下げる（文字の大きさや改行で高さが変わるので毎回測る）
  function fitHead() {
    const h = $('listHead'); if (!h || h.hidden) return;
    document.documentElement.style.setProperty('--headh', h.offsetHeight + 'px');
  }
  window.addEventListener('resize', fitHead);
  // 配色の切替や件数の桁で見出しの高さが変わっても、本文の下げ幅を自動で合わせる（VIVANT で見出しがボタンに重なった）
  if (window.ResizeObserver) new ResizeObserver(fitHead).observe($('listHead'));
  // 作業リストのときは本文（.wrap）が、それ以外はページがスクロールする
  const scroller = () => (document.body.classList.contains('has-head') ? document.querySelector('.wrap') : window);
  const scrollTopOf = (sc) => (sc === window ? window.scrollY : sc.scrollTop);
  // 少しでも下へ動いたら影と「↑ 先頭へ」を出す
  const onScroll = () => {
    const h = $('listHead'); if (!h || $('listCard').hidden) return;
    h.classList.toggle('stuck', scrollTopOf(scroller()) > 8);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  document.querySelector('.wrap').addEventListener('scroll', onScroll, { passive: true });

  function renderChips() {
    const box = $('viewChips'); box.textContent = '';
    for (const v of S.views) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = v.label;
      if (v.key === S.view) b.classList.add('on');
      b.setAttribute('aria-pressed', String(v.key === S.view));
      b.onclick = () => { S.sel = null; $('stepCard').hidden = true; loadView(v.key); };
      box.append(b);
    }
    const sp = document.createElement('span'); sp.className = 'sp'; box.append(sp);
    const r = document.createElement('button'); r.type = 'button'; r.textContent = '更新';
    // 手で押した更新は、開いている受注のカードも最新にする（自動の読み直しはカードを開いている間は動かない）
    r.onclick = async () => { if (await loadView(S.view, true)) syncDetail('一覧と開いている受注を最新の状態にしました'); };
    box.append(r);
  }
  $('listRetry').onclick = () => loadView(S.view || store.get('process.view') || '', true);


  /* ---------- 状態の絞り込み（2026-10-23） ---------- */
  // 取得済みの一覧を画面の中で絞るだけ。並び順は Airtable のビューのまま（着手可順に並べ替えない）
  const FILTERS = [['all', 'すべて'], ['ready', '着手可'], ['wait', '待ち'], ['done', '自工程済']];
  const hasMine = (v) => !!(v && (v.mine || []).length);
  function renderFilter(counts) {
    const box = $('filtChips'); box.textContent = '';
    const v = S.views.find(x => x.key === S.view);
    // 自分の工程の決まりが無いリスト（全件・Recent・Fax）では出さず、絞り込みも残さない
    if (!hasMine(v) || !S.orders.length) { box.hidden = true; if (!hasMine(v)) S.filter = 'all'; return; }
    box.hidden = false;
    const l = document.createElement('span'); l.className = 'lbl'; l.textContent = '状態:'; box.append(l);
    for (const [k, label] of FILTERS) {
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = k === 'all' ? `${label} ${S.orders.length}` : `${label} ${counts[k] || 0}`;
      b.setAttribute('aria-pressed', String(S.filter === k));
      b.onclick = () => { S.filter = k; renderList(); };
      box.append(b);
    }
  }

  // 作業リストでの受注の状態。判定は mineDone（済）と mineReady（着手可）をそのまま使う。
  // 待ちは理由（waitReason）が言えるものだけにし、どれにも当たらなければ「状態未確認」。
  // 自分の工程の決まりが無いリスト・閉じた受注は状態を出さない
  function rowState(o, v) {
    if (!hasMine(v)) return { kind: '' };
    const md = mineDone(o, v); if (md) return { kind: 'done', md };
    if (o.closed) return { kind: '' };
    const mr = mineReady(o, v); if (mr) return { kind: 'ready', mr };
    const w = waitReason(o, v); if (w) return { kind: 'wait', ...w };
    return { kind: 'unknown' };
  }
  // 着手できない理由（確かな根拠があるときだけ。mineReady が null のときに呼ぶ）。
  // ・品名タグの並びで自分より前の部屋が済んでいない → 一番先に済ませる工程を1つ（残りは札の説明と社内の流れで見える）
  //   ただし、それより後ろの部屋が済んでいるなら記録の付け忘れかもしれないので「前工程の完了記録を確認」
  // ・前に部屋が無く、まだ何の工程も済んでいない → 材料（進行社外・紙入荷日）が分かるときだけ材料待ち
  // 進行社外が空白のシートの要る受注は、作業リストを読んだときにサーバーが シート手配待ち にする（2026-10-29）
  const SHEET_WAIT = 'シート手配待ち';
  const SHEET_TAGS = ['オートン', 'たおしK判', 'たおしM判'];
  const roomLabel = (tag) => S.rooms.find(r => r.tag === tag)?.name || tag;
  function waitReason(o, v) {
    const tags = itemTags(o), mine = viewTags(v);
    const at = tags.findIndex(t => mine.includes(t));
    if (at > 0) {
      const left = tags.slice(0, at).filter(t => !tagDone(o, t));
      if (left.length) {
        const i = tags.indexOf(left[0]);
        const title = '先に済ませる工程: ' + left.map(roomLabel).join(' → ');
        // sub は札の中に小さく出す補足（スマホでは title が見えないので、工程名は札に書く）
        if (tags.slice(i + 1).some(t => tagDone(o, t))) return { text: '前工程の完了記録を確認', sub: left.map(roomLabel).join('・'), title: title + '（後ろの工程は済になっています）' };
        const s = S.steps.find(x => x.variants.some(y => y.tag === left[0]));
        // 先に済ませるのがシートの要る抜き（オートン・たおし）で、進行社外が シート手配待ち なら、抜きより先にシートを待っている。
        // 在庫シート利用・入荷済なら今までどおり「オートン抜き待ち」（2026-10-29 ユーザー指定）
        if (o.progOut === SHEET_WAIT && SHEET_TAGS.includes(left[0])) {
          return { text: SHEET_WAIT, sub: 'その後 ' + left.map(roomLabel).join('・'), title };
        }
        return { text: (s ? s.label.replace(/完了$/, '') : roomLabel(left[0]) + 'の作業') + '待ち',
          sub: left.length > 1 ? 'ほか ' + left.slice(1).map(roomLabel).join('・') : '', title };
      }
    }
    if (!(v.readyOut || []).length || doneSteps(o).some(x => x.s.group !== 'status')) return null;
    if (o.progOut === SHEET_WAIT) return { text: SHEET_WAIT };
    const pn = paperNote(o);
    if (o.progOut === 'シート手配済み' || (!o.progOut && pn)) {
      if (!pn) return { text: '材料の入荷待ち' };
      return { text: pn.diff > 0 ? `材料 ${pn.text}` : '材料の入荷確認待ち', title: '紙入荷日 ' + pn.text };
    }
    return null;
  }
  function stateBadge(st, v) {
    const b = document.createElement('span'); b.className = 'minebadge';
    const sm = document.createElement('small');
    if (st.kind === 'done') {
      // 「CADカット完了 済」のような重複を避け、一覧の名前で出す。仕上がり済で済とみなしたものはそう書く
      b.classList.add('done'); b.append(`✓ ${v.label} 済`);
      if (st.md.who) { sm.textContent = st.md.who; b.append(sm); }
    } else if (st.kind === 'ready') {
      b.classList.add('ready'); b.append('▶ 着手できます');
      sm.textContent = st.mr.label; b.append(sm);
    } else if (st.kind === 'wait') {
      b.classList.add('wait'); b.append('◷ ' + st.text);
      if (st.sub) { sm.textContent = st.sub; b.append(sm); }
      if (st.title) b.title = st.title;
    } else if (st.kind === 'unknown') {
      b.classList.add('note'); b.append('状態未確認');
      b.title = '着手できるか・何を待っているかを判断できる記録がありません';
    } else return null;
    return b;
  }

  function renderList() {
    const box = $('list'); box.textContent = '';
    const v = S.views.find(x => x.key === S.view);
    const states = new Map(S.orders.map(o => [o.id, rowState(o, v)]));
    const counts = {};
    for (const st of states.values()) counts[st.kind] = (counts[st.kind] || 0) + 1;
    renderFilter(counts);
    // 並びは 緑枠（着手可）→ 無印（待ち・未確認など）→ 青枠（済）。同じ枠の中は納品日順（空は最後）（2026-10-26）
    const band = (o) => ({ ready: 0, done: 2 })[states.get(o.id).kind] ?? 1;
    const shown = (S.filter === 'all' ? S.orders : S.orders.filter(o => states.get(o.id).kind === S.filter)).slice()
      .sort((a, b) => (band(a) - band(b)) || String(a.ndate || '9999').localeCompare(String(b.ndate || '9999')));
    S.counts = counts; S.shown = shown.length;
    for (const o of shown) {
      const st = states.get(o.id);
      const row = document.createElement('div'); row.className = 'lrow';
      const el = document.createElement('button'); el.type = 'button';
      el.className = 'order' + (S.sel === o.id ? ' sel' : '');
      const it = document.createElement('div'); it.className = 'item'; it.textContent = itemShort(o);
      if (st.kind === 'done') el.classList.add('mine');
      if (st.kind === 'ready') el.classList.add('ready');
      if (st.kind === 'wait') el.classList.add('wait');
      const mt = document.createElement('div'); mt.className = 'meta';
      mt.textContent = `${o.book} / ${o.wc}`; // 進行は下の流れに出す
      const info = document.createElement('div'); info.className = 'info';
      const bd = document.createElement('div'); bd.className = 'badges';
      const sb = stateBadge(st, v); if (sb) bd.append(sb);
      if (S.sel === o.id) { const s = document.createElement('span'); s.className = 'selmark'; s.textContent = '選択中'; bd.append(s); }
      if (bd.childNodes.length) info.append(bd);
      info.append(it, facts(o), mt, progressStrip(o, S.view));
      const mm = memoLine(o); if (mm) info.append(mm);
