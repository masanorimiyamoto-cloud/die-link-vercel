  /* ---------- 受領伝票のすぐ発行（2026-11-10） ---------- */
  // 定時の自動発行を待たずに、事務所のプリンタでこの受注の受領伝票を出す。押すとサーバーが依頼の表に1行書き、
  // 事務所PC（receipt_slip_issue.py の依頼モード）が拾って発行する。進行社外が 受領伝票発行可能 でなければ断る
  // （サーバーも同じく断る）。伝票ID がある・伝票の後の段階（伝票出力済・完納・取消）ならボタンを出さない。
  // 依頼ID・送り直し・状況の読み直しは工程表のコピー印刷と同じ
  const SL_READY = '受領伝票発行可能';
  const SL_AFTER = new Set(['伝票出力済', '完納済', '完納（数量訂正）', '伝票取消']);
  const SL_LABEL = { '依頼済': '発行待ち', '発行中': '発行中', '発行済': '発行しました', '失敗': '発行できませんでした' };
  const slPending = (r) => r && (r.state === '依頼済' || r.state === '発行中');
  function slipRefusal(o) {
    if (o.archived) return 'アーカイブ済の受注なので発行できません';
    if (o.slipId) return `受領伝票は発行済みです（伝票ID ${o.slipId}）`;
    if (o.progOut !== SL_READY) return `進行社外が「${SL_READY}」ではないので発行できません（今: ${o.progOut || '空白'}）`;
    return '';
  }
  S.sl = {}; // 受注ID → { last, at, retry, msg, cls, sending, loading, timer, pollFrom }
  function renderSlipIssue(o) {
    const box = $('slipIssue'); box.textContent = '';
    const st = S.sl[o.id] || (S.sl[o.id] = {});
    const line = document.createElement('div'); line.className = 'kcst';
    if ((o.slipId || SL_AFTER.has(o.progOut)) && !slPending(st.last) && !st.msg) {
      if (o.slipId) { line.textContent = `受領伝票は発行済みです（伝票ID ${o.slipId}）`; box.append(line); }
      return;
    }
    const ready = !slipRefusal(o);
    const mt = ready && !slPending(st.last) ? slMates(st) : { go: [], busy: [], wait: [], over: 0 };
    const b = document.createElement('button'); b.type = 'button'; b.className = 'amtbtn' + (ready ? '' : ' off');
    b.textContent = '🧾 受領伝票をすぐ発行' + (mt.go.length ? `（${mt.go.length + 1}件まとめて）` : '');
    b.disabled = !!st.sending || slPending(st.last);
    const r = st.last;
    if (st.msg) { line.textContent = st.msg; line.className = 'msg ' + (st.cls || ''); }
    else if (r) line.textContent = `${slPending(r) ? '' : '前回: '}${hm(r.at)} ${r.by} の依頼 → ${SL_LABEL[r.state] || r.state}${r.doneAt && !slPending(r) ? '（' + hm(r.doneAt) + '）' : ''}${r.state === '失敗' && r.memo ? '：' + r.memo : ''}`;
    else line.textContent = ready ? `定時の自動発行を待たずに、事務所のプリンタで${mt.go.length ? `この受注と下の ${mt.go.length}件をまとめた` : 'この受注の'}受領伝票を出します`
      : `受領伝票発行可能になると発行できます（今の進行社外: ${o.progOut || '空白'}）`;
    box.append(b, line);
    // 同じ伝票に入る受注（同じ納期・納品先）を、押す前から見えるように出す（2026-11-11）
    if (ready && !slPending(st.last)) {
      if (st.mates === null) box.append(slNote('同じ納期・納品先の受注を確かめられませんでした（押したときにもう一度確かめます）', 'warn'));
      if (mt.go.length) box.append(slMateList(`同じ納期・納品先の ${mt.go.length}件も、一緒に同じ伝票に入れます`, mt.go, 'go'));
      if (mt.over) box.append(slNote(`同じ納期・納品先の受注が多いので、残りの ${mt.over}件は入りません（発行の後にもう一度押してください）`, 'warn'));
      if (mt.busy.length) box.append(slMateList(`すでに発行を依頼中の ${mt.busy.length}件（今回の依頼には入れません）`, mt.busy, ''));
      if (mt.wait.length) box.append(slMateList(`まだ発行可能でない ${mt.wait.length}件は、この伝票に入りません`, mt.wait, 'wait'));
    }
    b.onclick = () => slRequest(o);
    if (!st.at || Date.now() - st.at > 30000) slLoad(o.id);
  }
  // 一緒に依頼する受注（go）・依頼中（busy）・まだ発行可能でない（wait）。1回の依頼は選んだ受注＋9件まで（サーバーの SL_MATE_MAX と同じ）
  const SL_MATE_MAX = 9;
  function slMates(st) {
    const m = st.mates || { ready: [], wait: [] };
    const free = (m.ready || []).filter(x => !x.pending);
    return { go: free.slice(0, SL_MATE_MAX), over: Math.max(0, free.length - SL_MATE_MAX), busy: (m.ready || []).filter(x => x.pending), wait: m.wait || [] };
  }
  const slMateText = (x) => `${x.book} / ${x.wc}　${itemShort(x)}　数量 ${x.amount == null ? '?' : Number(x.amount).toLocaleString('ja-JP')}`;
  function slNote(text, cls) { const n = document.createElement('div'); n.className = 'msg ' + cls; n.textContent = text; return n; }
  function slMateList(title, list, cls) {
    const w = document.createElement('div'); w.className = 'slmates ' + cls;
    const h = document.createElement('b'); h.textContent = title; w.append(h);
    const ul = document.createElement('ul');
    for (const x of list) {
      const li = document.createElement('li'); li.textContent = slMateText(x) + (cls === 'wait' ? `（今: ${x.progOut || '空白'}）` : '');
      ul.append(li);
    }
    w.append(ul);
    return w;
  }
  async function slLoad(id) {
    const st = S.sl[id] || (S.sl[id] = {});
    if (st.loading) return st.loading; // 読み込み中なら同じ読み込みを待つ（押した直後の確認で、古い一覧のまま進まない）
    return (st.loading = slLoadNow(id, st).finally(() => { st.loading = null; }));
  }
  async function slLoadNow(id, st) {
    const j = await api({ action: 'slipIssueStatus', id }).catch(() => ({ ok: false }));
    st.at = Date.now();
    if (!j.ok) st.mates = null; // 読めなかった（一緒に入る受注が分からない）
    if (j.ok) {
      const was = st.last;
      st.mates = j.mates === undefined ? { ready: [], wait: [] } : j.mates; // null は「読めなかった」
      st.last = j.requests?.[0] || null;
      if (slPending(st.last) && !st.pollFrom) st.pollFrom = Date.now();
      if (was && slPending(was) && st.last && !slPending(st.last) && st.last.reqId === was.reqId) {
        st.msg = st.last.state === '発行済' ? `受領伝票を発行しました（${hm(st.last.doneAt)}${st.last.slipId ? '・' + st.last.slipId : ''}）` : `発行できませんでした${st.last.memo ? '：' + st.last.memo : ''}`;
        st.cls = st.last.state === '発行済' ? 'ok' : 'err';
      }
    }
    if (current()?.id === id) renderSlipIssue(current());
    slPoll(id);
  }
  function slPoll(id) {
    const st = S.sl[id];
    clearTimeout(st.timer);
    if (!slPending(st.last) || Date.now() - (st.pollFrom || 0) > 600000) return;
    st.timer = setTimeout(() => { if (current()?.id === id && !$('stepCard').hidden) { st.at = 0; slLoad(id); } }, 15000);
  }
  async function slRequest(o) {
    const st = S.sl[o.id] || (S.sl[o.id] = {});
    if (st.sending) return;
    const why = slipRefusal(o);
    if (why) { st.msg = why; st.cls = 'err'; renderSlipIssue(o); return; }
    // 送り直し（結果不明の後）は、前に確認した内容のまま同じ依頼IDで送る。初めてのときは、同じ納期・納品先の受注を
    // 読み直してから確認を出す（画面に出ている一覧が古いまま、見せていない受注を伝票に入れない）
    let withIds = st.retryWith || [];
    if (!st.retry) {
      st.sending = true; st.msg = '同じ納期・納品先の受注を確かめています…'; st.cls = ''; renderSlipIssue(o);
      st.at = 0; await slLoad(o.id);
      st.sending = false; if (st.msg === '同じ納期・納品先の受注を確かめています…') st.msg = '';
      if (current()?.id !== o.id || $('stepCard').hidden) return;
      if (slPending(st.last)) { renderSlipIssue(o); return; } // 確かめている間に依頼中と分かった
      const mt = slMates(st);
      renderSlipIssue(o);
      const more = st.mates === null ? '\n※ 同じ納期・納品先の受注を確かめられなかったので、この受注だけ発行します。\n'
        : (mt.go.length ? `\n【一緒に同じ伝票に入れる受注 ${mt.go.length}件】\n${mt.go.map(x => '・' + slMateText(x)).join('\n')}\n` : '')
        + (mt.over ? `\n※ ほかに ${mt.over}件ありますが、1回で入るのは ${SL_MATE_MAX + 1}件までです。\n` : '')
        + (mt.wait.length ? `\n【まだ発行可能でないので入らない受注 ${mt.wait.length}件】\n${mt.wait.map(x => '・' + slMateText(x)).join('\n')}\n` : '');
      if (!confirm(`${itemShort(o)}
${o.book} / ${o.wc}　数量 ${o.amount ?? '?'}・納期 ${o.ndate || '未定'}
${more}
${mt.go.length ? `この ${mt.go.length + 1}件を1つの受領伝票にまとめて` : 'この受注の受領伝票を'}、事務所のプリンタですぐ発行します。
数量・納期は伝票の後は変えられません。よろしいですか？`)) return;
      withIds = mt.go.map(x => x.id);
    }
    const reqId = st.retry || ('sl-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12)));
    st.sending = true; st.msg = '依頼しています…'; st.cls = ''; renderSlipIssue(o);
    const j = await api({ action: 'slipIssue', id: o.id, reqId, with: withIds });
    st.sending = false;
    if (j.unknown) { st.retry = reqId; st.retryWith = withIds; st.msg = '依頼できたか分かりません。もう一度押すと同じ依頼として確かめます（2枚にはなりません）'; st.cls = 'warn'; }
    else if (!j.ok) { st.retry = ''; st.retryWith = null; st.msg = j.error || '依頼できませんでした'; st.cls = 'err'; }
    else {
      st.retry = ''; st.retryWith = null; st.last = j.request; st.at = Date.now(); st.pollFrom = Date.now();
      const n = (j.mates || []).length;
      st.msg = j.dup ? `すでに依頼中です（${hm(j.request.at)} ${j.request.by}）。事務所のPCが発行するまでお待ちください`
        : (n ? `${n + 1}件を1つの伝票にまとめて依頼しました（${j.mates.map(x => `${x.book}/${x.wc}`).join('、')} も一緒）。` : '依頼しました。') + '1〜2分で事務所のプリンタから出ます'
          + ((j.dropped || []).length ? `。※ ${j.dropped.length}件は直前に状態が変わったため入れていません` : '');
      st.cls = (j.dropped || []).length ? 'warn' : 'ok'; navigator.vibrate?.(40);
      // 一緒に依頼した受注のカードを開いたときに、古い状況を出さない
      for (const x of j.mates || []) if (S.sl[x.id]) S.sl[x.id].at = 0;
    }
    if (current()?.id === o.id) renderSlipIssue(current());
    if (j.ok) slPoll(o.id);
  }

  function renderSteps() {
    const o = current(); if (!o) return;
    const v = detailView();
    const plan = primaryPlan(o, v);
    if (S.auxFor !== o.id) { S.auxFor = o.id; auxDefaults(o, v); }
    // 品名全文・品番・数量・納期・連絡事項全文・社外／社内の工程列（一覧と同じ progressStrip）を主操作より前に出す
    const t = $('target'); t.textContent = '';
    const it = document.createElement('div'); it.className = 'item'; it.textContent = o.item || '(品名なし)';
    const mt = document.createElement('div'); mt.className = 'meta';
    mt.textContent = `${o.book} / ${o.wc} ・ 今の進行: ${o.progIn || 'なし'}`;
    t.append(it, mt, facts(o));
    const mm = memoLine(o); if (mm) t.append(mm);
    const sp = specBlock(o); if (sp) t.append(sp);
    t.append(progressStrip(o, S.mode === 'list' ? S.view : ''));
    renderPrimary(o, v, plan);
    renderNext(o, v);
    $('goBar').replaceChildren(goBar(o));
    renderKoteiCopy(o);
    renderSlipIssue(o);
    renderSameWc(o);
    $('editors').replaceChildren(amountEditor(o), ndateEditor(o), paperEditor(o));
    renderStepImages(o);
    renderStepLists(o, plan);
    $('variants').hidden = true;
    renderNewOrder(o);
    renderDelete(o);
    renderRooms(o);
    applyUnsure(o); // 結果不明・書き込み中のボタン止めは、描き終えた最後にまとめて掛ける
  }

  /* ---------- 受注の削除（2026-10-30 / 2026-11-03 削除台帳） ---------- */
  // 工程の記録・伝票が無い受注だけ消せる（2026-11-03 から Excel 登録済も可）。サーバーも同じ決まりで弾く。
  // ボタンは「＋ この品目で新規受注」「承認済にする」と同じ行（#delSlot）に置き、結果の表示は #delOrder に出す。
  // サーバーは受注を消す前に削除台帳へ書く（書けなければ消さない）。Excel 同期は台帳を見て S96.5 の行を消す。
  // 削除要求ID は削除1回ごとに作る。通信が途切れて結果が分からないときは、同じ受注でもう一度押すと同じ ID で送り直し、
  // サーバーが台帳から続きを確かめる（二重に消すことはない）
  const newReqId = () => 'del-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12));
  function renderDelete(o) {
    $('delOrder').textContent = '';
    const slot = document.getElementById('delSlot');
    if (slot) slot.textContent = '';
    if (Object.keys(o.done || {}).length || !['', '工程表発行済'].includes(o.progIn) || o.amountLocked) return;
    const again = S.delPending && S.delPending.id === o.id;
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'delbtn';
    btn.textContent = again ? '削除の結果を確かめる（同じ削除を送り直す）' : 'この受注を削除';
    btn.dataset.w = '1';
    (slot || $('delOrder')).append(btn);
    btn.onclick = async () => {
      let req = S.delPending && S.delPending.id === o.id ? S.delPending : null;
      if (!req) {
        const excel = o.addPending ? '' : '\nExcel に入っている受注です。事務所の Excel（S96.5）の行も次の取り込みで消えます。';
        if (!confirm(`${itemShort(o)}\n${o.book} / ${o.wc}・数量 ${o.amount ?? '空白'}・納期 ${o.ndate || '空白'}\n\nこの受注を削除しますか？（元に戻せません）${excel}`)) return;
        const reason = prompt('削除の理由（任意。例: 打ち間違い・FAXの重複）', '');
        if (reason === null) return;
        req = { id: o.id, reqId: newReqId(), reason: reason.trim() };
      }
      await runOp(o, async () => {
        sayAt($('delOrder'), '削除しています…');
        const j = await write({ action: 'delete', id: o.id, reqId: req.reqId, reason: req.reason });
        if (j.unknown) {
          S.delPending = req; renderDelete(o); applyLocks();
          return sayAt($('delOrder'), '通信が途切れ、削除できたか確認できません。もう一度押すと同じ削除として確かめます（二重に消えることはありません）', 'err');
        }
        if (!j.ok && !j.gone) { S.delPending = null; renderDelete(o); applyLocks(); return sayAt($('delOrder'), j.error || '削除できませんでした', 'err'); }
        S.delPending = null;
        navigator.vibrate?.(60);
        S.orders = S.orders.filter(x => x.id !== o.id);
        $('stepCard').hidden = true; $('variants').hidden = true; S.sel = null;
        if (S.mode === 'list') await loadView(S.view, true); else renderOrders();
        const what = `${o.book} / ${o.wc}（納期 ${o.ndate || '空白'}）`;
        const text = j.gone ? `${what} の受注はもう消えていました`
          : j.ledgerWarn ? `${what} の受注を削除しました。削除台帳の状態を更新できませんでしたが、Excel 同期が続きを処理します`
          : `${what} の削除を受け付けました（削除台帳に記録・Excel 反映待ち）`;
        say(S.mode === 'list' ? $('listMsg') : $('findMsg'), text, j.ledgerWarn ? 'warn' : 'ok');
        if ($('delCard').open) loadDeletions();
      });
    };
  }

  // 削除した受注（削除台帳の最近の30件）。開いたときと削除の後に読む。読み取りだけ
  const DL_CLASS = { '受付済': 'warn', 'Airtable削除済': 'warn', 'Excel反映済': 'ok', '要確認': 'err' };
  const DL_LABEL = { '受付済': '受付済・Excel 反映待ち', 'Airtable削除済': 'Excel 反映待ち', 'Excel反映済': 'Excel 反映済み', '要確認': '要確認（事務所で確認）' };
  const jstShort = (iso) => { const t = Date.parse(iso); if (!Number.isFinite(t)) return ''; const d = new Date(t + 9 * 3600000); return `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`; };
  let delGen = 0;
  async function loadDeletions() {
    const gen = ++delGen;
    const box = $('delList');
    say($('delMsg'), '読み込んでいます…');
    const j = await api({ action: 'deletions' });
    if (gen !== delGen) return;
    if (!j.ok) return say($('delMsg'), j.error || '削除台帳を読めませんでした', 'err');
    box.textContent = '';
    say($('delMsg'), j.rows.length ? '' : '削除した受注はありません');
    for (const r of j.rows) {
      const it = document.createElement('div'); it.className = 'delrow';
      const st = document.createElement('div'); st.className = 'msg ' + (DL_CLASS[r.state] || '');
      st.textContent = DL_LABEL[r.state] || r.state || '状態なし';
      const nm = document.createElement('div'); nm.className = 'item'; nm.textContent = r.item || '(品名なし)';
      const mt = document.createElement('div'); mt.className = 'meta';
      mt.textContent = `${r.book} / ${r.wc}・数量 ${r.amount ?? '空白'}・納期 ${r.ndate || '空白'}・${r.by || '?'} ${jstShort(r.at)}` +
        (r.excelAt ? `・Excel ${jstShort(r.excelAt)}` : '');
      it.append(st, nm, mt);
      if (r.memo && r.state === '要確認') { const m = document.createElement('div'); m.className = 'meta'; m.textContent = r.memo; it.append(m); }
      box.append(it);
    }
  }
  $('delCard').addEventListener('toggle', () => { if ($('delCard').open) loadDeletions(); });

  /* ---------- 承認済（2026-11-03） ---------- */
  // 承認待ちの受注（FAX登録など）をここで承認する。入れるだけで外さない（承認済＋Excel 未登録の受注は Airtable_Fetch.py が Excel に行を足す）。
  // 承認済なら押せない印だけ出す
  function approveCtl(o, box) {
    if (o.approved) {
      const b = document.createElement('span'); b.className = 'approved'; b.textContent = '✓ 承認済';
      return b;
    }
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'amtbtn qty'; btn.textContent = '承認済にする';
    btn.dataset.w = '1';
    btn.onclick = async () => {
      const excel = o.addPending ? '\n承認すると、次の取り込みで Excel に入ります。' : '';
      if (!confirm(`${itemShort(o)}\n${o.book} / ${o.wc}・数量 ${o.amount ?? '空白'}・納期 ${o.ndate || '空白'}\n\nこの受注を承認済にしますか？${excel}`)) return;
      await runOp(o, async () => {
        sayAt(box, '承認しています…');
        const j = await write({ action: 'approve', id: o.id });
        if (outcomeUnknown(j, x => x.approved === true)) return markUnsure(o, '承認');
        if (!j.ok) return sayAt(box, j.error || '承認できませんでした', 'err');
        patch(o, x => { x.approved = true; });
        navigator.vibrate?.(40);
        renderSteps();
        sayAt(current() ? $('newOrder') : null, `承認済にしました${o.addPending ? '（Excel には次の取り込みで入ります）' : ''}`, 'ok');
      });
    };
    return btn;
  }

  /* ---------- 同じ品目の新規受注（2026-10-30） ---------- */
  // 品目の情報（品名・得意先・納品先・材料・後工程・図面）は元の受注からサーバーが写す。ここで入れるのは数量・納期・連絡事項だけ。
  // 作るとすぐ承認済になり、Airtable_Fetch.py が Excel に行を足す
  function renderNewOrder(o, opt = {}) {
    const box = opt.box || $('newOrder'); box.textContent = '';
    const open = document.createElement('button'); open.type = 'button'; open.className = 'amtbtn qty'; open.textContent = '＋ この品目で新規受注';
    open.dataset.w = '1';
    const delSlot = document.createElement('span'); delSlot.id = 'delSlot'; // 削除ボタンは renderDelete がここへ置く
    const top = document.createElement('div'); top.className = 'row'; top.append(open, approveCtl(o, box), delSlot);
    box.append(top);
    const showForm = () => {
      box.textContent = '';
      const head = document.createElement('div'); head.className = 'lbl';
      head.textContent = `新規受注（${o.book} / ${o.wc}）。顧客: ${o.spec?.kname || '顧客名なし'}。品名・得意先・納品先・後工程・図面を引き継ぎます。登録後、Excelへの取り込みを待ちます`;
      const amt = document.createElement('input'); amt.inputMode = 'numeric'; amt.placeholder = '数量'; amt.autocomplete = 'off'; amt.setAttribute('aria-label', '数量');
      const nd = document.createElement('input'); nd.type = 'date'; nd.setAttribute('aria-label', '納期');
      const r1 = document.createElement('div'); r1.className = 'row'; r1.append(amt, nd);
      const memo = document.createElement('input'); memo.placeholder = '連絡事項（任意）'; memo.autocomplete = 'off'; memo.setAttribute('aria-label', '連絡事項');
      const save = document.createElement('button'); save.type = 'button'; save.className = 'btn'; save.textContent = '登録する'; save.dataset.w = '1';
      const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'amtbtn'; cancel.textContent = opt.expanded ? '← 品目を選び直す' : 'やめる';
      const r2 = document.createElement('div'); r2.className = 'row'; r2.append(save, cancel);
      box.append(head, r1, memo, r2);
      applyLocks();
      amt.focus();
      cancel.onclick = () => { if (!busyNow()) { if (opt.onCancel) opt.onCancel(); else renderNewOrder(o); } };
      save.onclick = async () => {
        const n = amt.value.trim().replace(/[,，\s]/g, '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
        if (!/^\d+$/.test(n) || !(Number(n) > 0)) return sayAt(box, '数量は1以上の整数で入れてください', 'err');
        if (!/^\d{4}-\d\d-\d\d$/.test(nd.value)) return sayAt(box, '納期を選んでください', 'err');
        const [y, m, d] = nd.value.split('-').map(Number);
        const label = `${m}/${d}(${WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`;
        if (busyNow()) return;
        if (!confirm(`${itemShort(o)}\n${o.book} / ${o.wc}　顧客: ${o.spec?.kname || '顧客名なし'}\n${o.deli ? '納品先: ' + o.deli + '\n' : ''}数量 ${Number(n).toLocaleString('ja-JP')}・納期 ${label}\n\nこの内容で新規受注を作りますか？`)) return;
        await runOp(o, async () => {
          const send = async (force) => {
            sayAt(box, '新規受注を作っています…');
            return write({ action: 'neworder', id: o.id, amount: n, ndate: nd.value, memo: memo.value.trim(), force });
          };
          let j = await send(false);
          // 同じ納期・数量の受注が既にある（二度押し・通信の送り直しのことが多い）。本当に別の注文のときだけ作る（明示の再送はこの1回だけ）
          if (j.dup) {
            if (!confirm(`${j.error}。\n二度押しでなく、別の注文として作りますか？`)) return sayAt(box, '作りませんでした（同じ受注が既にあります）', 'warn');
            j = await send(true);
          }
          // 作れたか分からないときは送り直さない（二重登録を避ける）。品名で探し直せば確かめられる
          if (j.unknown) return sayAt(box, '通信が途切れ、新規受注が作られたか確認できません。もう一度押す前に、品名で探し直して確かめてください', 'err');
          if (!j.ok || !j.order) return sayAt(box, j.error || '新規受注を作れませんでした', 'err');
          navigator.vibrate?.([40, 40, 40]);
          const no = j.order;
          if (o.est && !no.est) no.est = o.est; // 同じ品番なので推定所要時間も同じ（次の読み込みを待たずに出す）
          const text = `新規受注を作りました（${no.book} / ${no.wc}・数量 ${Number(no.amount).toLocaleString('ja-JP')}・納期 ${label}）。Excel には次の取り込みで入ります`;
          rememberEntry(no);
          if (opt.onCreated) { opt.onCreated(no, text); return; }
          // 作った受注は候補の一番上に「今作成」の印で出し、そこまで動かして光らせる（カードは開かない）。
          // 作業リストから作ったときは品番で探すに切り替え、新しい受注と元の受注を並べる（ビューに出るかは条件次第のため）
          S.newIds.add(no.id);
          if (S.mode !== 'find') {
            setMode('find'); setBook(o.book); $('wc').value = String(o.wc); S.findBy = 'wc';
            S.orders = [o];
          }
          S.orders = pinNew([no, ...S.orders.filter(x => x.id !== no.id)]);
          $('stepCard').hidden = true; $('variants').hidden = true; S.sel = null;
          renderOrders();
          say($('findMsg'), text, 'ok');
          const row = document.querySelector(`#orders .order[data-id="${no.id}"]`);
          if (row) { scrollToCard($('findMsg')); row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
        });
      };
    };
    open.onclick = showForm;
    if (opt.expanded) showForm();
  }

  /* ---------- 状況: 進行社外「シート材料入荷済」「機械貼材料入荷済」「在庫シート利用」（2026-10-23 / 10-29） ---------- */
  // 他の状況ボタンは 進行社内 に書くが、これらは 進行社外 に書く。伝票発行の判定に使う欄なので、
  // 空白か材料待ち（シート手配待ち／シート手配済み）のときだけ押せる（サーバーも同じ決まりで弾く）
  // シート材料入荷済・機械貼材料入荷済 は入荷を確かめた報告としてインセンティブに数える（取り消せば数えない）
  const STOCK_OUT = '在庫シート利用';
  const SHEET_ARRIVED_OUT = 'シート材料入荷済';
  const KIKAI_ARRIVED_OUT = '機械貼材料入荷済';
  const STOCK_REPLACEABLE = ['', 'シート手配待ち', 'シート手配済み'];
  function stockCell(o, out) {
    if (o.progOut === out) {
      const cell = document.createElement('div'); cell.className = 'stepcell';
      const st = document.createElement('div'); st.className = 'step done past status';
      st.append(document.createTextNode('✓ ' + out));
      const sm = document.createElement('small'); sm.textContent = '進行社外に入っています'; st.append(sm);
      const un = document.createElement('button'); un.type = 'button'; un.className = 'undo'; un.textContent = '取り消す'; un.dataset.w = '1';
      un.setAttribute('aria-label', `進行社外の「${out}」を取り消す`);
      un.onclick = () => setStockOut(o, false, out);
      cell.append(st, un);
      return cell;
    }
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'step status';
    btn.append(document.createTextNode(out));
    const sm = document.createElement('small');
    const can = STOCK_REPLACEABLE.includes(o.progOut || '');
    sm.textContent = can ? '進行社外に入れる' : `進行社外が「${o.progOut}」なので変えられません`;
    btn.append(sm);
    btn.dataset.w = '1'; btn.dataset.off = can ? '' : '1'; btn.disabled = !can;
    btn.onclick = () => setStockOut(o, true, out);
    return btn;
  }
  async function setStockOut(o, on, out) {
    if (!on && !confirm(`進行社外の「${out}」を取り消しますか？\n入れる前の値（シート手配済み など）に戻します。`)) return;
    await runOp(o, async () => {
      sayAt($('stepsStatus').parentNode, on ? '進行社外に記録しています…' : '取り消しています…');
      const j = await write({ action: 'stock', id: o.id, on, out });
      if (outcomeUnknown(j, x => typeof x.progOut === 'string')) return markUnsure(o, on ? `「${out}」の記録` : `「${out}」の取り消し`);
      if (!j.ok) {
        if (j.stale) await refreshCurrent();
        else renderSteps();
        sayAt(current() ? $('stepsStatus').parentNode : null, j.error || '進行社外を変えられませんでした', 'err');
        return;
      }
      patch(o, x => { x.progOut = j.progOut; });
      navigator.vibrate?.(40);
      // 着手可・材料の表示が変わるので、作業リストは取り直してから戻る
      if (S.mode === 'list') await loadView(S.view, true);
      backToRow(o.id, on ? `進行社外を「${out}」にしました` : `進行社外の「${out}」を取り消しました（進行社外: ${j.progOut || '空白'}）`, on ? 'ok' : 'warn');
    });
  }

  /* ---------- Room（応援を頼む部屋） ---------- */
  // Airtable の選択肢の色名（blueLight2 など）を、暗い画面で見える色にする
  const ROOM_COLORS = { blue: '#2563eb', cyan: '#0891b2', teal: '#0d9488', green: '#16a34a', yellow: '#ca8a04',
    orange: '#ea580c', red: '#dc2626', pink: '#db2777', purple: '#9333ea', gray: '#64748b' };
  function roomColor(name) {
    const c = S.rooms.find(r => r.name === name)?.color || '';
    return ROOM_COLORS[/^[a-z]+/.exec(c)?.[0]] || '#4f8cff';
  }
  // 部屋名 → 工程(自動) のタグ名（手貼(花 神) → 花。それ以外は同じ名前）。サーバーが返す
  const roomTag = (name) => S.rooms.find(r => r.name === name)?.tag || name;
  function renderRooms(o) {
    const box = $('rooms'); box.textContent = '';
    $('roomHead').hidden = !S.rooms.length;
    $('auxRoom').hidden = !S.rooms.length;
    // 今の応援先（普段の部屋＝品名タグ 以外の Room）を見出しの横にも出す
    const help = (o.room || []).filter(r => !hasTag(o, roomTag(r)));
    $('roomNow').textContent = help.length ? '今: ' + help.join('・') : '（なし）';
    for (const r of S.rooms) {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'room'; btn.dataset.w = '1';
      const on = (o.room || []).includes(r.name);
      if (hasTag(o, r.tag || r.name)) btn.classList.add('def');
      if (on) { btn.classList.add('on'); btn.style.setProperty('--rc', roomColor(r.name)); }
      btn.textContent = (on ? '✓ ' : '') + r.name;
      btn.onclick = () => toggleRoom(o, r.name, !on);
      box.append(btn);
    }
    applyUnsure(o); // 工程カードの最後に描くので、結果不明のときのボタン止めもここでまとめて掛ける
  }
  async function toggleRoom(o, room, on) {
    if (!on && !confirm(`Room から「${room}」を外しますか？`)) return;
    await runOp(o, async () => {
      const near = $('rooms').parentNode;
      sayAt(near, on ? `Room に ${room} を入れています…` : `Room から ${room} を外しています…`);
      const j = await write({ action: 'room', id: o.id, room, on });
      if (outcomeUnknown(j, x => Array.isArray(x.room))) return markUnsure(o, `Room（${room}）の変更`);
      if (!j.ok) return sayAt(near, j.error || 'Room を変えられませんでした', 'err');
      patch(o, x => { x.room = j.room; });
      navigator.vibrate?.(40);
      sayAt(near, on ? `Room に「${room}」を入れました` : `Room から「${room}」を外しました`, on ? 'ok' : 'warn');
      const cur = current() || o;
      renderRooms(cur); renderOrders();
      // 一覧と同じ工程列（応援先の札）も合わせる
      const strip = $('target').querySelector('.prog'); if (strip) strip.replaceWith(progressStrip(cur, S.mode === 'list' ? S.view : ''));
    });
  }

  // near: 押したボタンのある補助の領域。結果・失敗の理由をそこにも出す（上部の主操作は stepMsg がすぐ下なので無し）
  function chooseStep(s, near) {
    const o = current();
    if (!o) return;
    if (s.variants.length > 1 && $('stepCard').hidden) { selectOrder(o.id); }
    if (s.variants.length === 1) return doComplete(s, s.variants[0], false, near);
    // 抜き・手貼りは種類を選ぶ。工程(自動)から分かるものを目立たせる。種類のボタンは押した領域に出す
    S.pendingStep = s;
    const box = $('variants'); box.textContent = ''; box.hidden = false;
    if (near) near.append(box); else $('primary').after(box);
    for (const v of s.variants) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = v.label; b.dataset.w = '1';
      if (hasTag(o, v.tag)) b.classList.add('rec');
      b.onclick = () => doComplete(s, v, false, near);
      box.append(b);
    }
    applyLocks();
    sayAt(near, `${s.label}の種類を選んでください`);
  }

  async function doComplete(s, v, force, near) {
    const o = current(); if (!o) return;
    if (!force && o.group === '最終' && s.key !== 'finish' &&
        !confirm(`この受注はもう「${o.progIn}」です。\n${v.value} にしてよいですか？`)) return;
    await runOp(o, async () => {
      sayAt(near, '記録しています…');
      const j = await write({ action: 'complete', id: o.id, step: s.key, variant: v.key, force: !!force });
      if (j.conflict) {
        // 他の人が先に記録していた。上書きはせず、最新の状態を見せる（カードを作り直すので、案内の位置まで動かす）
        await refreshCurrent();
        say($('stepMsg'), `${j.error}。取り消すときは「進行と完了記録」の「記録を取り消す」を押してください`, 'warn');
        if (!$('stepCard').hidden) $('stepMsg').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      // 応答が無い・読めない・必要な値が欠けている: 記録できたかどうか分からない。完了扱いにせず、送り直しもしない
      if (outcomeUnknown(j, x => !!x.stamp && !!x.value)) return markUnsure(o, `「${v.value}」の記録`);
      if (!j.ok) return sayAt(near, j.error || '記録できませんでした', 'err');
      patch(o, x => { x.done[s.key] = j.stamp; x.progIn = j.value; if (s.key === 'finish') x.group = '最終'; });
      navigator.vibrate?.([40, 40, 40]);
      const from = detailView(); // 開いていた作業リスト（読み直しの前に控える）
      // ビューの条件で行が消えることがあるので、作業リストは取り直してから戻る。読み直せなくても完了は送り直さない
      const listed = S.mode === 'list' ? await loadView(S.view, true) : null;
      afterComplete(o, j.value, from, listed);
    });
  }
  // 完了を保存できた後の案内（2026-11-03）。一覧を取り直せたか・その受注がまだ一覧にあるかで言い方を分け、一覧の画面の下に残す。
  // listed: true＝読み直せた / false＝読み直しに失敗 / null＝品番・品名で探す（読み直さない）
  function afterComplete(o, value, v, listed) {
    const t = { head: `${o.book} / ${o.wc}　${itemShort(o)}`, lines: [], retry: false };
    if (listed === false) {
      t.lines = [`「${value}」の完了記録は保存済みです`, '一覧の更新に失敗しました（完了は送り直しません）。「一覧だけ読み直す」で一覧を更新してください',
        '残りの工程は、一覧を読み直してから確かめてください'];
      t.retry = true;
      return backToRow(o.id, `${value} を記録しました`, 'warn', t);
    }
    const fresh = listed ? S.orders.find(x => x.id === o.id) : null;
    const g = nextGuide(fresh || o, listed ? v : null);
    t.lines = [`「${value}」を記録しました`, (listed && !fresh ? '保存した内容から見た候補: ' : '') + g.text];
    if (g.next) t.lines.push(g.next);
    backToRow(o.id, `${value} を記録しました`, 'ok', t);
  }
  let toastGen = 0; // 案内を出す・消すたびに進める。読み直しを待つ間に消えた案内を戻さない
  function showToast(t, cls) {
    toastGen++;
    const box = $('toast'); box.className = 'toast ' + (cls || 'ok');
    const tx = $('toastText'); tx.textContent = '';
    const h = document.createElement('b'); h.textContent = t.head; tx.append(h);
    for (const line of t.lines) { const d = document.createElement('span'); d.textContent = line; tx.append(d); }
    $('toastRetry').hidden = !t.retry;
    box.hidden = false; document.body.classList.add('has-toast');
    S.toast = t;
    fitToast();
  }
  function hideToast() { toastGen++; $('toast').hidden = true; document.body.classList.remove('has-toast'); S.toast = null; }
  // 案内の高さぶん一覧の下に余白を取り、最後の行やフォーカスが案内に隠れないようにする（品名・文字の大きさで高さが変わる）
  function fitToast() {
    if ($('toast').hidden) return;
    document.documentElement.style.setProperty('--toasth', ($('toast').offsetHeight + 16) + 'px');
  }
  if (window.ResizeObserver) new ResizeObserver(fitToast).observe($('toast'));
  $('toastClose').onclick = hideToast;
  // 一覧だけを読み直す（完了は送り直さない）
  $('toastRetry').onclick = async () => {
    if (busyNow()) return;
    const t = S.toast; if (!t) return;
    const gen = toastGen;
    $('toastRetry').disabled = true;
    const ok = await loadView(S.view, true);
    $('toastRetry').disabled = false;
    // 待つ間に閉じた・受注を開いた・リストを変えた・探した なら、成功でも失敗でも案内には触れない
    if (gen !== toastGen || S.toast !== t || S.mode !== 'list') return;
    if (!ok) return showToast({ ...t, lines: [t.lines[0], 'まだ一覧を読み込めません。電波を確かめてもう一度押してください'] }, 'warn');
    hideToast();
    say($('listMsg'), '一覧を更新しました', 'ok');
  };

  async function cancelStep(s, done) {
    const o = current(); if (!o) return;
    if (!confirm(`「${s.label}」${done ? `の記録（${done}）` : ''}を取り消しますか？\n進行社内は、この工程を記録する前の状態に戻します。`)) return;
    await runOp(o, async () => {
      const near = (s.group === 'status' ? $('stepsStatus') : $('stepsDone')).parentNode;
      sayAt(near, '取り消しています…');
      const j = await write({ action: 'cancel', id: o.id, step: s.key });
      if (outcomeUnknown(j, x => typeof x.progIn === 'string')) return markUnsure(o, `「${s.label}」の取り消し`);
      if (!j.ok) {
        if (j.stale) await refreshCurrent();
        sayAt(current() ? near : null, j.error || '取り消せませんでした', 'err');
        return;
      }
      patch(o, x => { delete x.done[s.key]; x.progIn = j.progIn; if (x.group === '最終' && x.progIn !== '仕上がりました') x.group = ''; });
      if (S.mode === 'list') await loadView(S.view, true);
      backToRow(o.id, `「${s.label}」を取り消しました（進行社内: ${o.progIn || '空白'}）`, 'warn');
    });
  }

  // 工程カードを閉じて、押した受注の行まで戻り、その行を一瞬光らせる
  // toast: 完了の結果。渡されたときは本文の案内ではなく画面の下の案内に出す（同じ内容を2か所で読み上げさせない）
  function backToRow(id, text, cls, toast) {
    $('stepCard').hidden = true; $('variants').hidden = true; S.sel = id;
    renderOrders();
    const msgEl = S.mode === 'list' ? $('listMsg') : $('findMsg');
    const row = document.querySelector(`.order[data-id="${id}"]`);
    if (!row) {
      // 一覧にはあるが絞り込みで隠れた（着手可 → 自工程済 になった等）のか、ビューの条件で一覧から消えたのかを分けて言う
      const fl = FILTERS.find(x => x[0] === S.filter)?.[1];
      const why = S.mode === 'list' && S.filter !== 'all' && S.orders.some(x => x.id === id)
        ? `この受注は「${fl}」の絞り込みから外れました。「すべて」で表示できます` : 'この受注は一覧から外れました';
      S.sel = null; renderOrders();
      if (toast) showToast({ ...toast, lines: [...toast.lines, why] }, cls); else say(msgEl, `${text}（${why}）`, cls);
      // 行が無いので、一覧の見出し（作業リスト）か検索の欄から Tab を続ける
      (S.mode === 'list' ? $('listHead') : $('ik1')).focus({ preventScroll: true });
      return;
    }
    if (toast) showToast(toast, cls); else say(msgEl, text, cls);
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.focus({ preventScroll: true }); // Tab はこの行から続ける
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  }

  // 一覧を取り直し、選んでいた受注がまだあれば選び直す
  async function refreshCurrent() {
    const id = S.sel;
    if (S.mode === 'list') await loadView(S.view, true); else await (S.findBy === 'item' ? itemSearch(S.findKeys) : search({ archived: S.findArch }));
    if (id && S.orders.some(x => x.id === id)) selectOrder(id); else { $('stepCard').hidden = true; S.sel = null; }
  }

  // URLで品番を渡されたら（?book=Ta&wc=230）すぐ探す
  const q = new URLSearchParams(location.search);
  // ?view=omamori のように作業リストを直接開ける（ホーム画面のショートカット用）
  if (q.get('view')) { store.set('process.view', q.get('view')); store.set('process.mode', 'list'); }
  if (q.get('mode') === 'new') setMode('new');
  else if (q.get('book') && q.get('wc')) { setBook(q.get('book')); $('wc').value = q.get('wc'); setMode('find'); search(); }
  else setMode(['find', 'new'].includes(store.get('process.mode')) ? store.get('process.mode') : 'list');
})();
</script>
</body>
</html>
