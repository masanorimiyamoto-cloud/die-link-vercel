    '福祉': '福祉' }; // 工程(自動) の対応表と同じ（2026-10-23 #福祉 を追加）
  // fromItem: 品名の #タグから読めた部屋（作業順）。all: それに 品名から読めなかった 工程(自動) のタグを後ろに足したもの（= itemTags）
  function itemTagInfo(o) {
    const kotei = String(o.kotei || '').split('|').filter(Boolean);
    const fromItem = [...new Set(String(o.item || '').normalize('NFKC').split('#').slice(1)
      .map(t => ITEM_TAG[t.trim().split(/\s/)[0].toLowerCase()]).filter(t => t && kotei.includes(t)))];
    return { fromItem, all: [...new Set([...fromItem, ...kotei])] };
  }
  function itemTags(o) { return itemTagInfo(o).all; }
  /* ---------- 止まっている受注（2026-11-08） ---------- */
  // まだ仕上がっていない受注のうち、次のどれかに当たるもの（忘れられている・遅れそうな受注を見つける）。
  // ・納期を過ぎている
  // ・納期まで STALL_NEAR 日以内で、最後の動きから STALL_IDLE 営業日以上 何も記録されていない（動きが分からないものも含める）
  // ・納期に関係なく、最後の動きから STALL_LONG 営業日以上 何も記録されていない
  // 工程表の無い Yo の受注は出さない
  // 最後の動きは latestChanges（工程の記録・数量／納期の変更・工程表の印刷のうち一番新しいもの）。営業日は土日と ROSEN_HOLIDAYS を除く
  const STALL_IDLE = 3, STALL_NEAR = 7, STALL_LONG = 10;
  function workdaysSince(t) {
    const d = new Date(new Date(t + 9 * 3600000).toISOString().slice(0, 10) + 'T00:00:00Z');
    const end = todayJST();
    let n = 0;
    for (d.setUTCDate(d.getUTCDate() + 1); d.toISOString().slice(0, 10) <= end; d.setUTCDate(d.getUTCDate() + 1)) {
      if (d.getUTCDay() !== 0 && d.getUTCDay() !== 6 && !ROSEN_HOLIDAYS.has(d.toISOString().slice(5, 10))) n++;
    }
    return n;
  }
  function stalledInfo(o) {
    if (o.closed || o.archived || o.group === '最終' || o.done?.finish || !o.ndate) return null;
    if (SHIPPED_OUT.has(o.progOut) || o.progOut === '受領伝票発行可能') return null;
    // Yo は工程表を出さずに作る受注が多く、毎回「動きの記録なし」で並んでしまうので、工程表の無い Yo は出さない（2026-11-08 ユーザー指定）
    if (o.book === 'Yo' && !o.printedAt) return null;
    const due = daysFromToday(o.ndate);
    const lc = latestChanges(o);
    const idle = lc ? workdaysSince(lc.t) : null;
    const stalled = due < 0 || (due <= STALL_NEAR && (idle == null || idle >= STALL_IDLE)) || (idle != null && idle >= STALL_LONG);
    if (!stalled) return null;
    const todo = todoRooms(o);
    const text = due < 0 ? `納期を${-due}日過ぎ` : due === 0 ? '納期は今日' : `納期まで${due}日`;
    const sub = (idle == null ? '動きの記録なし' : idle === 0 ? '今日動きあり' : `${idle}営業日 動きなし`) + (todo.length ? ` ・次 ${todo[0]}` : '');
    const title = (lc ? `最後の動き ${fmtChange(lc.t)}` : '工程の記録・工程表の印刷がありません') + (todo.length ? `／残りの工程: ${todo.join(' → ')}` : '');
    return { due, idle, text, sub, title };
  }
  function todoRooms(o) {
    if (o.closed || o.group === '最終' || o.done.finish) return [];
    return itemTags(o).filter(tag => !tagDone(o, tag)).map(tag => S.rooms.find(r => r.tag === tag)?.name || tag);
  }
  function flowRow(name, cls, items, cur, todo = []) {
    const row = document.createElement('div'); row.className = 'flow ' + cls;
    const h = document.createElement('span'); h.className = 'fl'; h.textContent = name; row.append(h);
    if (!items.length && !todo.length) { const n = document.createElement('span'); n.className = 'fnone'; n.textContent = '—'; row.append(n); return row; }
    items.forEach((it, i) => {
      if (i) { const a = document.createElement('span'); a.className = 'farr'; a.textContent = '→'; row.append(a); }
      const b = document.createElement('span'); b.className = 'fs ' + (i === cur ? 'now' : 'past') + (it.alert ? ' alert' : '') + (it.arrived ? ' arrived' : '');
      b.append((it.arrived ? '✓ ' : '') + it.label);
      if (it.sub) { const s = document.createElement('small'); s.textContent = it.sub; b.append(s); }
      if (it.chg) { b.classList.add('chg-on'); b.append(chgMark(it.chg, 'chgt')); }
      row.append(b);
    });
    // まだの工程は点線の枠で暗く出す。タグの並びが実際の作業順なので → でつなぐ（→ Nao → 機械貼）
    todo.forEach((name, i) => {
      if (items.length || i) { const a = document.createElement('span'); a.className = 'farr todo'; a.textContent = '→'; row.append(a); }
      const b = document.createElement('span'); b.className = 'fs todo'; b.title = 'この先の工程（未完了）';
      b.textContent = name;
      row.append(b);
    });
    return row;
  }

  function progressStrip(o, view = '') {
    const box = document.createElement('div'); box.className = 'prog';
    const out = outFlow(o.progOut);
    // シート・機械貼材料の手配・入荷のときだけ、紙入荷日をさりげなく添える（先の日付は「予定」）
    // 機械貼材料の入荷日も 紙入荷日 に入れる（以前は連絡事項のメモに書いていた。2026-10-22）。
    // 進行社外に機械貼材料の「手配済み」は無いので、機械貼の作業リストでは進行社外が空でも「機械貼材料 ○/○予定」と出す
    // 2026-10-22 支給シートは シート手配済み を選ばないので、進行社外が空でも「シート入荷 ○/○予定」を出す。
    // 材料の段階（手配必要・手配済み・入荷済・機械貼材料）ならその札に添え、流れの外の知らせ（納期変更など）なら前に置く。
    // 伝票・納品の段階を過ぎたら材料は出さない（上の決まりと同じ）
    // 2026-10-23 予定日だけで「入荷した」とは見せない。入荷確認済み（緑）は進行社外が入荷済のときだけ。
    // 予定日が今日・過ぎたのに入荷済になっていないものは、黄土色のまま「確認待ち」「要確認」と出す。
    // 在庫シート利用は新しく入荷したものではないので、紙入荷日は添えない（緑の「在庫シート利用」だけ）
    const pn = paperNote(o);
    if (pn && o.progOut !== '在庫シート利用') {
      if (OUT_ARRIVED.includes(o.progOut)) out[out.length - 1].sub = pn.day;
      else if (OUT_MAT.includes(o.progOut)) out[out.length - 1].sub = pn.text;
      else if (!o.progOut) out.push({ label: view === 'kikai' ? '機械貼材料' : 'シート入荷', sub: pn.text });
      else if (!OUT_SLIP.includes(o.progOut) && !OUT_END.includes(o.progOut)) out.unshift({ label: 'シート入荷', sub: pn.text });
    }
    // 入荷確認済み・在庫シート利用は、社外の今の札を緑にする
    if (out.length && [...OUT_ARRIVED, '在庫シート利用'].includes(out[out.length - 1].label)) out[out.length - 1].arrived = true;
    const ins = inFlow(o);
    // 最新の記録の工程札に「更新」の印を付ける（工程の並び・今の位置は変えない）
    const lc = latestChanges(o);
    if (lc) ins.items.forEach(it => { if (it.key && lc.keys.has(it.key)) it.chg = lc; });
    box.append(flowRow('社外', 'out', out, out.length - 1), flowRow('社内', 'in', ins.items, ins.cur, todoRooms(o)));
    const tags = document.createElement('div'); tags.className = 'tags';
    // 抜型状況。仕舞い完了があるのに「型まだ仕舞済でない」が残っていたら、古い方は出さない
    const DIE_CLASS = { '抜型照合済': 'd-check', '抜型を棚に仕舞い完了': 'd-stored', '型まだ仕舞済でない': 'd-notyet', '今回新型': 'd-new', '型修正あり': 'd-fix' };
    const die = (o.die || []).filter(v => !(v === '型まだ仕舞済でない' && o.die.includes('抜型を棚に仕舞い完了')));
    for (const v of die) {
      const c = document.createElement('span'); c.className = 'pc die ' + (DIE_CLASS[v] || ''); c.textContent = v; tags.append(c);
    }
    // Room に入っている部屋のうち、普段の部屋（品名タグ）以外＝応援先を出す
    for (const r of (o.room || []).filter(r => !hasTag(o, roomTag(r)))) {
      const c = document.createElement('span'); c.className = 'pc room';
      c.style.setProperty('--rc', roomColor(r)); c.textContent = '応援 ' + r; tags.append(c);
    }
    if (tags.childNodes.length) box.append(tags);
    return box;
  }
  /* ---------- 探す（型の場所）へ ---------- */

  /* ---------- 仕上がり数量の変更 ---------- */
  function amountEditor(o) {
    const box = document.createElement('div'); box.className = 'amt';
    if (o.amountLocked) {
      const n = document.createElement('span'); n.className = 'note';
      n.textContent = '受領伝票の発行後なので、数量・納期はここでは変えられません（伝票の照合で訂正）';
      box.append(n); return box;
    }
    const open = document.createElement('button'); open.type = 'button'; open.className = 'amtbtn qty'; open.textContent = '仕上がり数量を変える';
    open.dataset.w = '1';
    box.append(open);
    if (o.amountLog) { const n = document.createElement('span'); n.className = 'note'; n.textContent = '最後の変更: ' + o.amountLog; box.append(n); }
    open.onclick = () => {
      box.textContent = '';
      const inp = document.createElement('input'); inp.inputMode = 'numeric'; inp.pattern = '\\d*'; inp.value = o.amount ?? '';
      inp.setAttribute('aria-label', '仕上がり数量');
      const save = document.createElement('button'); save.type = 'button'; save.className = 'btn'; save.textContent = '保存'; save.dataset.w = '1';
      const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'amtbtn'; cancel.textContent = 'やめる';
      box.append(inp, save, cancel);
      applyLocks();
      inp.focus(); inp.select();
      cancel.onclick = () => renderSteps();
      inp.onkeydown = (e) => { if (e.key === 'Enter') save.click(); };
      save.onclick = async () => {
        const v = inp.value.trim().replace(/[,，\s]/g, '');
        if (!/^\d+$/.test(v) || Number(v) <= 0) return sayAt(box, '数量は1以上の整数で入れてください', 'err');
        const cur = Number(o.amount), next = Number(v);
        if (cur === next) return renderSteps();
        // 大きく変わるときは念のため確認（10倍・10分の1はサーバーが弾く）
        if (cur > 0 && (next > cur * 1.5 || next < cur / 1.5) &&
            !confirm(`数量を ${cur.toLocaleString('ja-JP')} → ${next.toLocaleString('ja-JP')} に変えます。よろしいですか？`)) return;
        await runOp(o, async () => {
          sayAt(box, '数量を保存しています…');
          const j = await write({ action: 'amount', id: o.id, amount: next });
          if (outcomeUnknown(j, x => Number.isFinite(x.amount))) return markUnsure(o, '数量の変更');
          if (!j.ok) return sayAt(box, j.error || '変えられませんでした', 'err');
          patch(o, x => { if (!x.amountFrom) x.amountFrom = String(cur); x.amount = j.amount; x.amountLog = j.line || x.amountLog; });
          say($('stepMsg'), `仕上がり数量を ${cur.toLocaleString('ja-JP')} → ${next.toLocaleString('ja-JP')} にしました`, 'ok');
          renderSteps(); renderOrders();
        });
      };
    };
    return box;
  }

  /* ---------- 納期の変更 ---------- */
  // 数量と同じく、伝票発行後は変えられない（発行後は数量の欄に案内が出るのでここは何も出さない）
  function ndateEditor(o) {
    const box = document.createElement('div'); box.className = 'amt';
    if (o.amountLocked) return box;
    const open = document.createElement('button'); open.type = 'button'; open.className = 'amtbtn date'; open.textContent = '納期を変える';
    open.dataset.w = '1';
    box.append(open);
    if (o.ndateLog) { const n = document.createElement('span'); n.className = 'note'; n.textContent = '最後の変更: ' + o.ndateLog; box.append(n); }
    open.onclick = () => {
      box.textContent = '';
      const inp = document.createElement('input'); inp.type = 'date'; inp.value = o.ndate || '';
      inp.setAttribute('aria-label', '納期');
      const save = document.createElement('button'); save.type = 'button'; save.className = 'btn'; save.textContent = '保存'; save.dataset.w = '1';
      const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'amtbtn'; cancel.textContent = 'やめる';
      box.append(inp, save, cancel);
      applyLocks();
      inp.focus();
      cancel.onclick = () => renderSteps();
      save.onclick = async () => {
        const next = inp.value;
        if (!/^\d{4}-\d\d-\d\d$/.test(next)) return sayAt(box, '納期の日付を選んでください', 'err');
        if (next === o.ndate) return renderSteps();
        const [y, m, d] = next.split('-').map(Number);
        const label = `${m}/${d}(${WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`;
        // 過ぎた日にするのは打ち間違いのことが多いので確認する
        if (daysFromToday(next) < 0 && !confirm(`納期を過ぎた日（${label}）にします。よろしいですか？`)) return;
        await runOp(o, async () => {
          sayAt(box, '納期を保存しています…');
          const j = await write({ action: 'ndate', id: o.id, ndate: next });
          if (outcomeUnknown(j, x => /^\d{4}-\d\d-\d\d$/.test(String(x.ndate || '')))) return markUnsure(o, '納期の変更');
          if (!j.ok) return sayAt(box, j.error || '変えられませんでした', 'err');
          const before = o.ndate ? fmtDate(o.ndate) : '空白';
          patch(o, x => { if (!x.ndateFrom) x.ndateFrom = x.ndate || '空白'; x.ndate = j.ndate; x.ndateLog = j.line || x.ndateLog; });
          say($('stepMsg'), `納期を ${before} → ${label} にしました`, 'ok');
          renderSteps(); renderOrders();
        });
      };
    };
    return box;
  }

  /* ---------- 紙入荷日（2026-10-29） ---------- */
  // シート（自社手配・先方支給）と機械貼材料の入荷日を兼ねる。空にして消すこともできる。伝票発行後は出さない
  function paperEditor(o) {
    const box = document.createElement('div'); box.className = 'amt';
    if (o.amountLocked) return box;
    const open = document.createElement('button'); open.type = 'button'; open.className = 'amtbtn date';
    open.textContent = o.paper ? `紙入荷日 ${fmtDate(o.paper)} を変える` : '紙入荷日を入れる';
    open.dataset.w = '1';
    const n = document.createElement('span'); n.className = 'note'; n.textContent = 'シート（自社手配・先方支給）・機械貼材料の入荷日';
    box.append(open, n);
    open.onclick = () => {
      box.textContent = '';
      const inp = document.createElement('input'); inp.type = 'date'; inp.value = o.paper || '';
      inp.setAttribute('aria-label', '紙入荷日');
      const save = document.createElement('button'); save.type = 'button'; save.className = 'btn'; save.textContent = '保存'; save.dataset.w = '1';
      const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'amtbtn'; cancel.textContent = 'やめる';
      box.append(inp, save, cancel);
      if (o.paper) {
        const clear = document.createElement('button'); clear.type = 'button'; clear.className = 'amtbtn'; clear.textContent = '消す'; clear.dataset.w = '1';
        clear.onclick = () => { if (confirm('紙入荷日を消しますか？')) send(''); };
        box.append(clear);
      }
      applyLocks();
      inp.focus();
      cancel.onclick = () => renderSteps();
      save.onclick = () => {
        if (!/^\d{4}-\d\d-\d\d$/.test(inp.value)) return sayAt(box, '紙入荷日の日付を選んでください', 'err');
        send(inp.value);
      };
      async function send(next) {
        if (next === (o.paper || '')) return renderSteps();
        await runOp(o, async () => {
          sayAt(box, '紙入荷日を保存しています…');
          const j = await write({ action: 'paper', id: o.id, paper: next });
          if (outcomeUnknown(j, x => typeof x.paper === 'string')) return markUnsure(o, '紙入荷日の変更');
          if (!j.ok) return sayAt(box, j.error || '変えられませんでした', 'err');
          const before = o.paper ? fmtDate(o.paper) : '空白';
          patch(o, x => { x.paper = j.paper; });
          say($('stepMsg'), `紙入荷日を ${before} → ${o.paper ? fmtDate(o.paper) : '空白'} にしました`, 'ok');
          renderSteps(); renderOrders();
        });
      }
    };
    return box;
  }

  /* ---------- 画像 ---------- */
  // Airtable の画像URLは数時間で切れる。切れていたら一覧を取り直すよう案内する
  function imgFail(img) {
    img.onerror = null; img.removeAttribute('src'); img.alt = '期限切れ'; img.title = '更新ボタンで再表示できます';
    img.style.background = '#334155';
  }
  function thumbOf(o) {
    const list = (o.images || []).filter(a => a.thumb);
    if (!list.length) return null;
    const box = document.createElement('span'); box.className = 'thumb';
    const img = document.createElement('img'); img.loading = 'lazy'; img.alt = '画像'; img.src = list[0].thumb;
    img.onerror = () => imgFail(img);
    box.append(img);
    if (list.length > 1) { const n = document.createElement('span'); n.className = 'n'; n.textContent = '+' + (list.length - 1); box.append(n); }
    // 行のボタンの中だが、画像を押したときは行の選択ではなく全画面表示にする
    // 自動の読み直しで行を作り直さなかったときも、最新の一覧の URL で開く（古い URL は数時間で切れる）
    box.addEventListener('click', (e) => {
      e.stopPropagation();
      const cur = S.orders.find(x => x.id === o.id) || o;
      openViewer((cur.images || []).filter(a => a.thumb), 0);
    });
    return box;
  }
  function renderStepImages(o) {
    const box = $('stepImgs'); box.textContent = '';
    box.parentNode.querySelectorAll('.imgnote').forEach(e => e.remove());
    const list = (o.images || []).filter(a => a.thumb);
    list.forEach((a, i) => {
      const img = document.createElement('img'); img.src = a.thumb; img.alt = a.name || '画像';
      img.onerror = () => imgFail(img);
      img.onclick = () => openViewer(list, i);
      box.append(img);
    });
    if (list.length > 1) {
      const n = document.createElement('div'); n.className = 'imgnote';
      n.textContent = `画像が${list.length}枚あります（横にずらすと次の画像）`;
      box.before(n); box.dataset.note = 1;
    }
  }
  let viewerList = [], viewerIdx = 0;
  function openViewer(list, i) {
    viewerList = list; viewerIdx = i; showViewer();
    $('viewer').hidden = false; document.body.style.overflow = 'hidden';
  }
  function showViewer() {
    const a = viewerList[viewerIdx]; if (!a) return;
    $('vimg').classList.remove('zoom');
    const pic = $('vpic'); pic.src = a.full; pic.onerror = () => imgFail(pic);
    $('vname').textContent = (a.name || '') + (viewerList.length > 1 ? `（${viewerIdx + 1}/${viewerList.length}）` : '');
    $('vopen').href = a.full;
  }
  function closeViewer() { $('viewer').hidden = true; document.body.style.overflow = ''; $('vpic').removeAttribute('src'); }
  $('vclose').onclick = closeViewer;
  // 画像を押すと原寸⇔画面に合わせる を切り替え。複数あるときは左右の端を押すと前後へ
  $('vimg').onclick = (e) => {
    const r = $('vimg').getBoundingClientRect(); const x = (e.clientX - r.left) / r.width;
    if (viewerList.length > 1 && (x < 0.15 || x > 0.85)) {
      viewerIdx = (viewerIdx + (x < 0.15 ? -1 : 1) + viewerList.length) % viewerList.length; showViewer(); return;
    }
    $('vimg').classList.toggle('zoom');
  };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('viewer').hidden) closeViewer(); });

  // 一覧の品名は # 以降（工程・配送のタグ）を外す。工程は下の流れで分かる。1件を開いた画面では元の品名のまま
  const itemShort = (o) => String(o.item || '').replace(/\s*[#＃].*$/s, '').trim() || o.item || '(品名なし)';

  function memoLine(o) {
    if (!o.memo) return null;
    const m = document.createElement('div'); m.className = 'memo'; m.textContent = '連絡: ' + o.memo; return m;
  }

  function renderOrders() {
    if (S.mode === 'list') return renderList();
    updateNav();
    const box = $('orders'); box.textContent = '';
    for (const o of S.orders) {
      const el = document.createElement('button'); el.type = 'button';
      el.className = 'order' + (o.closed ? ' closed' : '') + (S.sel === o.id ? ' sel' : '');
      const it = document.createElement('div'); it.className = 'item'; it.textContent = itemShort(o);
      const mt = document.createElement('div'); mt.className = 'meta';
      mt.textContent = `${o.book} / ${o.wc}`; // 進行は下の流れに出す
      const info = document.createElement('div'); info.className = 'info';
      if (S.sel === o.id) { const s = document.createElement('span'); s.className = 'selmark'; s.textContent = '選択中'; s.style.alignSelf = 'flex-start'; info.append(s); }
      if (o.archived) { const s = document.createElement('span'); s.className = 'archmark'; s.textContent = 'アーカイブ済'; info.append(s); }
      if (S.newIds.has(o.id)) { const s = document.createElement('span'); s.className = 'newmark'; s.textContent = '＋ 今作成した受注'; info.prepend(s); el.classList.add('neworow'); }
      info.append(it, facts(o), mt, progressStrip(o));

  /* ---------- 新規入力: 過去の受注カードを開かず、品目から数量・納期へ ---------- */
  let entryGen = 0;
  const entryKey = (o) => JSON.stringify([o.book, String(o.wc), o.spec?.kname || '', o.deli || '']);
  const entryHistoryKey = 'process.newRecent.' + (me.id || me.no || me.name);
  function entryHistory() {
    try {
      const list = JSON.parse(store.get(entryHistoryKey) || '[]');
      return Array.isArray(list) ? list.filter(o => o && /^rec[A-Za-z0-9]{14}$/.test(o.id) && o.book && o.wc != null).slice(0, 12) : [];
    } catch { return []; }
  }
  function rememberEntry(o) {
    const snapshot = { id: o.id, book: o.book, wc: o.wc, item: o.item, spec: { kname: o.spec?.kname || '' }, deli: o.deli || '' };
    store.set(entryHistoryKey, JSON.stringify([snapshot, ...entryHistory().filter(x => entryKey(x) !== entryKey(o))].slice(0, 12)));
  }
  function entryChoice(o) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'choice';
    const title = document.createElement('b'); title.textContent = itemShort(o);
    const code = document.createElement('span'); code.textContent = `${o.book} / ${o.wc}　${o.spec?.kname || '顧客名なし'}`;
    b.append(title, code);
    if (o.deli) { const line = document.createElement('span'); line.textContent = '納品先: ' + o.deli; b.append(line); }
    b.onclick = () => selectEntry(o.id);
    return b;
  }
  function renderEntryHistory() {
    const list = entryHistory(); $('entryRecentSection').hidden = !list.length;
    const box = $('entryRecent'); box.textContent = '';
    for (const o of list) box.append(entryChoice(o));
  }
  function openOrderEntry() {
    S.orders = []; S.sel = null;
    $('entrySelected').hidden = true; $('entryForm').hidden = true;
    $('entrySearchArea').hidden = false;
    $('entryResults').textContent = ''; $('entryResultLabel').hidden = true;
    renderEntryHistory();
    say($('entryMsg'), 'コード・品名・顧客名で探すか、最近登録した品目を選んでください');
    loadEntryHistory(entryGen);
  }
  async function loadEntryHistory(gen) {
    const j = await api({ action: 'orderTemplates', recent: true });
    if (gen !== entryGen || S.mode !== 'new' || !j.ok || !Array.isArray(j.templates)) return;
    const unique = new Map();
    for (const o of [...j.templates, ...entryHistory()]) if (!unique.has(entryKey(o))) unique.set(entryKey(o), o);
    // 履歴の控えには品目の表示に必要な値だけ残す。工程記録や図面は保存しない。
    const list = [...unique.values()].slice(0, 12).map(o => ({ id: o.id, book: o.book, wc: o.wc, item: o.item, spec: { kname: o.spec?.kname || '' }, deli: o.deli || '' }));
    store.set(entryHistoryKey, JSON.stringify(list)); renderEntryHistory();
  }
  async function searchEntry() {
    if (busyNow()) return;
    const gen = ++entryGen;
    const query = $('entryQuery').value.trim(), book = $('entryBook').value;
    $('entryQuery').blur();
    $('entryForm').hidden = true; $('entrySelected').hidden = true; S.sel = null;
    $('entryResults').textContent = ''; $('entryResultLabel').hidden = true;
    say($('entryMsg'), '品目を探しています…');
    const j = await api({ action: 'orderTemplates', query, book });
    if (gen !== entryGen || S.mode !== 'new') return;
    if (!j.ok || !Array.isArray(j.templates)) return say($('entryMsg'), j.error || '品目を読めませんでした。もう一度探してください', 'err');
    for (const o of j.templates) $('entryResults').append(entryChoice(o));
    $('entryResultLabel').hidden = !j.templates.length;
    say($('entryMsg'), j.templates.length ? `${j.templates.length}品目。選ぶと数量・納期を入力できます。` +
      (j.more ? '候補が多いため一部を表示しています。顧客名や品名を足して絞れます' : '') : '品目が見つかりません。コード・品名・顧客名を変えて探してください', j.more ? 'warn' : '');
  }
  async function selectEntry(id) {
    if (busyNow()) return;
    const gen = ++entryGen;
    $('entryForm').hidden = true; $('entrySelected').hidden = true; S.sel = null;
    $('entrySearchArea').hidden = false;
    say($('entryMsg'), '品目を確認しています…');
    const j = await api({ action: 'orderTemplates', id });
    if (gen !== entryGen || S.mode !== 'new') return;
    const o = j.templates?.[0];
    if (!j.ok || !o || o.id !== id) return say($('entryMsg'), j.error || '品目を確認できません。もう一度探してください', 'err');
    S.orders = [o]; S.sel = o.id;
    const box = $('entrySelected'); box.textContent = ''; box.hidden = false;
    const name = document.createElement('b'); name.textContent = itemShort(o);
    const customer = document.createElement('span'); customer.textContent = `${o.book} / ${o.wc}　顧客: ${o.spec?.kname || '顧客名なし'}`;
    box.append(name, customer);
    if (o.deli) { const d = document.createElement('span'); d.textContent = '納品先: ' + o.deli; box.append(d); }
    $('entryRecentSection').hidden = true; $('entryResults').textContent = ''; $('entryResultLabel').hidden = true;
    $('entrySearchArea').hidden = true;
    $('entryForm').hidden = false; say($('entryMsg'), '数量と納期を入力してください');
    renderNewOrder(o, {
      box: $('entryForm'), expanded: true,
      onCancel: () => { entryGen++; openOrderEntry(); },
      onCreated: (no, text) => {
        openOrderEntry();
        say($('entryMsg'), text + '。続けて別の品目も登録できます', 'ok');
      },
    });
    scrollToCard($('entrySelected'));
  }
  $('entrySearch').onclick = searchEntry;
  $('entryQuery').addEventListener('keydown', e => { if (e.key === 'Enter') searchEntry(); });

  /* ---------- タブ ---------- */
  function setMode(m) {
    hideToast();
    S.mode = m; store.set('process.mode', m);
    // 読み込み途中の一覧の応答は、切り替えた後の画面には使わない
    listGen++; listBusy = 0;
    findGen++; entryGen++;
    $('tabList').classList.toggle('on', m === 'list'); $('tabFind').classList.toggle('on', m === 'find');
    $('tabList').setAttribute('aria-selected', String(m === 'list')); $('tabFind').setAttribute('aria-selected', String(m === 'find'));
    $('tabNew').classList.toggle('on', m === 'new'); $('tabNew').setAttribute('aria-selected', String(m === 'new'));
    $('listCard').hidden = m !== 'list'; $('findCard').hidden = m !== 'find';
    $('entryCard').hidden = m !== 'new';
    $('listHead').hidden = m !== 'list';
    $('findHead').hidden = m !== 'find';
    document.body.classList.toggle('has-head', m === 'list' || m === 'find');
    fitHead();
    $('stepCard').hidden = true; S.sel = null; $('variants').hidden = true;
    if (m === 'new') { stopCam(); openOrderEntry(); }
    else if (m === 'list') { stopCam(); loadView(S.view || store.get('process.view') || ''); }
    else { S.orders = []; renderOrders(); say($('findMsg'), ''); }
  }
  $('tabList').onclick = () => { if (!busyNow()) setMode('list'); };
  $('tabFind').onclick = () => { if (!busyNow()) setMode('find'); };
  $('tabNew').onclick = () => { if (!busyNow()) setMode('new'); };

  // 作業リストの自動の読み直し。受注を開いて操作している間・書き込み中・画像を全画面で見ている間は、押す位置や入力がずれないよう読み直さない。
  // 2026-10-23 以前は「行を選んでいる（S.sel）」で止めていたため、記録して一覧に戻った後（行の選択表示は残る）も止まったままだった。
  // 止める条件は「受注のカードを開いている」に変えた（選んだ行の表示とは別）
  const detailOpen = () => !$('stepCard').hidden;
  const canAutoLoad = () => S.mode === 'list' && !detailOpen() && !writing && $('viewer').hidden && !document.hidden;
  // スリープや別のアプリから戻ったら読み直す（2026-10-14）。サーバーの20秒の使い回しに乗せて、スマホで待たないようにする（2026-10-20）
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (!hiddenAt || Date.now() - hiddenAt < 5000) return; // 一瞬の切り替えでは読まない
    hiddenAt = 0;
    if (canAutoLoad()) loadView(S.view, false, true);
  });
  // 開いたままでも3分ごとに読み直す（2026-10-15）。サーバーの20秒の使い回しに乗せるので、何台で開いても Airtable の回数制限にかからない
  setInterval(() => { if (canAutoLoad()) loadView(S.view, false, true); }, 3 * 60 * 1000);

  /* ---------- 作業リスト ---------- */
  // 一覧の中身の比較用。画像の URL は取るたびに署名が変わるので、ファイル名だけで比べる
  const rowsSig = rows => JSON.stringify(rows.map(o => ({ ...o, images: (o.images || []).map(a => a.name) })));
  let shownSig = '';
  // quiet: 自動の読み直し。「読み込み中…」を出さず、待っている間に受注を開いたりしたら結果を捨てる。
  // 2026-10-23 応答の順番が入れ替わっても古い応答で画面を戻さないよう、読み込みごとに番号を振り、最後に始めたものだけを使う
  // （機械貼→たおし抜き と続けて押してたおし抜きが先に返った、自動の読み直しが手動の更新より後に返った、など）。
  // 手動の読み込み中は自動の読み直しを重ねない。読み取りだけなので、古い要求は結果を捨てるだけで中断はしない。
  // 返り値: 一覧に反映できたら true
  let listGen = 0, listBusy = 0;
  async function loadView(key, refresh, quiet) {
    if (quiet && listBusy) return false;
    const gen = ++listGen;
    if (!quiet) { listBusy = gen; say($('listMsg'), '読み込み中…'); }
    // まず画像なしで一覧を出す（早い）。縮小画像は loadImages で後から足す（2026-10-20）
    const j = await api({ action: 'view', view: key || 'cad', refresh: !!refresh, lite: true });
    if (listBusy === gen) listBusy = 0;
    if (gen !== listGen || S.mode !== 'list') return false; // 後から始めた読み込みがある／品番で探すに切り替えた
    if (quiet && !canAutoLoad()) return false;
    if (!j.ok || !Array.isArray(j.rows) || !Array.isArray(j.views) || !j.views.length) {
      // 読めなかった。前の一覧が出ていれば、それが古いことを見出しに出す（最新のようには見せない）
      S.listFail = true; showFresh();
      const err = j.ok ? '一覧の応答が正しくありません' : (j.error || '読み込めませんでした');
      if (!S.listAt) { say($('listMsg'), `一覧を取得できませんでした（${err}）`, 'err'); S.listMsgErr = true; }
      else if (!quiet) { say($('listMsg'), `${err}。以前の一覧を表示しています`, 'err'); S.listMsgErr = true; }
      $('listRetry').hidden = false;
      return false;
    }
    // ビューを切り替えたら、前のリストの絞り込みは持ち越さない
    if ((j.view || j.views[0].key) !== S.view) { S.filter = 'all'; S.cust = null; S.custOpen = false; }
    S.views = j.views; S.steps = j.steps; S.rooms = j.rooms || []; S.view = j.view || j.views[0].key;
    store.set('process.view', S.view);
    S.orders = j.rows;
    S.listAt = j.cachedAt || Date.now(); S.listFail = false; $('listRetry').hidden = true;
    // 前に取った画像があればすぐ付ける（自動の読み直しで画像が消えないように）
    for (const o of S.orders) o.images = imgById.get(o.id) || [];
    renderChips();
    // 自動の読み直しで中身が変わっていなければ、行も画像も作り直さない（スマホで画像を全部取り直して重くなるため。2026-10-20）
    const sig = rowsSig(j.rows);
    // ただし前の読み込みの失敗の案内が本文に残っていれば、件数の案内に戻す（見出しと本文を食い違わせない）
    if (quiet && sig === shownSig) { showFresh(); if (S.listMsgErr) showListMsg(); loadImages(S.view, true); return true; }
    shownSig = sig;
    renderList();
    updateListHead();
    loadImages(S.view, quiet);
    return true;
  }

  /* ---------- 縮小画像は後から ---------- */
  // 画像の URL は数時間で切れるので、自動の読み直しのときは30分たっていれば取り直す
  const imgById = new Map(); const imgAt = {};
  async function loadImages(key, quiet) {
    if (quiet && imgAt[key] && Date.now() - imgAt[key] < 30 * 60 * 1000) return;
    await new Promise(r => setTimeout(r, 300)); // 一覧の描画を先に終わらせる
    const j = await api({ action: 'viewImages', view: key });
    if (!j.ok || S.view !== key || S.mode !== 'list') return;
    imgAt[key] = Date.now();
    for (const [id, imgs] of Object.entries(j.images || {})) imgById.set(id, imgs);
    for (const o of S.orders) {
      const imgs = j.images?.[o.id]; if (!imgs) continue;
      o.images = imgs;
      // まだ画像の無い行にだけ縮小画像を差し込む（行を作り直さないのでスクロール位置は動かない）
      const el = document.querySelector(`#list .order[data-id="${o.id}"]`);
      const wrap = el && el.querySelector('.orow');
      if (wrap && !wrap.querySelector('.thumb')) { const th = thumbOf(o); if (th) wrap.append(th); }
    }
    // 画像が来る前に受注を開いていたら、工程カードの画像も出す
    const cur = current();
    if (cur && !$('stepCard').hidden && j.images?.[cur.id]) renderStepImages(cur);
  }

  // 見出し「作業リスト（オートン抜き）」と件数。着手可・済の数も添える。絞り込み中は「表示5件／全24件」
  function updateListHead() {
    const v = S.views.find(x => x.key === S.view);
    $('listHeadName').textContent = `作業リスト（${v ? v.label : ''}）`;
    const n = S.orders.length, c = S.counts || {};
    // 止まっている受注は、読んだ受注のうち当てはまった件数を出す（2026-11-08）
    $('listHeadCnt').textContent = !n ? '0件'
      : v?.stalled ? `${S.shown ?? 0}件（未完了${n}件中）`
      : (S.filter !== 'all' || S.cust != null) ? `表示${S.shown ?? n}件／全${n}件`
      : [`${n}件`, c.ready && `着手可${c.ready}`, c.done && `済${c.done}`].filter(Boolean).join('・');
    showFresh();
    fitHead();
  }
  // 一覧の鮮度（2026-10-23）。一覧を画面に反映した時刻だけを出す（画像を取った時刻ではない）。
  // 時刻はサーバーが Airtable を読んだ時刻（最大20秒の使い回しを含む）で、Airtable 側で最後に変わった時刻ではない
  const hhmm = (t) => new Date(t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo' });
  function showFresh() {
    const el = $('listFresh');
    if (S.listFail && S.listAt) { el.textContent = `⚠ 更新失敗・以前の情報を表示中（${hhmm(S.listAt)} の一覧）`; el.className = 'fresh err'; }
    else if (S.listFail) { el.textContent = '⚠ 一覧を取得できませんでした'; el.className = 'fresh err'; }
    else if (S.listAt) { el.textContent = `一覧更新 ${hhmm(S.listAt)}`; el.className = 'fresh'; }
    else { el.textContent = ''; el.className = 'fresh'; }
    fitHead();
  }
  // 見出しを押すと一番上の行へ戻る（見出しの高さぶん下げて、行が隠れないようにする）
  $('listHead').onclick = () => {
    const head = $('listHead');
    const first = $('list').firstElementChild;
    const target = first || $('listCard');
    const sc = scroller();
    if (!first) { sc.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const base = sc === window ? 0 : sc.getBoundingClientRect().top;
    const y = target.getBoundingClientRect().top - base + scrollTopOf(sc) - head.offsetHeight - 8;
    sc.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  };
  // 固定した見出しの高さぶん、本文を下げる（文字の大きさや改行で高さが変わるので毎回測る）
  function fitHead() {
    const h = [$('listHead'), $('findHead')].find(x => x && !x.hidden); if (!h) return;
    document.documentElement.style.setProperty('--headh', h.offsetHeight + 'px');
  }
  window.addEventListener('resize', fitHead);
  // 配色の切替や件数の桁で見出しの高さが変わっても、本文の下げ幅を自動で合わせる（VIVANT で見出しがボタンに重なった）
  if (window.ResizeObserver) { const ro = new ResizeObserver(fitHead); ro.observe($('listHead')); ro.observe($('findHead')); }
  // 作業リストのときは本文（.wrap）が、それ以外はページがスクロールする
  const scroller = () => (document.body.classList.contains('has-head') ? document.querySelector('.wrap') : window);
  const scrollTopOf = (sc) => (sc === window ? window.scrollY : sc.scrollTop);
  // 少しでも下へ動いたら影と「↑ 先頭へ」を出す
  const onScroll = () => {
    const h = $('listHead'); if (!h || $('listCard').hidden) return;
    h.classList.toggle('stuck', scrollTopOf(scroller()) > 8);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  document.querySelector('.wrap').addEventListener('scroll', onScroll, { passive: true });

  function renderChips() {
    const box = $('viewChips'); box.textContent = '';
    for (const v of S.views) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = v.label;
      if (v.key === S.view) b.classList.add('on');
      b.setAttribute('aria-pressed', String(v.key === S.view));
      b.onclick = () => { if (busyNow()) return; hideToast(); S.sel = null; $('stepCard').hidden = true; loadView(v.key); };
      box.append(b);
    }
    const sp = document.createElement('span'); sp.className = 'sp'; box.append(sp);
    const r = document.createElement('button'); r.type = 'button'; r.textContent = '更新';
    // 手で押した更新は、開いている受注のカードも最新にする（自動の読み直しはカードを開いている間は動かない）
    r.onclick = async () => { if (busyNow()) return; if (await loadView(S.view, true)) syncDetail('一覧と開いている受注を最新の状態にしました'); };
    box.append(r);
  }
  $('listRetry').onclick = () => { if (!busyNow()) loadView(S.view || store.get('process.view') || '', true); };

  /* ---------- 表示：簡潔／詳細（2026-11-03） ---------- */
  // 部門別のリスト（自分の工程の決まりがあるもの）だけ。初めは簡潔。選んだ方は端末に覚える（process.view / process.mode とは別のキー）。
  // 全件・Recent・Fax・品番／品名の検索は今までの詳しい表示のまま。切り替えは取得済みの一覧を描き直すだけで、読み直さない
  const DENSITY_KEY = 'process.listDensity';
  S.density = store.get(DENSITY_KEY) === 'detail' ? 'detail' : 'compact';
  function renderDensity(v) {
    const box = $('densChips'); box.textContent = '';
    const on = hasMine(v);
    box.hidden = !on;
    $('list').classList.toggle('compact', on && S.density === 'compact');
    if (!on) return;
    const l = document.createElement('span'); l.className = 'lbl'; l.textContent = '表示:'; box.append(l);
    for (const [k, label] of [['compact', '簡潔'], ['detail', '詳細']]) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      b.setAttribute('aria-pressed', String(S.density === k));
      b.onclick = () => {
        if (S.density === k) return;
        S.density = k; store.set(DENSITY_KEY, k);
        keepTopRow(renderList);
        // 押したボタンは作り直されるので、新しい同じボタンへフォーカスを戻す
        [...$('densChips').querySelectorAll('button')].find(x => x.textContent === label)?.focus();
      };
      box.append(b);
    }
  }
  // 描き直しの前後で、画面の一番上に見えていた行の位置を保つ
  function keepTopRow(fn) {
    const sc = scroller();
    const head = [$('listHead'), $('findHead')].find(x => x && !x.hidden);
    const top = (sc === window ? 0 : sc.getBoundingClientRect().top) + (head ? head.offsetHeight : 0);
    const r = [...$('list').querySelectorAll('.order')].find(el => el.getBoundingClientRect().bottom > top);
    const id = r?.dataset.id, y = r ? r.getBoundingClientRect().top : 0;
    fn();
    const n = id && $('list').querySelector(`.order[data-id="${id}"]`);
    if (n) sc.scrollBy(0, n.getBoundingClientRect().top - y);
  }


  /* ---------- 顧客（Kname）の絞り込み（2026-11-05） ---------- */
  // 「顧客別」を押すと、今のリストにいる顧客を件数の多い順に出す（顧客名なしは最後）。選ぶとその顧客の受注だけにする。
  // 取得済みの一覧を画面の中で絞るだけ（読み直さない）。リストを切り替えたら解除する。Kname が空の受注は「(顧客名なし)」
  // 2026-11-08 顧客で絞るときは必ず全件から（ユーザー指定）。全件以外で「顧客別」を押したら全件を読んでから顧客を出し、
  // 「✕ 解除」で元のリストに戻る。アーカイブ済は顧客の数にも絞った結果にも入れない（古いものは 品番・品名で探す で）
  const custOf = (o) => String(o.spec?.kname || '').trim();
  const custLabel = (k) => k || '(顧客名なし)';
  function renderCust() {
    const box = $('custChips'), list = $('custList');
    box.textContent = ''; list.textContent = '';
    if (!S.orders.length && S.cust == null) { box.hidden = true; list.hidden = true; return; }
    box.hidden = false;
    const l = document.createElement('span'); l.className = 'lbl'; l.textContent = '顧客:'; box.append(l);
    const b = document.createElement('button'); b.type = 'button'; b.id = 'custBtn';
    b.textContent = S.cust == null ? '顧客別（全件から） ▾' : `${custLabel(S.cust)} ▾`;
    b.setAttribute('aria-pressed', String(S.cust != null));
    b.setAttribute('aria-expanded', String(!!S.custOpen));
    b.onclick = async () => {
      if (S.view !== 'all') {
        if (busyNow()) return;
        const back = S.view;
        if (!(await loadView('all'))) return;
        S.custBack = back; S.custOpen = true; renderList(); $('custBtn')?.focus();
        return;
      }
      S.custOpen = !S.custOpen; renderList(); $('custBtn')?.focus();
    };
    box.append(b);
    if (S.cust != null) {
      const x = document.createElement('button'); x.type = 'button'; x.textContent = '✕ 解除';
      x.onclick = () => {
        S.cust = null; S.custOpen = false;
        const back = S.custBack; S.custBack = null;
        if (back && back !== 'all' && !busyNow()) return loadView(back);
        keepTopRow(renderList); $('custBtn')?.focus();
      };
      box.append(x);
    }
    list.hidden = !S.custOpen;
    if (!S.custOpen) return;
    const cnt = new Map();
    for (const o of S.orders) if (!o.archived) cnt.set(custOf(o), (cnt.get(custOf(o)) || 0) + 1);
    const rows = [...cnt].sort((a, b) => (!a[0]) - (!b[0]) || (b[1] - a[1]) || a[0].localeCompare(b[0], 'ja')); // 顧客名なしは件数によらず最後
    const pick = (k) => { S.cust = k; S.custOpen = false; renderList(); $('custBtn')?.focus(); };
    const add = (k, label, n) => {
      const c = document.createElement('button'); c.type = 'button';
      c.append(label); const sm = document.createElement('small'); sm.textContent = n; c.append(sm);
      c.setAttribute('aria-pressed', String(S.cust === k));
      c.onclick = () => pick(k);
      list.append(c);
    };
    add(null, 'すべて', S.orders.length);
    for (const [k, n] of rows) add(k, custLabel(k), n);
  }

  /* ---------- 状態の絞り込み（2026-10-23） ---------- */
  // 取得済みの一覧を画面の中で絞るだけ。並び順は Airtable のビューのまま（着手可順に並べ替えない）
  const FILTERS = [['all', 'すべて'], ['ready', '着手可'], ['wait', '待ち'], ['done', '自工程済']];
  const hasMine = (v) => !!(v && (v.mine || []).length);
  function renderFilter(counts, total) {
    const box = $('filtChips'); box.textContent = '';
    const v = S.views.find(x => x.key === S.view);
    // 自分の工程の決まりが無いリスト（全件・Recent・Fax）では出さず、絞り込みも残さない
    if (!hasMine(v) || !S.orders.length) { box.hidden = true; if (!hasMine(v)) S.filter = 'all'; return; }
    total = total ?? S.orders.length;
    box.hidden = false;
    const l = document.createElement('span'); l.className = 'lbl'; l.textContent = '状態:'; box.append(l);
    for (const [k, label] of FILTERS) {
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = k === 'all' ? `${label} ${total}` : `${label} ${counts[k] || 0}`;
      b.setAttribute('aria-pressed', String(S.filter === k));
      b.onclick = () => { S.filter = k; renderList(); };
      box.append(b);
    }
  }

  // 作業リストでの受注の状態。判定は mineDone（済）と mineReady（着手可）をそのまま使う。
  // 待ちは理由（waitReason）が言えるものだけにし、どれにも当たらなければ「状態未確認」。
  // 自分の工程の決まりが無いリスト・閉じた受注は状態を出さない
  function rowState(o, v) {
    if (v?.stalled) { const si = stalledInfo(o); return si ? { kind: 'stalled', si } : { kind: 'off' }; }
    if (!hasMine(v)) return { kind: '' };
    const md = mineDone(o, v); if (md) return { kind: 'done', md };
    if (o.closed) return { kind: '' };
    const mr = mineReady(o, v); if (mr) return { kind: 'ready', mr };
    const w = waitReason(o, v); if (w) return { kind: 'wait', ...w };
    return { kind: 'unknown' };
  }
  // 着手できない理由（確かな根拠があるときだけ。mineReady が null のときに呼ぶ）。
  // ・品名タグの並びで自分より前の部屋が済んでいない → 一番先に済ませる工程を1つ（残りは札の説明と社内の流れで見える）
  //   ただし、それより後ろの部屋が済んでいるなら記録の付け忘れかもしれないので「前工程の完了記録を確認」
  // ・前に部屋が無く、まだ何の工程も済んでいない → 材料（進行社外・紙入荷日）が分かるときだけ材料待ち
  // 進行社外が空白のシートの要る受注は、作業リストを読んだときにサーバーが シート手配待ち にする（2026-10-29）
  const SHEET_WAIT = 'シート手配待ち';
  const SHEET_TAGS = ['オートン', 'たおしK判', 'たおしM判'];
  const roomLabel = (tag) => S.rooms.find(r => r.tag === tag)?.name || tag;
  function waitReason(o, v) {
    const tags = itemTags(o), mine = viewTags(v);
    const at = tags.findIndex(t => mine.includes(t));
    if (at > 0) {
      const left = tags.slice(0, at).filter(t => !tagDone(o, t));
      if (left.length) {
        const i = tags.indexOf(left[0]);
        const title = '先に済ませる工程: ' + left.map(roomLabel).join(' → ');
        // sub は札の中に小さく出す補足（スマホでは title が見えないので、工程名は札に書く）
        if (tags.slice(i + 1).some(t => tagDone(o, t))) return { text: '前工程の完了記録を確認', sub: left.map(roomLabel).join('・'), title: title + '（後ろの工程は済になっています）' };
        const s = S.steps.find(x => x.variants.some(y => y.tag === left[0]));
        // 先に済ませるのがシートの要る抜き（オートン・たおし）で、進行社外が シート手配待ち なら、抜きより先にシートを待っている。
        // 在庫シート利用・入荷済なら今までどおり「オートン抜き待ち」（2026-10-29 ユーザー指定）
        if (o.progOut === SHEET_WAIT && SHEET_TAGS.includes(left[0])) {
          return { text: SHEET_WAIT, sub: 'その後 ' + left.map(roomLabel).join('・'), title };
        }
        return { text: (s ? s.label.replace(/完了$/, '') : roomLabel(left[0]) + 'の作業') + '待ち',
          sub: left.length > 1 ? 'ほか ' + left.slice(1).map(roomLabel).join('・') : '', title };
      }
    }
    if (!(v.readyOut || []).length || doneSteps(o).some(x => x.s.group !== 'status')) return null;
    if (o.progOut === SHEET_WAIT) return { text: SHEET_WAIT };
    const pn = paperNote(o);
    if (o.progOut === 'シート手配済み' || (!o.progOut && pn)) {
      if (!pn) return { text: '材料の入荷待ち' };
      return { text: pn.diff > 0 ? `材料 ${pn.text}` : '材料の入荷確認待ち', title: '紙入荷日 ' + pn.text };
    }
    return null;
  }
  function stateBadge(st, v) {
    const b = document.createElement('span'); b.className = 'minebadge';
    const sm = document.createElement('small');
    if (st.kind === 'done') {
      // 「CADカット完了 済」のような重複を避け、一覧の名前で出す。仕上がり済で済とみなしたものはそう書く
      b.classList.add('done'); b.append(`✓ ${v.label} 済`);
      if (st.md.who) { sm.textContent = st.md.who; b.append(sm); }
    } else if (st.kind === 'ready') {
      b.classList.add('ready'); b.append('▶ 着手できます');
      sm.textContent = st.mr.label; b.append(sm);
    } else if (st.kind === 'wait') {
      b.classList.add('wait'); b.append('◷ ' + st.text);
      if (st.sub) { sm.textContent = st.sub; b.append(sm); }
      if (st.title) b.title = st.title;
    } else if (st.kind === 'stalled') {
      b.classList.add(st.si.due < 0 ? 'late' : 'wait'); b.append('⏸ ' + st.si.text);
      sm.textContent = st.si.sub; b.append(sm);
      b.title = st.si.title;
    } else if (st.kind === 'unknown') {
      b.classList.add('note'); b.append('状態未確認');
      b.title = '着手できるか・何を待っているかを判断できる記録がありません';
    } else return null;
    return b;
  }

  function renderList() {
    const box = $('list'); box.textContent = '';
    const v = S.views.find(x => x.key === S.view);
    // 顧客で絞ってから状態を数える（状態の件数は選んだ顧客の中の数）
    renderCust();
    const base = S.cust == null ? S.orders : S.orders.filter(o => !o.archived && custOf(o) === S.cust);
    const states = new Map(base.map(o => [o.id, rowState(o, v)]));
    const counts = {};
    for (const st of states.values()) counts[st.kind] = (counts[st.kind] || 0) + 1;
    renderFilter(counts, base.length);
    renderDensity(v);
    // 並びは 緑枠（着手可）→ 無印（待ち・未確認など）→ 青枠（済）。同じ枠の中は納品日順（空は最後）（2026-10-26）
    const band = (o) => ({ ready: 0, done: 2 })[states.get(o.id).kind] ?? 1;
    // keepOrder のリスト（Recent 1day）はビューの並び（最終更新の新しい順）のまま（2026-10-29）
    const shown = (S.filter === 'all' ? base : base.filter(o => states.get(o.id).kind === S.filter)).filter(o => states.get(o.id).kind !== 'off');
    // 全件のアーカイブ済（2026-11-05）は一番後ろに、納期の新しい順
    // 止まっている受注は 納期の近い順（過ぎたものが先）、同じなら動きの無い日数の長い順（2026-11-08）
    if (v?.stalled) shown.sort((a, b) => (states.get(a.id).si.due - states.get(b.id).si.due) || ((states.get(b.id).si.idle ?? 99) - (states.get(a.id).si.idle ?? 99)));
    else if (!v?.keepOrder) shown.sort((a, b) => (!!a.archived - !!b.archived) || (band(a) - band(b))
      || (a.archived ? String(b.ndate || '').localeCompare(String(a.ndate || '')) : String(a.ndate || '9999').localeCompare(String(b.ndate || '9999'))));
    S.counts = counts; S.shown = shown.length;
    for (const o of shown) {
      const st = states.get(o.id);
      const row = document.createElement('div'); row.className = 'lrow';
      const el = document.createElement('button'); el.type = 'button';
      el.className = 'order' + (S.sel === o.id ? ' sel' : '') + (o.archived ? ' closed' : '');
      const it = document.createElement('div'); it.className = 'item'; it.textContent = itemShort(o);
      if (st.kind === 'done') el.classList.add('mine');
      if (st.kind === 'ready') el.classList.add('ready');
      if (st.kind === 'wait') el.classList.add('wait');
      if (st.kind === 'stalled') el.classList.add(st.si.due < 0 ? 'stall-late' : 'wait');
      const mt = document.createElement('div'); mt.className = 'meta';
      mt.textContent = `${o.book} / ${o.wc}`; // 進行は下の流れに出す
      if (o.deli) { const d = document.createElement('span'); d.className = 'deli'; d.textContent = '納品先 ' + o.deli; mt.append(d); }
      const info = document.createElement('div'); info.className = 'info';
      const bd = document.createElement('div'); bd.className = 'badges';
      const sb = stateBadge(st, v); if (sb) bd.append(sb);
      if (S.sel === o.id) { const s = document.createElement('span'); s.className = 'selmark'; s.textContent = '選択中'; bd.append(s); }
      if (o.archived) { const s = document.createElement('span'); s.className = 'archmark'; s.textContent = 'アーカイブ済'; bd.append(s); }
      if (bd.childNodes.length) info.append(bd);
      info.append(it, facts(o), mt, progressStrip(o, S.view));
      const mm = memoLine(o); if (mm) info.append(mm);
      const wrap = document.createElement('div'); wrap.className = 'orow'; wrap.append(info);
      const th = thumbOf(o); if (th) wrap.append(th);
      // カード全体で詳細を開く（中にボタン・リンクは入れない）
      const go = document.createElement('span'); go.className = 'open'; go.textContent = '詳細・工程を記録 →';
      el.append(wrap, go);
      el.dataset.id = o.id;
      el.onclick = () => { if (!busyNow()) selectOrder(o.id); };
      row.append(el);
      box.append(row);
    }
    showListMsg();
    if (S.views.length) updateListHead(); // 済の数が変わったら見出しにも反映
  }
  // 件数の案内。リスト自体が0件と、絞り込みで0件を分けて言う。一覧の読み込み失敗の案内もこれで消える
  function showListMsg() {
    const n = S.orders.length, shown = S.shown ?? n;
    const fl = [S.cust != null && custLabel(S.cust), S.filter !== 'all' && FILTERS.find(x => x[0] === S.filter)?.[1]].filter(Boolean).map(x => `「${x}」`).join('・');
    if (!S.listAt && !n) return;
    S.listMsgErr = false;
    if (!n) say($('listMsg'), 'このリストに作業はありません');
    else if ((S.views || []).find(x => x.key === S.view)?.stalled) {
      say($('listMsg'), shown ? `止まっている受注 ${shown}件（未完了${n}件中）。納期の近い順。札の「動きなし」は最後の工程の記録・数量／納期の変更・工程表の印刷からの営業日`
        : `止まっている受注はありません（未完了${n}件を確認しました）`);
    }
    else if (fl && !shown) say($('listMsg'), `${fl}に当たる受注はありません（全${n}件）`);
    else if (fl) say($('listMsg'), `${fl}で絞り込み中: 表示${shown}件／全${n}件`);
    else say($('listMsg'), `${n}件`);
  }

  // 見ている作業リストの工程（自分の工程）が済んでいるか。済なら { label, who } を返す
  // ・その工程の記録（氏名 日時）がある ・進行社内がその工程の値（旧い名前も含む）
  // ・進行社内グループが「最終」（仕上がった受注は、それより前の自分の工程も済んでいる）
  function mineDone(o, v) {
    if (!v || !(v.mine || []).length) return null;
    for (const k of v.mine) {
      const s = S.steps.find(x => x.key === k); if (!s) continue;
      if (o.done[k]) return { label: s.label, who: shortStamp(o.done[k]) };
      if (s.variants.some(x => x.value === o.progIn)) return { label: s.label, who: '' };
    }
    if ((v.mineValues || []).includes(o.progIn)) return { label: o.progIn, who: '' };
    if (o.group === '最終') return { label: v.label, who: '仕上がり済' };
    return null;
  }
  // 作業リストが受け持つ部屋（工程(自動) のタグ）。完了ボタンのある工程はそのタグ、ボタンの無い部屋はリストのキーから
  const VIEW_TAG = { nao: 'Nao', f2: '2F_小', dansai: '断裁ステッチ', pre: 'プレ' };
  function viewTags(v) {
    const tags = (v.mine || []).flatMap(k => (S.steps.find(s => s.key === k)?.variants || []).map(x => x.tag)).filter(Boolean);
    if (VIEW_TAG[v.key]) tags.push(VIEW_TAG[v.key]);
    return tags;
  }
  // その部屋の工程が済んでいるか。部屋の作業リストの「済」（青枠）と同じ基準で見る（Nao は シール貼完了 など）
  function tagDone(o, tag) {
    const vs = S.views.filter(x => viewTags(x).includes(tag));
    if (vs.length) return vs.some(x => mineDone(o, x));
    const s = S.steps.find(x => x.variants.some(v => v.tag === tag));
    return !!(s && doneSteps(o).some(x => x.s.key === s.key));
  }
  // 自分の工程はまだだが、もうすぐ自分の番の受注（2026-10-22）。緑枠にする。
  // ・ほかの工程がどれか済んでいる。工程表発行済（印刷日時）や 抜き作業中 のような記録の無い進行、材料・在庫の状況は数えない
  // ・品名の #タグの並びで自分より前の部屋が全部済んでいる（#o#nao#ki の機械貼は、オートンと Nao の両方が済むまで緑枠にしない）
  // ・材料の入荷（進行社外が readyOut。機械貼は 機械貼材料入荷済、オートン・たおしは シート材料入荷済・在庫シート利用）も、工程が済んだのと同じに数える。
  //   前の部屋が全部済んでいることは材料のときも求める
  // 返すのは一番新しく済んだ工程（材料の入荷ならその値）
  function mineReady(o, v) {
    if (!v || !(v.mine || []).length || o.closed || mineDone(o, v)) return null;
    const list = doneSteps(o).filter(x => x.s.group !== 'status');
    const mat = (v.readyOut || []).includes(o.progOut) ? o.progOut : '';
    if (!list.length && !mat) return null;
    const tags = itemTags(o), mine = viewTags(v);
    const at = tags.findIndex(t => mine.includes(t));
    if (at > 0 && !tags.slice(0, at).every(t => tagDone(o, t))) return null;
    return { label: mat || list[list.length - 1].s.label + ' 済' };
  }

  /* ---------- 工程を選ぶ ---------- */
  const current = () => S.orders.find(o => o.id === S.sel);
  const hasTag = (o, tag) => !!tag && String(o.kotei || '').includes('|' + tag + '|');

  function selectOrder(id) {
    hideToast();
    S.auxFor = null; // 開き直したら補助の開閉は初めの状態に戻す
    S.sel = id; S.pendingStep = null; renderOrders(); renderSteps(); showCloseLabel();
    $('stepCard').hidden = false; say($('stepMsg'), '');
    scrollToCard($('stepCard'));
  }
  // 工程カードを見出しのすぐ下まで動かす（2026-10-30）。Android の Chrome では scrollIntoView のなめらかな動きが、
  // キーボードが閉じるときの高さの変化や画像の読み込みで途中で止まり、カードまで下りないことがあった。
  // スクロールする箱を自分で計算して動かし、少し待ってもカードが見出しの下に来ていなければ一気に飛ぶ
  function scrollToCard(el) {
    const sc = scroller();
    const head = [$('listHead'), $('findHead')].find(x => x && !x.hidden);
    const want = () => (sc === window ? 0 : sc.getBoundingClientRect().top) + (head ? head.offsetHeight : 0) + 8;
    const go = (behavior) => {
      const y = el.getBoundingClientRect().top - want() + scrollTopOf(sc);
      sc.scrollTo({ top: Math.max(0, y), behavior });
    };
    requestAnimationFrame(() => go('smooth'));
    setTimeout(() => { if (!el.hidden && Math.abs(el.getBoundingClientRect().top - want()) > 40) go('auto'); }, 700);
  }

  // 記録せずに一覧へ戻る（2026-10-23）。選んだ行の表示は残し、その行まで戻る。閉じたので自動の読み直しも再開する
  $('closeDetail').onclick = () => {
    if (busyNow()) return;
    const id = S.sel;
    $('stepCard').hidden = true; $('variants').hidden = true; S.pendingStep = null;
    renderOrders();
    const row = id && document.querySelector(`.order[data-id="${id}"]`);
    if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.focus({ preventScroll: true }); }
  };
  function showCloseLabel() { $('closeDetail').textContent = S.mode === 'list' ? '← 一覧へ戻る' : '← 閉じる'; }

  /* ---------- 書き込みの結果が分からないとき（2026-10-23） ---------- */
  // 通信が切れた・応答が読めない書き込みは、保存されたかもしれないし、されていないかもしれない。
  // 送り直しはせず、この受注の記録・変更ボタンを止めて「記録の状態を確認」（読み取りだけ）を案内する
  function markUnsure(o, what) {
    S.unsure = { id: o.id, what };
    renderSteps();
    say($('stepMsg'), '');
    $('unsureBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function applyUnsure(o) {
    const on = !!(S.unsure && o && S.unsure.id === o.id);
    $('unsureBox').hidden = !on;
    if (on) $('unsureText').textContent = `通信が途切れ、${S.unsure.what}が保存されたか確認できません（保存されなかったとは限りません）。` +
      'もう一度押す前に「記録の状態を確認」で最新の状態を読み込んでください。確認できるまで、この受注のボタンは押せません。';
    // 書き込みのボタン（主操作・工程・取消・材料・Room・数量／納期／紙入荷日の保存・新規受注・削除）は data-w でまとめて止める
    applyLocks();
  }
  // 最新の状態を読み込む（読み取りだけ）。読めたときだけ「確認できた」とし、開いている受注のカードも作り直す
  $('unsureBtn').onclick = async () => {
    const o = current(); if (!o) return;
    $('unsureBtn').disabled = true;
    say($('stepMsg'), '最新の状態を読み込んでいます…');
    const ok = S.mode === 'list' ? await loadView(S.view, true) : await reloadFind(o);
    $('unsureBtn').disabled = false;
    if (!ok) return say($('stepMsg'), '読み込めなかったので、まだ確認できていません。電波を確かめてもう一度押してください', 'err');
    syncDetail('最新の状態を読み込みました。記録・変更が反映されているか確かめてください');
  };
  // 品番で探す画面の受注を読み直す（読み取りだけ）
  async function reloadFind(o) {
    const gen = ++findGen;
    const j = S.findBy === 'item' ? await api({ action: 'items', ...S.findKeys })
      : await api({ action: 'orders', book: o.book, wc: String(o.wc), archived: !!S.findArch });
    if (gen !== findGen || S.mode !== 'find') return false;
    if (!j.ok || !Array.isArray(j.orders)) return false;
    S.orders = pinNew(j.orders); S.steps = j.steps || S.steps; S.rooms = j.rooms || S.rooms;
    renderOrders();
    return true;
  }
  // 手で最新を読んだ後に、開いている受注のカードを合わせる。受注が一覧から外れていたら閉じて知らせる。
  // 自動の読み直しでは呼ばない（入力中の数量・納期を消さないため）
  function syncDetail(text) {
    if ($('stepCard').hidden || !S.sel) return;
    const id = S.sel;
    if (S.unsure && S.unsure.id === id) S.unsure = null;
    if (!current()) {
      $('stepCard').hidden = true; $('variants').hidden = true; S.sel = null;
      renderOrders();
      say(S.mode === 'list' ? $('listMsg') : $('findMsg'), `${text}（開いていた受注はこの一覧から外れました）`, 'warn');
      return;
    }
    renderSteps();
    say($('stepMsg'), text, 'ok');
  }

  // 工程カードを開いた作業リスト。部門別などの作業リストから開いたときだけ。品番・品名で探したときは前に見ていたリストを使わない
  const detailView = () => (S.mode === 'list' ? S.views.find(x => x.key === S.view) || null : null);

  /* ---------- 上部の主操作（2026-11-03） ---------- */
  // 表示の優先度だけを決める（記録できるかどうかの判定は変えない。送信は chooseStep → doComplete → write のまま）。
  // ・CAD: CADカット完了 と 仕上がりました の2つ（2026-11-09 ユーザー指定）
  // ・オートン抜き／機械貼／手貼り: その工程
  // ・たおし抜き: 工程(自動) に K判・M判 の片方だけがあればその工程。両方・どちらも無ければ2つを同じ強さで出す
  // ・2F 小／Nao: シール貼完了 と 仕上がりました のまだのものを同じ強さで出す（自動ではどちらも選ばない）
  // ・お守箔焼印・断裁ステッチ・プレ・全件・Recent・Fax・検索・定義の足りないもの: 「工程を選んで記録」（工程の一覧を開く）
  // 閉じた受注・自分の工程が済の受注には、自動で選んだ完了ボタンを出さない
  const PRIMARY = { cad: ['cad', 'finish'], auton: ['o'], kikai: ['kikai'], tebari: ['tebari'], taoshi: 'taoshi', f2: ['seal', 'finish'], nao: ['seal', 'finish'] };
  function primaryPlan(o, v) {
    const plan = { keys: [], closed: !!o.closed, md: v && hasMine(v) ? mineDone(o, v) : null };
    if (plan.closed || plan.md || !v || !hasMine(v)) return plan;
    let keys = PRIMARY[v.key];
    if (keys === 'taoshi') {
      const hit = (v.mine || []).filter(k => (S.steps.find(s => s.key === k)?.variants || []).some(x => hasTag(o, x.tag)));
      keys = hit.length === 1 ? hit : (v.mine || []);
    }
    if (!Array.isArray(keys) || !keys.length) return plan;
    const steps = keys.map(k => S.steps.find(s => s.key === k));

  // 補助の開閉の初めの状態。材料待ちのときだけ「材料・在庫の状況」を開く

  // 工程記録から見た残りの工程（2026-11-03）。品名の #タグで並びが説明でき、どの工程も完了を判定できるときだけ順番（→）で出す。
  // それ以外は候補として並べるだけ。空のときも「全部終わった」とは言わない。部門別の作業リストから開いたときだけ（検索では追加で読みに行かない）
  function nextGuide(o, v) {
    if (!v || !hasMine(v) || !S.steps.length || !S.views.length) return { kind: 'nodata', text: '工程列と完了記録を確認してください' };
    if (o.done.finish || o.progIn === '仕上がりました') return { kind: 'end', text: '仕上がりの記録があります' };
    if (o.group === '最終') return { kind: 'end', text: '現在は仕上がり済の扱いです' };
    if (o.closed) return { kind: 'end', text: `受注は「${o.progOut}」です` };
    const info = itemTagInfo(o);
    if (!info.all.length) return { kind: 'none', text: '次工程を確認してください' };
    const left = info.all.filter(t => !tagDone(o, t));
    if (!left.length) return { kind: 'empty', text: '表示できる残工程はありません。必要な作業を確認してください' };
    const judged = (t) => S.views.some(x => viewTags(x).includes(t)) || S.steps.some(s => s.variants.some(x => x.tag === t));
    const names = left.map(roomLabel);
    if (info.all.every(t => info.fromItem.includes(t) && judged(t))) {

  // 補助の工程一覧。まだの工程は「その他の工程を記録」（上部に出した工程は除く）、状況（材料・在庫）は「材料・在庫の状況」、
  // 済の工程は「進行と完了記録」に分ける。どの工程にも上部かここのどちらか1か所から届く
  function renderStepLists(o, plan) {
    const other = $('stepsOther'), status = $('stepsStatus'), doneBox = $('stepsDone');

      const byProg = !done && s.variants.some(v => v.value === o.progIn);

  // 仕様（2026-11-05）。空の欄は出さない。キーはサーバーの SPEC_KEYS と同じ
  const SPEC_LABEL = [['kname', 'Kname'], ['material', '材料'], ['paperSize', '紙サイズ'], ['cutSize', '断裁サイズ'], ['packUnit', '入数'], ['preNdate', 'PreNdate'], ['wscd', 'info_wscd']];

  /* ---------- 工程表のコピー印刷（2026-11-05） ---------- */
  // 押すとサーバーが依頼の表に1行書き、事務所の新PC（kotei_print_file.py --copy）が拾って刷る。
  // Excel・受注の 工程表印刷済・進行社内 は変えない。依頼ID は1回ごとに作り、結果が分からないときは同じ ID で送り直す。
  // 依頼中（依頼済・印刷中）の間は、カードを開いている間だけ 15秒ごとに状況を読み直す（10分まで）
  const KC_LABEL = { '依頼済': '印刷待ち', '印刷中': '印刷中', '印刷済': '印刷しました', '失敗': '印刷できませんでした' };

  const hm = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo' }); };
  S.kc = {}; // 受注ID → { last: 直近の依頼, at: 読んだ時刻, retry: 結果不明の依頼ID, msg, cls }
  function renderKoteiCopy(o) {
    const box = $('koteiCopy'); box.textContent = '';
    const st = S.kc[o.id] || (S.kc[o.id] = {});
    const b = document.createElement('button'); b.type = 'button'; b.className = 'amtbtn'; b.textContent = '🖨 工程表を印刷（コピー）';

    else line.textContent = '事務所のプリンタで工程表をもう1枚刷ります（Excel・受注の記録は変えません）';

  }
  async function kcLoad(id) {
    const st = S.kc[id] || (S.kc[id] = {});
    if (st.loading) return; st.loading = true;
    const j = await api({ action: 'koteiCopyStatus', id }).catch(() => ({ ok: false }));
    st.loading = false; st.at = Date.now();
    if (j.ok) {
      const was = st.last;
      st.last = j.requests?.[0] || null;
      if (kcPending(st.last) && !st.pollFrom) st.pollFrom = Date.now();
      if (was && kcPending(was) && st.last && !kcPending(st.last) && st.last.reqId === was.reqId) {
        st.msg = st.last.state === '印刷済' ? `工程表を印刷しました（${hm(st.last.doneAt)}）` : `印刷できませんでした${st.last.memo ? '：' + st.last.memo : ''}`;
        st.cls = st.last.state === '印刷済' ? 'ok' : 'err';
      }

    if (current()?.id === id) renderKoteiCopy(current());

  }
  function kcPoll(id) {
    const st = S.kc[id];
    clearTimeout(st.timer);
    if (!kcPending(st.last) || Date.now() - (st.pollFrom || 0) > 600000) return;
    st.timer = setTimeout(() => { if (current()?.id === id && !$('stepCard').hidden) { st.at = 0; kcLoad(id); } }, 15000);
  }
  async function kcRequest(o) {

${o.book} / ${o.wc}

工程表のコピーを事務所のプリンタで1枚印刷します。
Excel と受注の記録（工程表印刷済・進行）は変えません。`)) return;
