<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>工程の完了を記録</title>
<style>
  :root{ --bg:#0b0f14; --txt:#e6f0ff; --mut:rgba(230,240,255,.62); --line:rgba(255,255,255,.12);
    --card:rgba(255,255,255,.05); --a:#4f8cff; --p:#a855f7; --ok:#22c55e; --err:#f87171; --warn:#f59e0b; }
  *{ box-sizing:border-box } [hidden]{ display:none !important }
  html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif }
  .wrap{ max-width:640px; margin:0 auto; padding:12px 14px 40px; display:flex; flex-direction:column; gap:12px }
  .bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px; color:var(--mut) }
  .bar b{ color:var(--txt) } .bar a{ color:#93c5fd; text-decoration:none }
  h1{ margin:0; font-size:22px; letter-spacing:.06em }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px }
  .row{ display:flex; gap:8px; align-items:center }
  input{ min-width:0; font-size:20px; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06); color:var(--txt) }
  select{ font-size:20px; padding:10px 8px; border-radius:12px; border:1px solid rgba(255,255,255,.16);
    background:#1a2230; color:var(--txt) }
  #book{ width:5.2em } #wc{ flex:1 }
  .tabs{ display:flex; gap:6px; background:rgba(255,255,255,.06); padding:4px; border-radius:14px }
  .tabs button{ flex:1; padding:12px 6px; font-size:17px; background:transparent; color:var(--mut) }
  .tabs button.on{ background:var(--a); color:#fff }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; align-items:center }
  .chips button{ padding:8px 14px; font-size:15px; background:rgba(255,255,255,.10) }
  .chips button.on{ background:var(--p) }
  .chips .sp{ flex:1 }
  .lrow{ display:flex; gap:8px; align-items:stretch }
  .lrow .order{ flex:1; min-width:0 }
  .order .item{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere }
  .wrap > *, .card > *{ min-width:0 }
  .late{ color:#fca5a5 }
  /* 一覧で進行が見えるよう、工程ごとの小さな札を並べる */
  .prog{ display:flex; flex-wrap:wrap; gap:4px; margin-top:4px }
  .pc{ font-size:13px; font-weight:700; padding:3px 7px; border-radius:7px; line-height:1.3;
    background:rgba(255,255,255,.07); color:rgba(230,240,255,.55); border:1px dashed rgba(255,255,255,.18) }
  .pc.ok{ background:rgba(34,197,94,.20); color:#bbf7d0; border:1px solid rgba(34,197,94,.45) }
  .pc.out{ background:rgba(245,158,11,.16); color:#fde68a; border:1px solid rgba(245,158,11,.35) }
  .memo{ font-size:13px; color:#fde68a; font-weight:600 }
  button{ font:inherit; font-weight:800; border:0; border-radius:12px; color:#fff; cursor:pointer; -webkit-tap-highlight-color:transparent }
  button:active{ transform:scale(.985) } button:disabled{ opacity:.5 }
  .btn{ padding:12px 14px; background:var(--a); white-space:nowrap }
  .ghost{ background:rgba(255,255,255,.12) }
  .camwrap{ position:relative; border-radius:12px; overflow:hidden; background:#000; aspect-ratio:4/3 }
  video{ width:100%; height:100%; object-fit:cover; display:block }
  .camhint{ position:absolute; left:0; right:0; bottom:0; padding:8px; font-size:13px; text-align:center; background:rgba(0,0,0,.55) }
  .order{ text-align:left; padding:12px; border-radius:12px; border:2px solid transparent; background:rgba(255,255,255,.06); color:var(--txt); display:flex; flex-direction:column; gap:4px }
  .order.sel{ border-color:var(--a); background:rgba(79,140,255,.16) }
  .order.closed{ opacity:.5 }
  .order .item{ font-size:18px } .order .meta, .target .meta{ font-size:14px; color:var(--mut); font-weight:600 }
  .target{ font-size:15px; line-height:1.5; display:flex; flex-direction:column; gap:4px } .target .item{ font-size:20px; font-weight:800 }
  /* 数量と納期は一番大きく。Airtable で小さくて読みにくかった点の改善 */
  .facts{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 20px; font-size:15px; font-weight:700; color:var(--mut) }
  .facts b{ font-size:26px; line-height:1.15; color:var(--txt); letter-spacing:.02em; margin-left:4px }
  .facts .late b{ color:#f87171 } .facts .soon b{ color:#fbbf24 }
  .facts .when{ font-size:13px; font-weight:800; margin-left:6px; padding:2px 7px; border-radius:6px }
  .facts .late .when{ background:rgba(248,113,113,.18); color:#fca5a5 }
  .facts .soon .when{ background:rgba(251,191,36,.18); color:#fde68a }
  .steps{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .stephead{ grid-column:1/-1; font-size:14px; color:var(--mut); font-weight:700; margin-top:6px }
  .step.status{ background:linear-gradient(135deg,#334155 0%,#475569 100%) }
  .step{ min-height:72px; padding:8px; font-size:18px; letter-spacing:.02em; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; background:linear-gradient(135deg,#6d28d9 0%,var(--p) 60%,#c084fc 110%) }
  .step.rec{ outline:3px solid #fde68a; outline-offset:-3px }
  .step.done{ background:rgba(34,197,94,.22); color:#bbf7d0 }
  .step small{ font-size:12px; font-weight:700; letter-spacing:0; opacity:.95 }
  .variants{ display:flex; flex-wrap:wrap; gap:8px }
  .variants button{ flex:1 1 30%; padding:16px 8px; font-size:18px; background:var(--p) }
  .variants button.rec{ outline:3px solid #fde68a; outline-offset:-3px }
  .msg{ font-size:15px; line-height:1.5; min-height:1.2em } .msg.err{ color:var(--err) } .msg.ok{ color:var(--ok) } .msg.warn{ color:var(--warn) }
  .toast{ position:fixed; left:12px; right:12px; bottom:14px; max-width:616px; margin:0 auto; padding:14px; border-radius:14px;
    background:#14532d; border:1px solid #22c55e; display:flex; gap:10px; align-items:center; justify-content:space-between; box-shadow:0 10px 30px rgba(0,0,0,.5) }
  .toast .t{ font-weight:800; font-size:16px }
</style>
</head>
<body>
<main class="wrap">
  <div class="bar"><a href="/">← トップ</a><span id="who"></span></div>
  <h1>工程の完了を記録</h1>
  <nav class="tabs" role="tablist">
    <button type="button" id="tabList" role="tab">作業リスト</button>
    <button type="button" id="tabFind" role="tab">品番で探す</button>
  </nav>

  <!-- 作業リスト（Airtable のビューをそのまま表示） -->
  <section class="card" id="listCard" hidden>
    <div class="chips" id="viewChips"></div>
    <div class="msg" id="listMsg" role="status"></div>
    <div id="list" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>

  <!-- 1. 受注を探す -->
  <section class="card" id="findCard">
    <div class="row">
      <button class="btn" id="camBtn" type="button">工程表のQRを読む</button>
      <span class="msg" id="camMsg"></span>
    </div>
    <div class="camwrap" id="camWrap" hidden>
      <video id="video" playsinline muted></video>
      <div class="camhint">工程表のQRを枠いっぱいに映してください</div>
    </div>
    <div class="row">
      <select id="book" aria-label="Book"><option>Ko</option><option>Ta</option><option>Yo</option></select>
      <input id="wc" placeholder="WorkCord" inputmode="numeric" autocomplete="off" aria-label="WorkCord" />
      <button class="btn ghost" id="searchBtn" type="button">検索</button>
    </div>
    <div class="msg" id="findMsg" role="status"></div>
    <div id="orders" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>

  <!-- 2. 工程を選んで完了 -->
  <section class="card" id="stepCard" hidden>
    <div class="target" id="target"></div>
    <div class="steps" id="steps"></div>
    <div class="variants" id="variants" hidden></div>
    <div class="msg" id="stepMsg" role="status"></div>
  </section>
</main>

<div class="toast" id="toast" hidden role="status">
  <span class="t" id="toastText"></span>
  <button class="btn ghost" id="undoBtn" type="button">取り消す</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" crossorigin="anonymous"></script>
<script src="/js/auth-client.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const say = (el, t, cls) => { el.textContent = t || ''; el.className = 'msg ' + (cls || ''); };

  const me = await DLAuth.requireLogin();
  if (!me) return;
  $('who').innerHTML = ''; const b = document.createElement('b'); b.textContent = me.name; $('who').append(b, ' さん');

  const S = { orders: [], steps: [], views: [], view: '', mode: 'list', sel: null, pendingStep: null, lastUndo: null };

  // Book は Ko / Ta / Yo から選ぶ。QR に別の値が来たときだけ選択肢を足す
  function setBook(v) {
    const sel = $('book'); v = String(v || '').trim();
    if (!v) return;
    if (![...sel.options].some(o => o.value === v)) { const o = document.createElement('option'); o.textContent = v; sel.append(o); }
    sel.value = v;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  async function api(body) {
    const r = await fetch('/api/airtable-update-progress', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json', 'x-csrf': await DLAuth.csrf() },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({ ok: false, error: '通信に失敗しました' }));
    j.status = r.status;
    if (j.needLogin) location.replace(DLAuth.loginUrl());
    return j;
  }

  /* ---------- QR ---------- */
  // 対応する形式: order-Book-WC / die-Book-WC / Ta:230 / URL の ?book=&wc=
  function parseQr(raw) {
    const t = String(raw || '').trim().replace(/[‐-―−ー－]/g, '-');
    let m = /^(?:order|die)-([^-\s]+)-([^-\s]+)/i.exec(t);
    if (m) return { book: m[1], wc: m[2] };
    m = /^([A-Za-z]{1,3}):(\d+)$/.exec(t);
    if (m) return { book: m[1], wc: m[2] };
    try {
      const u = new URL(t);
      const book = u.searchParams.get('book') || u.searchParams.get('Book') || '';
      const wc = u.searchParams.get('wc') || u.searchParams.get('WorkCord') || '';
      if (book && wc) return { book, wc };
    } catch {}
    m = /order(?:[_-]?plain)?[:\s-]+([^\s/:-]+)[\s/:-]+([^\s/:-]+)/i.exec(t);
    return m ? { book: m[1], wc: m[2] } : null;
  }

  let stream = null, scanTimer = null, detector = null;
  async function startCam() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    } catch (e) { say($('camMsg'), 'カメラを使えません。下に品番を入れてください。', 'err'); return; }
    const v = $('video'); v.srcObject = stream; await v.play().catch(() => {});
    $('camWrap').hidden = false; $('camBtn').textContent = 'カメラを止める'; say($('camMsg'), '');
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch { detector = null; } }
    const c = document.createElement('canvas'); const ctx = c.getContext('2d', { willReadFrequently: true });
    scanTimer = setInterval(async () => {
      if (!v.videoWidth) return;
      let raw = '';
      try {
        if (detector) { const r = await detector.detect(v); raw = r[0]?.rawValue || ''; }
        else if (window.jsQR) {
          const sc = Math.min(1, 960 / v.videoWidth); c.width = v.videoWidth * sc; c.height = v.videoHeight * sc;
          ctx.drawImage(v, 0, 0, c.width, c.height);
          raw = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' })?.data || '';
        }
      } catch {}
      if (!raw) return;
      const p = parseQr(raw);
      if (!p) { say($('camMsg'), '工程表のQRではないようです', 'warn'); return; }
      stopCam(); navigator.vibrate?.(60);
      setBook(p.book); $('wc').value = p.wc; setMode('find'); search();
    }, 160);
  }
  function stopCam() {
    clearInterval(scanTimer); scanTimer = null;
    stream?.getTracks().forEach(t => t.stop()); stream = null;
    $('camWrap').hidden = true; $('camBtn').textContent = '工程表のQRを読む';
  }
  $('camBtn').onclick = () => (stream ? stopCam() : startCam());

  /* ---------- 受注を探す ---------- */
  async function search() {
    const book = $('book').value.trim(), wc = $('wc').value.trim();
    if (!book || !wc) return say($('findMsg'), 'Book と WorkCord を入れてください', 'err');
    say($('findMsg'), '探しています…'); $('orders').textContent = ''; $('stepCard').hidden = true; S.sel = null;
    const j = await api({ action: 'orders', book, wc });
    if (!j.ok) return say($('findMsg'), j.error || '探せませんでした', 'err');
    S.orders = j.orders; S.steps = j.steps;
    if (!j.orders.length) return say($('findMsg'), `${book} / ${wc} の受注は見つかりません`, 'err');
    const open = j.orders.filter(o => !o.closed);
    say($('findMsg'), open.length > 1 ? `受注が${open.length}件あります。どれか選んでください` : '');
    renderOrders();
    if (open.length === 1) selectOrder(open[0].id);
  }
  $('searchBtn').onclick = search;
  $('wc').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

  function fmtDate(d) { return d ? d.slice(5).replace('-', '/') : '-'; }
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const todayJST = () => new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
  function daysFromToday(d) {
    const [y, m, dd] = d.split('-').map(Number); const [ty, tm, td] = todayJST().split('-').map(Number);
    return Math.round((Date.UTC(y, m - 1, dd) - Date.UTC(ty, tm - 1, td)) / 86400000);
  }
  // 数量と納期の大きな表示。納期は曜日つき、過ぎていれば赤、今日・明日は黄色
  function facts(o) {
    const f = document.createElement('div'); f.className = 'facts';
    const q = document.createElement('span'); const qb = document.createElement('b');
    qb.textContent = o.amount == null ? '-' : Number(o.amount).toLocaleString('ja-JP');
    q.append('数量', qb);
    const n = document.createElement('span'); const nb = document.createElement('b');
    n.append('納期', nb);
    if (o.ndate) {
      const [y, m, d] = o.ndate.split('-').map(Number);
      nb.textContent = `${m}/${d}(${WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`;
      const diff = daysFromToday(o.ndate);
      const w = document.createElement('span'); w.className = 'when';
      if (diff < 0) { n.className = 'late'; w.textContent = `${-diff}日過ぎ`; n.append(w); }
      else if (diff === 0) { n.className = 'soon'; w.textContent = '今日'; n.append(w); }
      else if (diff === 1) { n.className = 'soon'; w.textContent = '明日'; n.append(w); }
    } else nb.textContent = '-';
    f.append(q, n);
    return f;
  }

  // 「佐藤 2026-10-03 14:20」→「佐藤 10/03」
  const shortStamp = (t) => { const m = /^(.*?)\s+\d{4}-(\d\d)-(\d\d)/.exec(t || ''); return m ? `${m[1]} ${m[2]}/${m[3]}` : (t || ''); };

  function progressStrip(o) {
    const box = document.createElement('div'); box.className = 'prog';
    // 済んだものだけ出す。未完了の札（灰色）は「オートン抜き完了」などの名前が済と誤解されるため出さない（2026-10-03）
    for (const s of S.steps) {
      const d = o.done[s.key];
      // Airtable で直接 進行社内 を入れた受注は記録欄が空。進行社内がこの工程の値なら、名前なしで済にする
      const byProg = !d && s.variants.some(v => v.value === o.progIn);
      if (!d && !byProg) continue;
      const c = document.createElement('span'); c.className = 'pc ok';
      c.textContent = d ? `${s.label} ✓ ${shortStamp(d)}` : `${s.label} ✓`;
      box.append(c);
    }
    if (o.progOut) { const c = document.createElement('span'); c.className = 'pc out'; c.textContent = o.progOut; box.append(c); }
    return box;
  }
  function memoLine(o) {
    if (!o.memo) return null;
    const m = document.createElement('div'); m.className = 'memo'; m.textContent = '連絡: ' + o.memo; return m;
  }

  function renderOrders() {
    if (S.mode === 'list') return renderList();
    const box = $('orders'); box.textContent = '';
    for (const o of S.orders) {
      const el = document.createElement('button'); el.type = 'button';
      el.className = 'order' + (o.closed ? ' closed' : '') + (S.sel === o.id ? ' sel' : '');
      const it = document.createElement('div'); it.className = 'item'; it.textContent = o.item || '(品名なし)';
      const mt = document.createElement('div'); mt.className = 'meta';
      mt.textContent = `${o.book} / ${o.wc} ・ ${o.progIn || '進行なし'}`;
      el.append(it, facts(o), mt, progressStrip(o));
      const mm = memoLine(o); if (mm) el.append(mm);
      el.onclick = () => selectOrder(o.id);
      box.append(el);
    }
  }

  /* ---------- タブ ---------- */
  function setMode(m) {
    S.mode = m; store.set('process.mode', m);
    $('tabList').classList.toggle('on', m === 'list'); $('tabFind').classList.toggle('on', m === 'find');
    $('listCard').hidden = m !== 'list'; $('findCard').hidden = m !== 'find';
    $('stepCard').hidden = true; S.sel = null; $('variants').hidden = true;
    if (m === 'list') { stopCam(); loadView(S.view || store.get('process.view') || ''); }
    else { S.orders = []; renderOrders(); say($('findMsg'), ''); }
  }
  $('tabList').onclick = () => setMode('list');
  $('tabFind').onclick = () => setMode('find');

  /* ---------- 作業リスト ---------- */
  async function loadView(key, refresh) {
    say($('listMsg'), '読み込み中…');
    const j = await api({ action: 'view', view: key || 'cad', refresh: !!refresh });
    if (!j.ok) return say($('listMsg'), j.error || '読み込めませんでした', 'err');
    S.views = j.views; S.steps = j.steps; S.view = j.view || j.views[0].key;
    store.set('process.view', S.view);
    if (S.mode !== 'list') return;
    S.orders = j.rows;
    renderChips();
    say($('listMsg'), j.rows.length ? `${j.rows.length}件` : 'このリストに作業はありません');
    renderList();
  }

  function renderChips() {
    const box = $('viewChips'); box.textContent = '';
    for (const v of S.views) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = v.label;
      if (v.key === S.view) b.classList.add('on');
      b.onclick = () => { S.sel = null; $('stepCard').hidden = true; loadView(v.key); };
      box.append(b);
    }
    const sp = document.createElement('span'); sp.className = 'sp'; box.append(sp);
    const r = document.createElement('button'); r.type = 'button'; r.textContent = '更新';
    r.onclick = () => loadView(S.view, true); box.append(r);
  }


  function renderList() {
    const box = $('list'); box.textContent = '';
    const v = S.views.find(x => x.key === S.view);
    for (const o of S.orders) {
      const row = document.createElement('div'); row.className = 'lrow';
      const el = document.createElement('button'); el.type = 'button';
      el.className = 'order' + (S.sel === o.id ? ' sel' : '');
      const it = document.createElement('div'); it.className = 'item'; it.textContent = o.item || '(品名なし)';
      const mt = document.createElement('div'); mt.className = 'meta';
      mt.textContent = `${o.book} / ${o.wc} ・ ${o.progIn || '進行なし'}`;
      el.append(it, facts(o), mt, progressStrip(o));
      const mm = memoLine(o); if (mm) el.append(mm);
      el.onclick = () => selectOrder(o.id);
      row.append(el);
      box.append(row);
    }
  }

  /* ---------- 工程を選ぶ ---------- */
  const current = () => S.orders.find(o => o.id === S.sel);
  const hasTag = (o, tag) => !!tag && String(o.kotei || '').includes('|' + tag + '|');

  function selectOrder(id) {
    S.sel = id; S.pendingStep = null; renderOrders(); renderSteps();
    $('stepCard').hidden = false; say($('stepMsg'), '');
    $('stepCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderSteps() {
    const o = current(); if (!o) return;
    const t = $('target'); t.textContent = '';
    const it = document.createElement('div'); it.className = 'item'; it.textContent = o.item || '(品名なし)';
    const mt = document.createElement('div'); mt.className = 'meta';
    mt.textContent = `${o.book} / ${o.wc} ・ 今の進行: ${o.progIn || 'なし'}`;
    t.append(it, facts(o), mt);

    const box = $('steps'); box.textContent = '';
    let lastGroup = 'done';
    for (const s of S.steps) {
      if (s.group !== lastGroup) {
        const h = document.createElement('div'); h.className = 'stephead'; h.textContent = '状況（材料・在庫）';
        box.append(h); lastGroup = s.group;
      }
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'step' + (s.group === 'status' ? ' status' : '');
      if (s.variants.some(v => hasTag(o, v.tag))) btn.classList.add('rec');
      const done = o.done[s.key];
      if (done) btn.classList.add('done');
      btn.append(document.createTextNode(s.label));
      if (done) { const sm = document.createElement('small'); sm.textContent = '済 ' + done; btn.append(sm); }
      btn.onclick = () => chooseStep(s);
      box.append(btn);
    }
    $('variants').hidden = true;
  }

  function chooseStep(s) {
    const o = current();
    if (!o) return;
    if (s.variants.length > 1 && $('stepCard').hidden) { selectOrder(o.id); }
    if (s.variants.length === 1) return doComplete(s, s.variants[0]);
    // 抜き・手貼りは種類を選ぶ。工程(自動)から分かるものを目立たせる
    S.pendingStep = s;
    const box = $('variants'); box.textContent = ''; box.hidden = false;
    for (const v of s.variants) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = v.label;
      if (hasTag(o, v.tag)) b.classList.add('rec');
      b.onclick = () => doComplete(s, v);
      box.append(b);
    }
    say($('stepMsg'), `${s.label}の種類を選んでください`);
  }

  async function doComplete(s, v, force) {
    const o = current(); if (!o) return;
    if (!force && o.group === '最終' && s.key !== 'finish' &&
        !confirm(`この受注はもう「${o.progIn}」です。\n${v.value} にしてよいですか？`)) return;
    say($('stepMsg'), '記録しています…');
    document.querySelectorAll('.step, .variants button').forEach(b => b.disabled = true);
    const j = await api({ action: 'complete', id: o.id, step: s.key, variant: v.key, force: !!force });
    document.querySelectorAll('.step, .variants button').forEach(b => b.disabled = false);
    if (j.conflict) {
      if (confirm(`${j.error}\n上書きしますか？`)) return doComplete(s, v, true);
      return say($('stepMsg'), '記録しませんでした', 'warn');
    }
    if (!j.ok) return say($('stepMsg'), j.error || '記録できませんでした', 'err');
    o.done[s.key] = j.stamp; o.progIn = j.value; o.group = (s.key === 'finish') ? '最終' : o.group;
    renderSteps(); renderOrders();
    if (S.mode === 'list') {
      // ビューの条件で完了した行は消えることがあるので、取り直してから表示をそろえる
      await loadView(S.view, true);
      if (!current()) { $('stepCard').hidden = true; S.sel = null; }
    }
    say($('stepMsg'), `${j.value} を記録しました`, 'ok');
    navigator.vibrate?.([40, 40, 40]);
    showUndo({ id: o.id, step: s.key, variant: v.key, prev: j.prev, prevRecord: j.prevRecord, label: j.value });
  }

  /* ---------- 取り消し ---------- */
  let toastTimer = null;
  function showUndo(u) {
    S.lastUndo = u; $('toastText').textContent = `${u.label} を記録しました`; $('toast').hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true; S.lastUndo = null; }, 60000);
  }
  $('undoBtn').onclick = async () => {
    const u = S.lastUndo; if (!u) return;
    $('undoBtn').disabled = true;
    const j = await api({ action: 'undo', id: u.id, step: u.step, variant: u.variant, prev: u.prev, prevRecord: u.prevRecord });
    $('undoBtn').disabled = false; $('toast').hidden = true; S.lastUndo = null;
    if (!j.ok) return say($('stepMsg'), j.error || '取り消せませんでした', 'err');
    say($('stepMsg'), `${u.label} を取り消しました`, 'warn');
    if (S.mode === 'list') await loadView(S.view, true);
    else { await search(); if (S.orders.some(o => o.id === u.id)) selectOrder(u.id); }
  };

  // URLで品番を渡されたら（?book=Ta&wc=230）すぐ探す
  const q = new URLSearchParams(location.search);
  // ?view=omamori のように作業リストを直接開ける（ホーム画面のショートカット用）
  if (q.get('view')) { store.set('process.view', q.get('view')); store.set('process.mode', 'list'); }
  if (q.get('book') && q.get('wc')) { setBook(q.get('book')); $('wc').value = q.get('wc'); setMode('find'); search(); }
  else setMode(store.get('process.mode') === 'find' ? 'find' : 'list');
})();
</script>
</body>
</html>
